    screen: (window.innerWidth||0)+"x"+(window.innerHeight||0),

    stations: (S.stations||[]).length, requests: (S.requests||[]).length,

    cycles: cyclesOn()? "on":"off",

    weekOpen: (wk.unfilled||[]).length

}
function logBug(rec){
  S.bugs = S.bugs || [];
  rec.id = rec.id || uid("bug");
  rec.at = rec.at || Date.now();
  rec.ctx = rec.ctx || bugContext();
  /* the same crash twenty times is one report */
  const twin = S.bugs.find(b=>b.kind===rec.kind && b.note===rec.note && b.auto===rec.auto);
  if(twin){ twin.seen=(twin.seen||1)+1; twin.at=rec.at; }
  else { rec.seen=1; S.bugs.push(rec); }
  if(S.bugs.length>200) S.bugs = S.bugs.slice(-200);
  lsSave();
  /* quietly file it upstream too, so reports arrive without anyone pressing send */
  try{
    if(typeof FB!=="undefined" && FB && FB.user){
      const b=twin||rec;
      FB.db.doc("reports/"+FB.user.uid+"_"+b.id).set({
        uid:FB.user.uid, tester:(window.TESTER_ID||""), at:b.at, kind:b.kind||"", auto:!!b.auto,
        note:String(b.note||"").slice(0,500),
        ctx:String(typeof b.ctx==="string"? b.ctx : JSON.stringify(b.ctx||"")).slice(0,300), seen:b.seen||1
      }).catch(()=>{});
    }
  }catch(e){}
}
/* Anything the app throws is worth knowing about even if nobody reports it. */
window.addEventListener("error", ev=>{
  try{
    if(!loaded) return;
    logBug({auto:true, kind:"crash",
      note:String((ev&&ev.message)||"script error")+" @ "+String((ev&&ev.filename)||"").split("/").pop()+":"+(ev&&ev.lineno||0)});
  }catch(e){}
});
window.addEventListener("unhandledrejection", ev=>{
  try{
    if(!loaded) return;
    const r=ev&&ev.reason;
    logBug({auto:true, kind:"crash", note:"unhandled: "+String((r&&r.message)||r||"").slice(0,140)});
  }catch(e){}
});

function bugsSince(t){ return (S.bugs||[]).filter(b=>b.at > (t||0)); }
function bugDue(){
  const s=S.support||{};
  if(!s.remind) return false;
  const pending=bugsSince(s.lastSent||0);
  if(!pending.length) return false;
  const oldest=Math.min.apply(null, pending.map(b=>b.at));
  return (Date.now()-oldest) > 6*86400000 || pending.length>=10;
}
/* One plain-text note covering everything since it was last sent. */
function bugDigest(){
  const list=bugsSince((S.support||{}).lastSent||0).sort((a,b)=>a.at-b.at);
  const L=[];
  L.push("PROBLEM REPORT — "+(S.org.name||"unnamed site"));
  L.push("Covering "+(list.length? new Date(Math.min.apply(null,list.map(b=>b.at))).toLocaleDateString()+" to "+new Date().toLocaleDateString() : "no period"));
  L.push(list.length+" item"+(list.length===1?"":"s"));
  L.push("");
  list.forEach((b,i)=>{
    L.push((i+1)+". ["+(b.auto?"AUTOMATIC":"REPORTED")+"] "+(b.kind==="crash"?"Script error":bugKind(b.kind)[1]));
    L.push("   when: "+new Date(b.at).toLocaleString([],{dateStyle:"short",timeStyle:"short"})+(b.seen>1? "  (seen "+b.seen+" times)":""));
    if(b.where) L.push("   screen: "+b.where);
    if(b.note) L.push("   said: "+b.note);
    const c=b.ctx||{};
    if(c.tester) L.push("   tester: "+c.tester);
    L.push("   build "+c.build+" · "+c.view+" · "+c.screen+" · "+c.law+" · "+c.staff+" staff, "+
           c.roles+" roles, "+c.shifts+" shifts, "+c.rules+" coverage rules, "+c.groups+" groups, "+
           c.stations+" stations, "+c.requests+" requests");
    L.push("   settings: fill="+c.fill+" meals="+c.meals+" cycles="+c.cycles+
           " · that week had "+c.weekShifts+" shifts, "+c.weekOpen+" open");
    if(c.ua) L.push("   browser: "+c.ua);
    L.push("");
  });
  L.push("— no staff names, addresses or hours are included in this report —");
  return L.join("\n");
}

/* generic: elements with data-bind="path" update state on change */
let bindSaveTimer=null;
function wireCommon(root){
  root.querySelectorAll("[data-bind]").forEach(el=>{
    const path=el.dataset.bind;
    const typed = el.tagName==="TEXTAREA" ||
      (el.tagName==="INPUT" && ["text","number","time","date","email","tel"].includes(el.type));
    const commit=()=>{
      let v = el.type==="checkbox"? el.checked : (el.type==="number"? (el.value===""?0:parseFloat(el.value)) : el.value);
      if(path==="rules.stationFamilies") v = v===true || v==="1" || v===1;
      setPath(S,path,v);
      if(path==="org.name" && S.sample) S.sample=false;   /* they've made it theirs */
    };
    if(typed){
      /* Keep the caret where it is: store as they type, redraw only once they leave. */
      el.addEventListener("input",()=>{ commit(); clearTimeout(bindSaveTimer); bindSaveTimer=setTimeout(save,500); });
      el.addEventListener("blur",()=>{ commit(); save(); if(el.dataset.rerender!=="no") render(); });
    } else {
      el.addEventListener("change",()=>{ commit(); save(); if(el.dataset.rerender!=="no") render(); });
    }
  });
  root.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>go(el.dataset.go)));
  /* collapsible reference cards — remembered per device, never used for anything actionable */
  root.querySelectorAll("[data-fold]").forEach(h=>{
    h.addEventListener("click",ev=>{
      if(ev.target.closest("button,a,input,select")) return;   /* header controls still work */
      const key=h.dataset.fold, card=h.closest(".card");
      S.ui.fold=S.ui.fold||{};
      S.ui.fold[key]=!S.ui.fold[key];
      card.classList.toggle("folded", S.ui.fold[key]);
      const c=h.querySelector(".foldc"); if(c) c.textContent=S.ui.fold[key]? "+":"–";
      clearTimeout(bindSaveTimer); bindSaveTimer=setTimeout(save,400);
    });
  });
}
function folded(key){ return !!((S.ui&&S.ui.fold)||{})[key]; }
function foldHead(key, title, hintHtml){
  return `<header data-fold="${key}" style="cursor:pointer"><h3>${title}</h3>${hintHtml||""}<span class="mini foldc" style="flex:none;font-size:15px">${folded(key)?"+":"–"}</span></header>`;
}
function setPath(o,p,v){
  const k=p.split("."); let c=o;
  for(let i=0;i<k.length-1;i++){ const key=/^\d+$/.test(k[i])?+k[i]:k[i]; c=c[key]; }
  const last=/^\d+$/.test(k[k.length-1])?+k[k.length-1]:k[k.length-1];
  c[last]=v;
}

/* ---------- modal ---------- */
let MODAL_GUARD=null;   /* a dialog that shouldn't be lost to a stray Escape sets this */
function wireDialog(r){
  /* land focus inside the dialog, and keep Tab inside it */
  const box=r.querySelector(".modal"); if(!box) return;
  const SEL='input:not([type="hidden"]):not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled]),[href],[tabindex]:not([tabindex="-1"])';
  setTimeout(()=>{ if(!r.isConnected||document.activeElement&&box.contains(document.activeElement)) return;
    const f=box.querySelector(".body "+SEL.replace(/,/g,",.body "))||box.querySelector("footer button")||box.querySelector("[data-close]");
    if(f) f.focus({preventScroll:true}); },0);
  box.addEventListener("keydown",e=>{
    if(e.key!=="Tab") return;
    const els=[...box.querySelectorAll(SEL)].filter(x=>x.offsetParent!==null);
    if(!els.length) return;
    const first=els[0], last=els[els.length-1];
    if(e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
    else if(!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
  });
}
function modal(title, bodyHtml, footHtml, onMount){
  MODAL_GUARD=null;
  const r=$("#modalroot");
  r.innerHTML='<div class="scrim"><div class="modal" role="dialog" aria-modal="true"><header><h3>'+esc(title)+
    '</h3><button class="btn ghost sm" data-close>Close</button></header><div class="body">'+bodyHtml+
    '</div><footer>'+(footHtml||'<button class="btn" data-close>Done</button>')+"</footer></div></div>";
  r.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal());
  r.querySelector(".scrim").addEventListener("mousedown",e=>{ if(e.target.classList.contains("scrim")) closeModal(); });
  wireDialog(r);
  if(onMount) onMount(r);
  return r;
}
function closeModal(force){
  if(MODAL_GUARD && !force){ MODAL_GUARD(); return; }
  MODAL_GUARD=null; $("#modalroot").innerHTML="";
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closeSheet(); } });

  on("#hnextweek",()=>{ S.currentWeek=addDays(S.currentWeek,7); save(); render(); });
  on("#hsetup",()=>wizard());
  on("#hsetup2",()=>wizard());
  on("#homesetup",()=>wizard());
  on("#reptipok",()=>{ S.ui=S.ui||{}; S.ui.repTip=true; save(); render(); });
  on("#updgo",()=>updModal());
  on("#hdraft",()=>draftModal());
  on("#hpost",()=>{ const ws=S.currentWeek, changes=weekDiff(ws);
    repostGuard(ws, choice=>{ const wk=getWeek(); wk.published=true; wk.publishedAt=Date.now(); wk.postedOnce=true; snapWeek(wk);
      wk.assignments.forEach(a=>a.locked=true); save(); render(); toast("Posted and locked"); repostNotify(ws, choice, changes); }); });
  on("#hunpost",()=>{ const wk=getWeek(); wk.published=false; wk.assignments.forEach(a=>a.locked=false); save(); render(); toast("Open for edits again"); });
  on("#hlook",()=>go("week"));
  on("#hpdf",()=>exportWeekPDF().catch(()=>pdfUnavailable()));
  on("#hxls",()=>saveFile("schedule-"+S.currentWeek+".csv", weekGridCSV()));
  on("#hcards",()=>exportPersonCards().catch(()=>pdfUnavailable()));
  root.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    if(S.rules.useDaySheet===false){ go("week"); return; } DAYVIEW=+b.dataset.day; go("day"); });
  root.querySelectorAll("[data-week]").forEach(b=>b.onclick=()=>{ S.currentWeek=b.dataset.week; save(); render(); });
  root.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ DAYVIEW=+b.dataset.jump; go("day"); });
  root.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{
    const [date,shiftId,roleId]=b.dataset.fill.split("|"); fillOpenModal(date,shiftId,roleId||null); });
  root.querySelectorAll("[data-fixall]").forEach(b=>b.onclick=()=>fixModal(S.currentWeek));
  root.querySelectorAll("[data-denyreq]").forEach(b=>b.onclick=()=>requestConflictModal(S.currentWeek));
  root.querySelectorAll("[data-emp]").forEach(b=>b.onclick=()=>empModal(b.dataset.emp));
  const adv=root.querySelector("#hadv");
  if(adv) adv.onchange=()=>{ S.ui=S.ui||{}; S.ui.advanced=adv.checked; save(); render();
    toast(adv.checked? "Everything's in the sidebar now":"Back to the simple view"); };
};

  return `<div class="setrow">

    <div class="sc">${controlHtml||""}${jump?`<button class="btn sm" data-go="${jump}">Change →</button>`:""}</div>
  </div>`;
}

WIRE.settings = root=>{
  root.querySelectorAll("[data-set]").forEach(el=>el.addEventListener("change",()=>{
    const path=el.dataset.set;
    let v=el.value;
    const boolPaths=["rules.noClopen","rules.staggerMeals","rules.allowMealWaiver","org.trackCost","org.trackPto","ui.advanced","rules.useDaySheet","rules.useCycles","support.remind","rules.sendOut","vacations.on","rules.confirmRepost","rules.stationFamilies"];
    const numPaths=["org.weekStart","rules.minRestH","rules.maxConsecDays","rules.maxShiftH","rules.advanceNoticeDays","priority.strength","horizon","ui.anWeeks","rules.projectMinH"];
    if(boolPaths.includes(path)) v = v==="1";
    else if(numPaths.includes(path)) v = parseFloat(v);
    if(path==="priority.mode" && v==="custom" && !(S.priority.order||[]).length) S.priority.order=priorityOrder();
    setPath(S,path,v);
    if(path.indexOf("rules.meal")===0 || path==="rules.breakMode" || path==="rules.restMode"
       || path==="rules.staggerMeals" || path==="rules.allowMealWaiver" || path==="org.jurisdiction")
      rebuildBreaks();
    priorityRefresh(); save(); render();
  }));
  root.querySelectorAll("[data-bugopen]").forEach(b=>b.onclick=()=>bugModal());
  root.querySelectorAll("[data-bugsend]").forEach(b=>b.onclick=()=>digestModal());
  root.querySelectorAll("[data-load]").forEach(sel=>sel.onchange=()=>{
    S.dayLoad[+sel.dataset.load]=+sel.value; save(); render(); });
  root.querySelectorAll("[data-loadfix]").forEach(b=>b.onclick=()=>{
    const p=loadProposals(S.currentWeek)[+b.dataset.loadfix];
    if(!p){ toast("That's already been evened up"); render(); return; }
    takeLoadProposal(p, S.currentWeek);
  });
  root.querySelectorAll("[data-avail]").forEach(btn=>btn.onclick=()=>{
    const [id,d]=btn.dataset.avail.split(":");
    const e=empById(id); if(!e) return;
    e.avail[+d].ok = !e.avail[+d].ok;
    btn.classList.toggle("on", e.avail[+d].ok);
    save();
  });
  const rr=root.querySelector("#setrerun");
  if(rr) rr.onclick=()=>modal("Run setup again?",
    `<p>The interview rebuilds the board from your answers — roster, buckets, shifts, cover and rules all get replaced. Anything you've posted goes with it.</p>
     <p class="help">If you only want to change one answer, close this and change it on the page you're already on. Grab a backup first if you'd rather be safe.</p>`,
    `<button class="btn" data-close>Stay here</button><button class="btn sm" id="setbak2">Back it up first</button><button class="btn danger" id="setgo">Run the questions</button>`,
    r=>{ r.querySelector("#setgo").onclick=()=>{ closeModal(); wizard(); };
         r.querySelector("#setbak2").onclick=()=>saveFile("weeksolved-backup.json", JSON.stringify(S,null,2)); });
  const nm=root.querySelector("#setname");
  if(nm) nm.addEventListener("change",()=>{ myName=nm.value.trim();
    try{ localStorage.setItem("dowel.myname", myName); }catch(e){}
    save(); toast(myName? "Colleagues will see changes as "+myName : "Name cleared"); });
  const bk=root.querySelector("#setbak");
  if(bk) bk.onclick=()=>saveFile("weeksolved-backup.json", JSON.stringify(S,null,2));
  const rs=root.querySelector("#setrestore");
  if(rs) rs.onclick=()=>modal("Restore from a backup",
    `<div class="field"><label>Paste the backup file's contents</label><textarea id="rsbox" style="min-height:180px;font-family:'IBM Plex Mono',monospace;font-size:11px"></textarea></div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="rsgo">Restore</button>`,
    r=>{ r.querySelector("#rsgo").onclick=()=>{
      try{ S=migrate(JSON.parse(r.querySelector("#rsbox").value)); priorityRefresh(); save(); closeModal(); render(); toast("Restored"); }
      catch(e){ toast("That doesn't look like a backup file"); } }; });
  const so=root.querySelector("#setsignout");
  if(so) so.onclick=()=>{ FB.auth.signOut().then(()=>location.reload()); };
  const cl=root.querySelector("#setclear");
  if(cl) cl.onclick=()=>modal("Clear everything?",
    `<p>This removes the roster, buckets, shifts, cover, rules, schedules, requests and holidays, and leaves you an empty board. There's no undo.</p>`,
    `<button class="btn" data-close>Keep my data</button><button class="btn danger" id="clgo">Clear it all</button>`,
    r=>{ r.querySelector("#clgo").onclick=()=>{ S=blankState();
      S.currentWeek=addDays(weekStartOf(ymd(new Date()),S.org.weekStart),7);
      priorityRefresh(); save(); closeModal(); go("home"); setTimeout(wizard,200); }; });
};

          ${br.meals.length>1? "Second meal around "+m2disp(br.meals[1].start)+", latest "+m2disp(br.meals[1].deadline)+"." : ""}

        root.querySelectorAll("#scol button").forEach(x=>x.style.outline=""); b.style.outline="2px solid var(--ink)"; b.style.outlineOffset="2px"; });
      root.querySelector("#ss").oninput=prev; root.querySelector("#se").oninput=prev; prev();

        if(!label){ toast("Give the shift a name"); return; }
        const rec={id:s.id,label,start:root.querySelector("#ss").value,end:root.querySelector("#se").value,
                   roleId:null,color,note:root.querySelector("#snote").value.trim(),unpaidBreakMin:30,desire:des};

        save(); closeModal(); render();

function groupMatchText(g){
  const m=g.match||{};
  if((m.empIds||[]).length) return (m.empIds||[]).length+" people picked by name";
  const bits=[];
  if((m.roleIds||[]).length) bits.push((m.roleIds||[]).map(roleName).join(" or "));
  if((m.types||[]).length) bits.push((m.types||[]).map(t=>TYPES[t]||t).join(" or "));
  return bits.length? bits.join(", ") : "everyone";
}

  {id:"trainee",t:"Trainees",              types:[],           rules:{canBeAlone:false,maxShiftH:8}, pick:true},
  {id:"licensed",t:"Licensed or certified",types:[],           rules:{minRestH:12,maxConsecDays:5}, pick:true},
  {id:"rota",  t:"Seven on, seven off",     types:[],           rules:{cycle:{type:"onoff",on:7,off:7}}, pick:true},

      <div class="field"><label>Employment type</label><div class="row" id="gt">

      <div class="sep"></div>

        <div class="field"><label>At least this many hours</label><select id="gminh">${NUM_OPTS([4,8,10,12,16,18,20,24,28,30,32,35,36,40],R.minH,"No minimum")}</select></div>
        <div class="field"><label>No more than</label><select id="gmaxh">${NUM_OPTS([4,8,10,12,16,18,20,24,28,30,32,35,36,40,45,48],R.maxH,"No cap")}</select></div>

        <div class="field"><label>Max days in a row</label><select id="gmaxc">${NUM_OPTS([2,3,4,5,6,7],R.maxConsecDays,"Use the standing rule")}</select></div>
      </div>
      ${cyclesOn()? `<div class="field"><label>Work pattern for everyone in this group</label>
        <div class="grid3">
          <select id="gcyct">${CYCLE_TYPES.map(c=>`<option value="${c.id}" ${((R.cycle&&R.cycle.type)||"")===c.id?"selected":""}>${esc(c.t)}</option>`).join("")}</select>
          <select id="gcyca">${[[2,"2 on"],[3,"3 on"],[4,"4 on"],[5,"5 on"],[7,"7 on"],[14,"14 on"]].map(x=>`<option value="${x[0]}" ${((R.cycle&&R.cycle.on)||7)===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>
          <select id="gcycb">${[[1,"1 off"],[2,"2 off"],[3,"3 off"],[4,"4 off"],[7,"7 off"],[14,"14 off"]].map(x=>`<option value="${x[0]}" ${((R.cycle&&R.cycle.off)||7)===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>
        </div>
        <span class="mini">Overrides whatever is on each person's profile. Leave it on “the same every week” to let profiles decide.</span></div>`:""}
      <div class="field"><label>Can someone from this group hold the floor on their own?</label>
        <select id="galone"><option value="1" ${R.canBeAlone===false?"":"selected"}>Yes, that's fine</option>
        <option value="0" ${R.canBeAlone===false?"selected":""}>No — never the only person on</option></select></div>
      <div id="gprev" class="banner info"></div>
    </div>`,
    `${id?'<button class="btn danger" id="gdel">Delete group</button>':""}<button class="btn" data-close>Cancel</button><button class="btn primary" id="gsave">Save group</button>`,
    r=>{
      const build=()=>({ id:g.id, name:r.querySelector("#gn").value.trim()||"Group",
        match:{ roleIds:[...r.querySelectorAll("#gr input:checked")].map(x=>x.dataset.r),
                types:[...r.querySelectorAll("#gt input:checked")].map(x=>x.dataset.t), empIds:[] },
        rules:{ cycle:(function(){ const t=(r.querySelector("#gcyct")||{}).value;
                  if(!t) return null;
                  if(t==="onoff") return {type:t, on:+r.querySelector("#gcyca").value||7, off:+r.querySelector("#gcycb").value||7};
                  if(t==="altweeks") return {type:t, onWeeks:1, offWeeks:1};

                exactH:+r.querySelector("#gexh").value||0,

                minRestH:+r.querySelector("#gminr").value||0, maxConsecDays:+r.querySelector("#gmaxc").value||0,
                canBeAlone: r.querySelector("#galone").value==="1" } });
      const prev=()=>{
        const draft=build();
        const scope=(r.querySelector("#gscope")||{}).value||"pick";
        const rr=scope==="all"?[]:draft.match.roleIds, tt=scope==="all"?[]:draft.match.types;
        const hit=(scope==="all")? S.employees.slice()
          : (!rr.length && !tt.length)? []
          : S.employees.filter(e=>(!rr.length || e.roleIds.some(x=>rr.includes(x))) && (!tt.length || tt.includes(e.type)));
        const box=r.querySelector("#gprev");
        const strict = draft.rules.maxShiftH && draft.rules.maxShiftH < 8;
        box.className = "banner "+(hit.length? (scope==="all"&&strict?"warn":"info") : "warn");
        box.innerHTML = hit.length
          ? `<div><b>${hit.length} ${hit.length===1?"person":"people"} would be in this group.</b> ${esc(hit.slice(0,8).map(e=>e.name).join(", "))}${hit.length>8?" and "+(hit.length-8)+" more":""}.${
              scope==="all"&&strict? " That's your whole roster, and a "+draft.rules.maxShiftH+"-hour shift cap would leave your longer shifts unfillable — worth narrowing it." : ""}</div>`
          : `<div><b>Nobody matches yet.</b> Tick a bucket or an employment type below, or set “Applies to” to everyone.</div>`;
      };
      r.querySelectorAll("#gr input,#gt input").forEach(i=>i.onchange=prev);
      const sc=r.querySelector("#gscope"); if(sc) sc.onchange=prev;
      prev();
      const pre=r.querySelector("#gpre");
      if(pre) pre.onchange=()=>{
        const x=GROUP_PRESETS.find(y=>y.id===pre.value); if(!x) return;
        r.querySelector("#gn").value = x.id==="blank"? "" : x.t;
        r.querySelectorAll("#gt input").forEach(i=>i.checked = x.types.includes(i.dataset.t));
        const R2=x.rules||{};

        set("#gexh",R2.exactH); set("#gminh",R2.minH); set("#gmaxh",R2.maxH); set("#gmaxd",R2.maxD);
        set("#gmaxs",R2.maxShiftH); set("#gminr",R2.minRestH); set("#gmaxc",R2.maxConsecDays);
        r.querySelector("#galone").value = R2.canBeAlone===false? "0":"1";
        if(x.pick) toast("Now tick the bucket these people are in — otherwise it would apply to everyone");
        prev();
      };
      r.querySelector("#gsave").onclick=()=>{
        const rec=build();
        if(!rec.name){ toast("Give the group a name"); return; }
        const scope=r.querySelector("#gscope").value;
        if(scope==="pick" && !rec.match.roleIds.length && !rec.match.types.length){
          toast("Pick a bucket or an employment type — or switch “Applies to” to everyone"); return; }
        if(scope==="all"){ rec.match.roleIds=[]; rec.match.types=[]; }
        S.groups=S.groups||[];
        const i=S.groups.findIndex(x=>x.id===g.id);
        if(i>=0) S.groups[i]=rec; else S.groups.push(rec);
        save(); closeModal(); render();
      };
      const d=r.querySelector("#gdel");
      if(d) d.onclick=()=>{ S.groups=(S.groups||[]).filter(x=>x.id!==g.id); save(); closeModal(); render(); };
    });
}

function toffModal(){
  if(!S.employees.length){ toast("Add someone to the team first"); return; }
  const today=ymd(new Date());
  modal("Take someone off the schedule for a stretch",`
    <div class="stack">
      <div class="help">Vacation, parental leave, a secondment to another site — anything that takes someone out of the rota for a run of days. They won't be scheduled at all in that window, and the week grid shows why.</div>
      <div class="grid2">
      <div class="field"><label>Who</label><select id="te">${S.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Why they're away</label><select id="tt">
        <option>Vacation</option><option>Sick</option><option>Parental leave</option>
        <option>Covering another site</option><option>Leave of absence</option>
        <option>Training</option><option>Jury duty</option><option>Unavailable</option></select></div>
      <div class="field"><label>First day off</label><input type="date" id="ts" value="${today}"></div>
      <div class="field"><label>Last day off</label><input type="date" id="tend" value="${today}"></div>
      <div class="field"><label>Status</label><select id="tst"><option value="approved">approved</option><option value="pending">pending</option><option value="denied">denied</option></select></div>
      ${ptoOn()? `<div class="field"><label>Draws from their PTO balance?</label><select id="tpto">
        <option value="1">Yes — paid time off</option><option value="0">No — unpaid or doesn't count</option></select></div>
      <div class="field" id="tphw"><label>Hours per day off</label><select id="tph">${[4,6,7.5,8,10,12].map(h=>`<option value="${h}" ${h===8?"selected":""}>${h} hours</option>`).join("")}</select></div>`:""}
    </div>${ptoOn()? `<div class="mini" id="tptoline" style="margin-top:6px"></div>`:""}</div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="savetoff">Save</button>`,
    r=>{
      const line=()=>{
        const el=r.querySelector("#tptoline"); if(!el) return;
        const e=empById(r.querySelector("#te").value); if(!e){ el.textContent=""; return; }
        if(r.querySelector("#tpto").value!=="1"){ el.textContent=""; return; }
        const s0=r.querySelector("#ts").value, e0=r.querySelector("#tend").value;
        if(!s0||!e0||e0<s0){ el.textContent=""; return; }
        const per=+r.querySelector("#tph").value||8;
        let d=s0, days=0, guard=0;
        while(d<=e0 && guard++<400){ if(!S.hours[parseYmd(d).getDay()].closed) days++; d=addDays(d,1); }
        const draw=days*per;
        const bal=ptoBalance(e);
        if(bal===null){ el.textContent="Draws "+draw+"h."; return; }
        const left=Math.round((bal-draw)*10)/10;
        el.textContent="Draws "+draw+"h — leaves "+e.name.split(" ")[0]+" with "+left+"h.";
        el.style.color = left<0? "var(--crit)":"var(--muted)";
      };
      ["#te","#ts","#tend","#tpto","#tph"].forEach(x=>{ const el=r.querySelector(x); if(el) el.onchange=()=>{ const w=r.querySelector("#tphw"); if(w&&r.querySelector("#tpto")) w.style.display=r.querySelector("#tpto").value==="1"?"":"none"; line(); }; });
      line();
      r.querySelector("#savetoff").onclick=()=>{
      const s=r.querySelector("#ts").value, e=r.querySelector("#tend").value;
      if(!s||!e||e<s){ toast("Check those dates"); return; }
      S.timeoff.push({id:uid("t"),empId:r.querySelector("#te").value,start:s,end:e,
        type:r.querySelector("#tt").value,status:r.querySelector("#tst").value,
        usePto: r.querySelector("#tpto")? r.querySelector("#tpto").value==="1" : false,
        hoursPerDay: r.querySelector("#tph")? +r.querySelector("#tph").value||8 : 8});
      save(); closeModal(); render(); }; });
}

      <div class="field" id="eptorw" style="display:${e.pto&&e.pto.per&&e.pto.per!=="none"?"":"none"}"><label class="mini">At this rate</label><input type="number" step="0.1" id="eptor" value="${(e.pto&&e.pto.rate)||1}"></div>

  `${id?'<button class="btn danger" id="delemp">Remove</button>':""}<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveemp">Save</button>`,
  root=>{
    const cyc=root.querySelector("#ecyc");
    if(cyc){
      const box=root.querySelector("#ecycopts"), cn=root.querySelector("#ecycnote");
      const c0=e.cycle||{};
      const paintCyc=()=>{
        const t=cyc.value;
        cn.textContent=(CYCLE_TYPES.find(x=>x.id===t)||{}).d||"";
        box.style.display = t? "":"none";
        box.innerHTML = t==="onoff" ? `
            <div class="field"><label>Days on</label><select id="ecyon">${[2,3,4,5,6,7,10,14].map(n=>`<option value="${n}" ${(c0.on||7)===n?"selected":""}>${n}</option>`).join("")}</select></div>
            <div class="field"><label>Then days off</label><select id="ecyoff">${[1,2,3,4,5,6,7,10,14].map(n=>`<option value="${n}" ${(c0.off||7)===n?"selected":""}>${n}</option>`).join("")}</select></div>
            <div class="field"><label>Cycle starts</label><input type="date" id="ecyanch" value="${esc(c0.anchor||weekStartOf(ymd(new Date()),S.org.weekStart))}"></div>`
          : t==="altweeks" ? `
            <div class="field"><label>Weeks on</label><select id="ecyonw">${[1,2,3].map(n=>`<option value="${n}" ${(c0.onWeeks||1)===n?"selected":""}>${n}</option>`).join("")}</select></div>
            <div class="field"><label>Then weeks off</label><select id="ecyoffw">${[1,2,3].map(n=>`<option value="${n}" ${(c0.offWeeks||1)===n?"selected":""}>${n}</option>`).join("")}</select></div>
            <div class="field"><label>Cycle starts</label><input type="date" id="ecyanch" value="${esc(c0.anchor||weekStartOf(ymd(new Date()),S.org.weekStart))}"></div>`
          : t==="average" ? `
            <div class="field"><label>Hours in the period</label><select id="ecyh">${[40,48,60,64,70,72,75,80,84,96,120,160].map(n=>`<option value="${n}" ${(c0.hours||80)===n?"selected":""}>${n} hours</option>`).join("")}</select></div>
            <div class="field"><label>Over how many weeks</label><select id="ecyw">${[2,3,4].map(n=>`<option value="${n}" ${(c0.weeks||2)===n?"selected":""}>${n} weeks</option>`).join("")}</select></div>
            <div class="field"><label>Period starts</label><input type="date" id="ecyanch" value="${esc(c0.anchor||weekStartOf(ymd(new Date()),S.org.weekStart))}"></div>`
          : "";
      };
      cyc.onchange=paintCyc; paintCyc();
    }
    const hm=root.querySelector("#ehm"), note=root.querySelector("#ehmnote");
    const paintHM=()=>{
      const ex = hm.value==="exact";
      root.querySelector("#eminwrap").style.display = ex? "none":"";
      root.querySelector("#emaxlab").textContent = ex? "Exactly this many hours" : "Hour cap";
      note.textContent = ex
        ? "The scheduler will land on this figure or leave a shift open rather than go over — and it tells you when the shift lengths can't add up to it."
        : "Aim for the guarantee, never exceed the cap.";
    };
    hm.onchange=paintHM; paintHM();
    const hp=root.querySelector("#ehp");
    const paintHP=()=>{ root.querySelector("#ehphwrap").style.display = hp.value==="1"? "":"none"; };
    hp.onchange=paintHP; paintHP();
    const pp=root.querySelector("#eptop");
    if(pp) pp.onchange=()=>{ root.querySelector("#eptorw").style.display = pp.value==="none"?"none":""; };
    const lw=root.querySelector("#elicwrap");
    if(lw) root.querySelectorAll("#eroles input").forEach(cb=>cb.addEventListener("change",()=>{
      const on=[...root.querySelectorAll("#eroles input:checked")].some(x=>{const rr=roleById(x.dataset.r);return rr&&rr.licensed;});
      lw.style.display=on?"":"none";
    }));
    root.querySelectorAll("#eavail .d").forEach(d=>{
      d.querySelector(".tog").onclick=()=>{
        const on = !d.classList.contains("on");
        d.classList.toggle("on",on); d.querySelector(".tog").textContent = on?"Free":"Off";
        d.querySelector(".af").disabled=!on; d.querySelector(".at").disabled=!on;
      };
    });
    root.querySelector("#saveemp").onclick=()=>{
      const name=root.querySelector("#en").value.trim();
      if(!name){ toast("Name is required"); return; }
      if(S.roles.length && ![...root.querySelectorAll("#eroles input:checked")].length){ toast("Pick at least one role — it's how shifts find them"); return; }
      const rec={
        id:e.id, name,
        email:root.querySelector("#eem").value.trim(), phone:root.querySelector("#eph").value.trim(),
        roleIds:[...root.querySelectorAll("#eroles input:checked")].map(x=>x.dataset.r),
        type:root.querySelector("#et").value,
        onCall:root.querySelector("#eoc").value==="1",
        projectOk:(root.querySelector("#epj")||{}).value || projectOk(e),
        cycle:(function(){
          const c=root.querySelector("#ecyc"); if(!c) return e.cycle||null;
          const t=c.value; if(!t) return null;
          const g=id=>(root.querySelector(id)||{}).value;
          if(t==="onoff") return {type:t, on:+g("#ecyon")||7, off:+g("#ecyoff")||7, anchor:g("#ecyanch")};
          if(t==="altweeks") return {type:t, onWeeks:+g("#ecyonw")||1, offWeeks:+g("#ecyoffw")||1, anchor:g("#ecyanch")};
          return {type:"average", hours:+g("#ecyh")||80, weeks:+g("#ecyw")||2, anchor:g("#ecyanch")};
        })(),
        hoursMode:root.querySelector("#ehm").value,
        minH:+root.querySelector("#emin").value||0, maxH:+root.querySelector("#emax").value||0,
        holidayPay:root.querySelector("#ehp").value==="1", holidayPayH:+root.querySelector("#ehph").value||8,
        maxD:+root.querySelector("#emaxd").value||5,
        avail:[...root.querySelectorAll("#eavail .d")].map(d=>({ok:d.classList.contains("on"),from:d.querySelector(".af").value,to:d.querySelector(".at").value})),
        prefShiftIds:[...root.querySelectorAll("#epref input:checked")].map(x=>x.dataset.s),
        avoidShiftIds:[...root.querySelectorAll("#eavoid input:checked")].map(x=>x.dataset.s),
        prefDaysOff:[...root.querySelectorAll("#epoff input:checked")].map(x=>+x.dataset.d),
        canOpen:true,canClose:true,
        pto: root.querySelector("#eptob")? {bal:+root.querySelector("#eptob").value||0, anchor:root.querySelector("#eptoa").value||ymd(new Date()),
              per:root.querySelector("#eptop").value, rate:+root.querySelector("#eptor").value||0} : (e.pto||null),
        licExp:((root.querySelector("#elic")||{}).value||"")||(e.licExp&&!root.querySelector("#elic")?e.licExp:""),
        licLabel:(((root.querySelector("#elicn")||{}).value)||(root.querySelector("#elicn")?"":e.licLabel||"")).trim(),
        notes:root.querySelector("#enotes").value.trim(),
        seniority:root.querySelector("#esen").value, active:root.querySelector("#eact").checked,
        rate: root.querySelector("#erate")? (+root.querySelector("#erate").value||0) : (e.rate||0)
      };
      const i=S.employees.findIndex(x=>x.id===e.id);
      if(i>=0) S.employees[i]=rec; else S.employees.push(rec);
      save(); closeModal(); render();
    };
    const d=root.querySelector("#delemp");
    if(d) d.onclick=()=>{
      S.employees=S.employees.filter(x=>x.id!==e.id);
      Object.values(S.weeks).forEach(w=>w.assignments=w.assignments.filter(a=>a.empId!==e.id));
      S.timeoff=S.timeoff.filter(t=>t.empId!==e.id);
      save(); closeModal(); render();
    };
  });
}

  return p? p.demand : S.demand;
}

  root.querySelectorAll("[data-adddem]").forEach(b=>b.onclick=()=>demModal(+b.dataset.adddem));
  root.querySelectorAll("[data-deldem]").forEach(b=>b.onclick=()=>{
    const [d,i]=b.dataset.deldem.split(":").map(Number); editDemand()[d].splice(i,1); save(); render(); });
  root.querySelectorAll("[data-copydem]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.copydem; const D=editDemand();
    D[i]=JSON.parse(JSON.stringify(D[i-1]||[])); save(); render(); toast("Copied from "+DAYS[i-1]); });
  const ps=root.querySelector("#patsel");
  if(ps) ps.onchange=()=>{ EDITPAT=ps.value||null; render(); };
  const pn=root.querySelector("#patnew");
  if(pn) pn.onclick=()=>patternModal();
  const pd=root.querySelector("#patdel");
  if(pd) pd.onclick=()=>{
    const id=EDITPAT;
    S.patterns=(S.patterns||[]).filter(x=>x.id!==id);
    Object.values(S.weeks).forEach(w=>{ if(w.patternId===id) delete w.patternId; });
    EDITPAT=null; save(); render(); toast("Pattern removed — those weeks go back to the standard shape");
  };
  root.querySelector("#addcov").onclick=()=>covModal();
  root.querySelectorAll("[data-delcov]").forEach(b=>b.onclick=()=>{ S.coverage=S.coverage.filter(c=>c.id!==b.dataset.delcov); save(); render(); });
};

function openWindow(){
  const days=[0,1,2,3,4,5,6].filter(d=>!S.hours[d].closed);
  if(!days.length) return ["09:00","17:00"];
  let o=1440, c=0;
  days.forEach(d=>{ o=Math.min(o,t2m(S.hours[d].open)); c=Math.max(c,t2m(S.hours[d].close)); });
  return [m2t(o), m2t(c)];
}
function windowPresets(){
  const [o,c]=openWindow(); const om=t2m(o), cm=t2m(c);
  return [
    {id:"open",  t:"All open hours ("+m2disp(om)+"–"+m2disp(cm)+")", from:o, to:c},
    {id:"morn",  t:"Mornings ("+m2disp(om)+"–12p)",                  from:o, to:"12:00"},
    {id:"mid",   t:"The middle of the day (11a–3p)",                  from:"11:00", to:"15:00"},
    {id:"aft",   t:"Afternoons (12p–"+m2disp(cm)+")",                 from:"12:00", to:c},
    {id:"eve",   t:"Evenings (4p–"+m2disp(cm)+")",                    from:"16:00", to:c},
    {id:"custom",t:"Pick my own times…", from:o, to:c}
  ];
}
const DAY_PRESETS=[
  {id:"open",   t:"Every day we're open", days:()=>[0,1,2,3,4,5,6].filter(d=>!S.hours[d].closed)},
  {id:"week",   t:"Weekdays only",        days:()=>[1,2,3,4,5].filter(d=>!S.hours[d].closed)},

function labelSuggestions(kind, roleId, perRoleId, num){
  const R=n=>roleName(n).toLowerCase();
  if(kind==="ratio") return [
    "Supervision ratio",
    "One "+R(roleId)+" per "+(num||1)+" "+R(perRoleId),
    "Licensing ratio",
    "Span of control"
  ];
  if(kind==="pair") return [
    R(perRoleId)+" is never on alone",
    "Qualified partner on shift",
    "Trainee supervision",
    "Lone-worker cover"
  ];
  return [
    roleId? "A "+R(roleId)+" on duty whenever we're open" : "Never a solo staffer",
    "Peak cover",
    "Minimum on the floor",
    "Opening and closing cover"
  ];
}
const COV_KINDS=[
  ["min","A minimum on the floor","At least so many people — optionally of one bucket — on duty through a window. The everyday rule."],
  ["ratio","A ratio between two buckets","At least one of A for every so many of B on duty. Supervision, licensing, span of control."],
  ["pair","Never on without","Whenever anyone in B is on duty, at least so many of A must be too. Trainees, lone workers, anyone needing a qualified partner."]
];
function covModal(){

    const box=r.querySelector("#cbody");

      </div>
      <div class="help">A minimum is a hard floor — the drafter will never let the count dip below it, meals included. If a role has no real floor (plenty of places can run with zero techs at quiet times), don't add a rule for it: your coverage counts under Coverage needs already decide how many get scheduled.</div>`

      <div class="grid3" style="align-items:end">

        <div class="field"><label>of</label><select id="cp">${roleOpts(1)}</select></div>

      <div class="grid3" style="align-items:end">
        <div class="field"><label>Require at least</label><select id="cm">${[1,2,3].map(n=>`<option value="${n}">${n}</option>`).join("")}</select></div>
        <div class="field"><label>of</label><select id="cr">${roleOpts(0)}</select></div>

    const box=r.querySelector("#clabels");
    box.innerHTML = `<label>What to call it</label><select id="cl">
      ${sug.map((x,i)=>`<option value="${esc(x)}" ${i===0?"selected":""}>${esc(x)}</option>`).join("")}
      <option value="__own">Something else…</option></select>
      <input type="text" id="clown" placeholder="Your own wording" style="display:none;margin-top:6px">`;
    const sel=box.querySelector("#cl"), own=box.querySelector("#clown");
    sel.onchange=()=>{ own.style.display = sel.value==="__own"? "" : "none"; if(sel.value==="__own") own.focus(); };
  };
  modal("Coverage rule",`
    <div class="stack">
      <div class="wopts" id="ckind">${COV_KINDS.map(k=>`<button type="button" class="wopt ${k[0]==="min"?"on":""}" data-k="${k[0]}">
        <span class="wt">${esc(k[1])}</span><span class="wd">${esc(k[2])}</span></button>`).join("")}</div>
      <div id="cbody" class="stack"></div>
      <div class="grid2">
        <div class="field"><label>When it applies</label><select id="cwin">
          ${wp.map(w=>`<option value="${w.id}">${esc(w.t)}</option>`).join("")}</select>
          <div id="cwincustom" style="display:none;margin-top:8px" class="grid2">
            <div class="field"><label>From</label><input type="time" id="cs" value="${wp[0].from}"></div>
            <div class="field"><label>Until</label><input type="time" id="ce" value="${wp[0].to}"></div>
          </div></div>
        <div class="field"><label>Which days</label><select id="cdays">
          ${DAY_PRESETS.map(d=>`<option value="${d.id}">${esc(d.t)}</option>`).join("")}</select>
          <div id="cdaycustom" style="display:none;margin-top:8px"><div class="row" id="cd">
            ${DAYS.map((d,i)=>`<label class="switch" style="border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px">
              <input type="checkbox" data-d="${i}" ${!S.hours[i].closed?"checked":""}> ${DSHORT[i]}</label>`).join("")}</div></div></div>
      </div>
      <div class="field" id="clabels"></div>
      <div class="field"><label>Does a meal period break this rule?</label><select id="cmeal">
        <option value="1">Yes — someone at an unpaid meal is off duty</option>
        <option value="0">No — I only care who's on the premises</option></select>
        <span class="mini">Say yes for anything about being legally covered. Say no for rules where stepping away for lunch shouldn't count against you.</span></div>
    </div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="savecov">Add rule</button>`,
    r=>{
      paint(r);
      r.querySelectorAll("#ckind .wopt").forEach(b=>b.onclick=()=>{
        kind=b.dataset.k;
        r.querySelectorAll("#ckind .wopt").forEach(x=>x.classList.toggle("on",x===b));
        paint(r);
      });
      const win=r.querySelector("#cwin"), wc=r.querySelector("#cwincustom");
      win.onchange=()=>{ const w=wp.find(x=>x.id===win.value);
        wc.style.display = win.value==="custom"? "" : "none";
        r.querySelector("#cs").value=w.from; r.querySelector("#ce").value=w.to; };
      const dsel=r.querySelector("#cdays"), dc=r.querySelector("#cdaycustom");
      dsel.onchange=()=>{ dc.style.display = dsel.value==="custom"? "" : "none"; };
      r.querySelector("#savecov").onclick=()=>{
        const dp=DAY_PRESETS.find(x=>x.id===dsel.value);
        const days = dsel.value==="custom"
          ? [...r.querySelectorAll("#cd input:checked")].map(x=>+x.dataset.d)
          : dp.days();
        if(!days.length){ toast("Pick at least one day"); return; }
        if(kind!=="min" && S.roles.length<2){ toast("You need at least two buckets for this kind of rule"); return; }
        const w=wp.find(x=>x.id===win.value);
        const lsel=r.querySelector("#cl");
        const label = lsel.value==="__own"? (r.querySelector("#clown").value.trim()||"Coverage rule") : lsel.value;
        const rec={id:uid("c"),kind,label,
          roleId:(r.querySelector("#cr")||{}).value||null,
          perRoleId:(r.querySelector("#cp")||{}).value||null,
          ratio:+((r.querySelector("#cratio")||{}).value)||1,
          min:+((r.querySelector("#cm")||{}).value)||1,
          mealsCount:r.querySelector("#cmeal").value==="1",
          start: win.value==="custom"? r.querySelector("#cs").value : w.from,
          end:   win.value==="custom"? r.querySelector("#ce").value : w.to, days};
        if(kind!=="min" && rec.roleId===rec.perRoleId){ toast("Pick two different buckets"); return; }
        S.coverage.push(rec); save(); closeModal(); render();
      };
    });
}


/* ============================================================
   Build a week pattern from its shift length and cover
   ============================================================ */
function patternModal(){
  const roles = S.roles.length? S.roles : [{id:null,name:"Everyone",color:"#1c6a66"}];
  if(!S.shifts.length){
    modal("No shifts to build from", `
      <div class="stack"><p class="whead">A pattern is built out of shifts you've already named — it never invents one. Define the shifts you actually run first, then come back and say how many of each you need.</p></div>`,
      `<button class="btn" data-close>Cancel</button><button class="btn primary" id="pgo">Go and add shifts</button>`,
      r=>{ r.querySelector("#pgo").onclick=()=>{ closeModal(); go("shifts"); }; });
    return;
  }
  modal("Build a week pattern", `
    <div class="stack">
      <p class="whead">Pick from the shifts you've defined and say how many of each bucket you need on them. Nothing new gets created — if the shape you want needs a length you don't have, add that shift first and it'll appear here.</p>
      <div class="grid2">
        <div class="field"><label>Call it</label><input type="text" id="pn" placeholder="Holiday week"></div>
        <div class="field"><label>Which days</label><select id="pdays">
          ${DAY_PRESETS.map(d=>`<option value="${d.id}">${esc(d.t)}</option>`).join("")}</select>
          <div id="pdaycustom" style="display:none;margin-top:8px"><div class="row" id="pcd">
            ${DAYS.map((d,i)=>`<label class="switch" style="border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px">
              <input type="checkbox" data-d="${i}" ${!S.hours[i].closed?"checked":""}> ${DSHORT[i]}</label>`).join("")}</div></div></div>
      </div>
      <div class="field"><label>Your shifts — how many on each</label>
        <div class="stack" style="gap:7px">${S.shifts.map(sh=>{
          const [a2,b2]=shiftMinutes(sh);
          return `<div class="patrow">
            <div style="min-width:190px">
              <span class="tag" style="--sc:${sh.color}">${esc(sh.label)}</span>
              <div class="mini mono">${m2disp(a2)}–${m2disp(b2)} · ${fmtHrs(b2-a2)}</div></div>
            <div class="row" style="gap:8px;margin-left:auto;flex-wrap:wrap">
              ${roles.map(r=>`<div class="field" style="min-width:120px">
                <label style="font-size:10px">${esc(r.name)}</label>
                <select class="pneed" data-s="${sh.id}" data-r="${r.id||""}">
                  ${[0,1,2,3,4,5,6,8].map(n=>`<option value="${n}">${n}</option>`).join("")}
                </select></div>`).join("")}
            </div></div>`;
        }).join("")}</div>
        <div class="row" style="margin-top:8px"><button type="button" class="btn sm ghost" id="paddshift">Need a different shift? Add one →</button></div>
      </div>
      <div id="ppreview" class="banner info"></div>
    </div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="psave">Build it</button>`,
    r=>{
      const dsel=r.querySelector("#pdays"), dc=r.querySelector("#pdaycustom");
      const chosenDays=()=> dsel.value==="custom"
        ? [...r.querySelectorAll("#pcd input:checked")].map(x=>+x.dataset.d)
        : (DAY_PRESETS.find(x=>x.id===dsel.value)||DAY_PRESETS[0]).days();
      const plan=()=>{
        const days=chosenDays().filter(d=>!S.hours[d].closed);
        const picks=[];
        r.querySelectorAll(".pneed").forEach(sel=>{
          const n=+sel.value||0; if(!n) return;
          picks.push({shiftId:sel.dataset.s, roleId:sel.dataset.r||null, count:n});
        });
        return {days, picks, perDay:picks.reduce((t,x)=>t+x.count,0)};
      };
      const preview=()=>{
        const pl=plan(), box=r.querySelector("#ppreview");
        if(!pl.days.length || !pl.picks.length){
          box.className="banner warn";
          box.innerHTML=`<div><b>Nothing to build yet.</b> ${!pl.days.length?"Pick at least one open day.":"Set a number against at least one shift."}</div>`;
          return;
        }
        /* does the chosen set actually cover each day's open hours? */
        const used=[...new Set(pl.picks.map(x=>x.shiftId))].map(shiftById).filter(Boolean);
        const gaps=[];
        pl.days.forEach(d=>{
          const h=S.hours[d]; const o=t2m(h.open); let c=t2m(h.close); if(c<=o)c+=1440;
          let missing=[];
          for(let t=o;t<c;t+=30){
            const on=used.some(sh=>{ const [x,y]=shiftMinutes(sh); return t>=x && t<y; });
            if(!on){ if(missing.length && missing[missing.length-1].to===t) missing[missing.length-1].to=t+30;
                     else missing.push({from:t,to:t+30}); }
          }
          if(missing.length) gaps.push({d, missing});
        });
        /* can the roster supply it? */
        const strain=[];
        const byRole={};
        pl.picks.forEach(x=>{ byRole[x.roleId||""]=(byRole[x.roleId||""]||0)+x.count*pl.days.length; });
        Object.keys(byRole).forEach(rid=>{
          const needShifts=byRole[rid];
          const pool=S.employees.filter(e=>e.active && (!rid || e.roleIds.includes(rid)));
          const avgLen=Math.max(1, used.reduce((t,sh)=>{const[x,y]=shiftMinutes(sh);return t+(y-x)/60;},0)/Math.max(1,used.length));
          const canDo=pool.reduce((t,e)=>{const L=effLimits(e);
            return t+Math.min(L.maxD||5, Math.floor((L.maxH||40)/avgLen));},0);
          if(needShifts>canDo) strain.push({name: rid? roleName(rid):"Anyone", need:needShifts, can:canDo, people:pool.length});
        });
        box.className="banner "+((gaps.length||strain.length)? "warn":"info");
        box.innerHTML=`<div>
          <b>${pl.perDay} shift${pl.perDay===1?"":"s"} a day across ${pl.days.length} day${pl.days.length===1?"":"s"} — ${pl.perDay*pl.days.length} a week.</b>
          Built from ${esc(used.map(sh=>sh.label).join(", "))}.
          ${gaps.length? `<br><b>Leaves you uncovered:</b> ${esc(gaps.slice(0,3).map(g=>DSHORT[g.d]+" "+g.missing.map(m=>m2disp(m.from)+"–"+m2disp(m.to)).join(", ")).join("; "))}${gaps.length>3?" and "+(gaps.length-3)+" more days":""}. Nothing you've defined runs at those times — either add a shift that does, or accept the gap.` : ""}
          ${strain.length? `<br><b>More than your roster can take:</b> ${esc(strain.map(x=>x.name.toLowerCase()+" would need "+x.need+" shifts a week and your "+x.people+" can cover about "+x.can).join("; "))}.` : ""}
          ${!gaps.length && !strain.length? " Covers your open hours and fits inside everyone's limits." : ""}</div>`;
      };
      dsel.onchange=()=>{ dc.style.display = dsel.value==="custom"?"":"none"; preview(); };
      r.querySelectorAll(".pneed").forEach(x=>x.onchange=preview);
      r.querySelectorAll("#pcd input").forEach(x=>x.onchange=preview);
      r.querySelector("#paddshift").onclick=()=>{ closeModal(); go("shifts"); setTimeout(()=>shiftModal(null),80); };
      preview();

      r.querySelector("#psave").onclick=()=>{
        const name=r.querySelector("#pn").value.trim();
        if(!name){ toast("Give the pattern a name"); return; }
        const pl=plan();
        if(!pl.days.length || !pl.picks.length){ toast("Pick days and set a number against a shift"); return; }
        const demand={}; for(let d=0;d<7;d++) demand[d]=[];
        pl.days.forEach(d=>{ pl.picks.forEach(x=>demand[d].push({shiftId:x.shiftId, roleId:x.roleId, count:x.count})); });
        const rec={id:uid("pat"), name, demand, at:Date.now()};
        S.patterns=S.patterns||[]; S.patterns.push(rec);
        EDITPAT=rec.id; save(); closeModal(); render();
        toast("Built \u201c"+name+"\u201d — assign it to a week from the schedule");
      };
    });
}

        toast("Redrafted as a "+(pick? (pats.find(p=>p.id===pick)||{}).name : "standard week")+" — "+res.filled+" shifts");
      };
    });
}

function vRules(){
  const R=S.rules, L=law();
  const mode=(name,key,opts)=>`<div class="field"><label>${name}</label><div class="seg" data-seg="${key}">
    ${opts.map(o=>`<button data-v="${o[0]}" aria-pressed="${R[key]===o[0]}">${o[1]}</button>`).join("")}</div>
    <span class="mini">${opts.find(o=>o[0]===R[key])?opts.find(o=>o[0]===R[key])[2]:""}</span></div>`;
  return `
  <div class="stack">
    <div class="card"><header><h3>Meals and rest breaks</h3><span class="hint">${esc(L.name)} rules decide what is owed. You decide who picks the clock time.</span></header>
      <div class="body stack">
        ${mode("Meal periods","breakMode",[
          ["assigned","Schedule exact times","The day sheet prints a specific meal time for each person, placed inside the legal window and staggered so the floor stays covered."],
          ["lengths","Set the length, staff pick the time","The sheet shows the meal length owed and the latest legal start; staff coordinate the exact minute."],
          ["self","Staff coordinate entirely","The sheet notes that meals are owed and leaves timing to the team. Coverage gaps from meals are not modeled."]])}
        ${R.breakMode==="assigned"? `
        <div class="field"><label>How the meal times get decided</label>
          <select data-bind="rules.mealPlan">
            <option value="auto" ${mealPlan()==="auto"?"selected":""}>Work them out for me — staggered inside the legal window</option>
            <option value="slots" ${mealPlan()==="slots"?"selected":""}>Use the meal times I set — everyone goes on one of them</option>
            <option value="closed" ${mealPlan()==="closed"?"selected":""}>We close for lunch — everybody eats at the same time</option>
          </select>
          <span class="mini">${mealPlan()==="slots"
            ? "Nobody is given a meal at any other time. If none of your slots is legal for a shift, that shift keeps its own legal time and the day sheet says so."
            : mealPlan()==="closed"
            ? "The doors are shut for the stretch below, so coverage isn't counted against you during it."
            : "Each meal lands inside the legal window, spread so the floor never empties."}</span></div>
        ${mealPlan()==="slots"? `
        <div class="field"><label>Your meal times</label>
          <div class="row" id="mslots">
            ${(R.mealSlots||[]).map((t,i)=>`<span class="row" style="gap:3px;border:1px solid var(--line);border-radius:6px;padding:2px 2px 2px 4px">
              <input type="time" value="${esc(t)}" data-mslot="${i}" style="width:auto;border:0;background:transparent;padding:3px 2px">
              <button class="btn sm ghost" data-mdel="${i}" title="Remove this meal time" aria-label="Remove ${esc(t)}" style="padding:2px 7px">×</button></span>`).join("")}
            <button class="btn sm" id="maddslot">Add a time</button>
          </div>
          <span class="mini">${(R.mealSlots||[]).length? "People are spread across these, busiest slot last." : "Add at least one, or nothing can be scheduled."}</span></div>`:""}
        ${mealPlan()==="closed"? `
        <div class="grid2">
          <div class="field"><label>Closed from</label><input type="time" data-bind="rules.mealClose.from" value="${esc((R.mealClose||{}).from||"13:00")}"></div>
          <div class="field"><label>Open again at</label><input type="time" data-bind="rules.mealClose.to" value="${esc((R.mealClose||{}).to||"14:00")}"></div>
        </div>
        <div class="help">Anyone whose shift can't legally take its meal in that window keeps a compliant time of its own — the day sheet flags them so you can see who.</div>`:""}
        `:""}
        ${mode("Rest breaks","restMode",[
          ["assigned","Schedule exact times","Each paid rest break is placed near the middle of its work segment."],
          ["lengths","Set the length, staff pick the time","The sheet shows how many rest breaks are owed and how long."],
          ["self","Staff coordinate entirely","The sheet notes rest breaks are owed and leaves the rest to the team."]])}
        <div class="sep"></div>
        ${mealPlan()==="auto"? `<label class="switch"><input type="checkbox" data-bind="rules.staggerMeals" ${R.staggerMeals?"checked":""}> Stagger meals so two people are never off the floor at once</label>`:""}
        <label class="switch"><input type="checkbox" data-bind="rules.allowMealWaiver" ${R.allowMealWaiver?"checked":""}> Allow meal waivers where the law permits them${L.meal&&L.meal.waivableIfShiftUnderMin?` (shifts under ${fmtHrs(L.meal.waivableIfShiftUnderMin)})`:""}</label>
        ${L.meal? `<div class="help">A waiver has to be voluntary and in writing. Weeksolved marks the shift, it does not collect the signature.</div>`:""}
      </div></div>

    <div class="card"><header><h3>Between shifts</h3></header><div class="body grid3">
      <div class="field"><label>Minimum rest between shifts</label><input type="number" step="0.5" min="0" max="24" data-bind="rules.minRestH" value="${R.minRestH}"><span class="mini">hours off the clock</span></div>
      <div class="field"><label>Most days in a row</label><input type="number" min="1" max="14" data-bind="rules.maxConsecDays" value="${R.maxConsecDays}"><span class="mini">before a day off is required</span></div>
      <div class="field"><label>Longest single shift</label><input type="number" step="0.5" min="1" max="24" data-bind="rules.maxShiftH" value="${R.maxShiftH}"><span class="mini">hours</span></div>
      <div class="field"><label>Post the schedule this far ahead</label><input type="number" min="0" max="60" data-bind="rules.advanceNoticeDays" value="${R.advanceNoticeDays}"><span class="mini">days — predictive-scheduling laws in some cities require 14</span></div>
    </div>
    <div class="body" style="padding-top:0"><div class="stack">
      <label class="switch"><input type="checkbox" data-bind="rules.noClopen" ${R.noClopen?"checked":""}> No clopening — never close one night and open the next morning</label>
      <label class="switch"><input type="checkbox" data-bind="rules.honorPrefs" ${R.honorPrefs?"checked":""}> Weigh each person's shift preferences and preferred days off</label>
      <label class="switch"><input type="checkbox" data-bind="rules.fairness" ${R.fairness?"checked":""}> Spread hours and weekends evenly rather than loading the same people</label>
      <label class="switch"><input type="checkbox" data-bind="rules.preferLong" ${R.preferLong?"checked":""}> Prefer fewer, longer shifts over lots of short ones</label>
      <div class="help" style="margin-left:28px">When topping people up to their hours, one 8-hour shift beats two 4-hour ones. Healthcare and retail crews usually want this on — fewer handoffs, fewer commutes for the same pay. Leave it off if you rely on short overlap shifts to cover rushes.</div>
      <div class="field" style="max-width:420px;margin-top:6px"><label>People you keep on call (per diem)</label>
        <select data-bind="rules.perDiem">
          <option value="ask" ${R.perDiem!=="auto"?"selected":""}>Suggest them when a gap appears — I decide each time</option>
          <option value="auto" ${R.perDiem==="auto"?"selected":""}>Call them in automatically when nobody else can cover</option>
        </select>
        <span class="mini">Either way they're never drafted for ordinary shifts — only when coverage can't be met without them.</span></div>
    </div></div></div>

    <div class="card"><header><h3>How the scheduler decides</h3></header><div class="body">
      <div class="help" style="max-width:70ch">
        Hard limits are never crossed: role qualification, stated availability, approved time off, hour caps, days-in-a-row, minimum rest, and the longest-shift limit. Everything else is a weighted preference. Within the people who legally and practically <em>can</em> work a shift, it favors whoever is furthest below their guaranteed hours, then whoever asked for that shift, then whoever has carried fewer weekends, with seniority as the last tiebreak. When no one clears the hard limits, the shift is left open and the week view tells you exactly which limit blocked it — it does not quietly break a rule to fill a slot.
      </div>
    </div></div>
  </div>`;
}
WIRE.rules = root=>{
  root.querySelectorAll("[data-seg]").forEach(seg=>{
    seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      S.rules[seg.dataset.seg]=b.dataset.v;
      rebuildBreaks(); save(); render();
    });
  });
  /* the named meal times */
  root.querySelectorAll("[data-mslot]").forEach(el=>el.onchange=()=>{
    S.rules.mealSlots[+el.dataset.mslot]=el.value;
    S.rules.mealSlots = [...new Set(S.rules.mealSlots.filter(Boolean))].sort();
    rebuildBreaks(); save(); render();
  });
  root.querySelectorAll("[data-mdel]").forEach(el=>el.onclick=()=>{
    if(S.rules.mealSlots.length<2){ toast("Keep at least one meal time"); return; }
    S.rules.mealSlots.splice(+el.dataset.mdel,1);
    rebuildBreaks(); save(); render();
  });
  const add=root.querySelector("#maddslot");
  if(add) add.onclick=()=>{
    const last=mealSlotList().slice(-1)[0];
    S.rules.mealSlots.push(m2t(((last==null?690:last)+30)%1440));
    S.rules.mealSlots=[...new Set(S.rules.mealSlots)].sort();
    rebuildBreaks(); save(); render();
  };
  /* meal plan and the closed window need every sheet redone, not just a redraw */
  root.querySelectorAll('[data-bind^="rules.meal"]').forEach(el=>{
    el.addEventListener("change",()=>{ rebuildBreaks(); save(); render(); });
  });
};

/* ============================================================
   View: Week schedule
   ============================================================ */
function vWeek(){
  const ws=S.currentWeek, wk=getWeek(ws), dates=weekDates(ws);
  /* A blank grid is a dead end. If this week has never been touched and there's enough
     to work with, draft one — clearly labelled as a suggestion, nothing posted. */
  if(!wk.assignments.length && !wk.touched && !wk.published && S.setupDone
     && S.employees.some(e=>e.active) && dates.some(d=>expandDemand(d.dow,ws).length)){
    generateSchedule(ws); wk.suggested=true; wk.touched=true; wk.auto=true; save();
  }
  const V=validate(ws);
  const DIFF=weekDiff(ws), CHG=new Set(DIFF.map(d=>d.empId+"|"+d.date));
  const crit=V.filter(v=>v.sev==="crit"), warn=V.filter(v=>v.sev==="warn"), info=V.filter(v=>v.sev==="info");
  const roster = S.employees.filter(e=>e.active);
  const totalMin = wk.assignments.reduce((t,a)=>t+paidMinutes(a),0);
  const wantSlots = dates.reduce((t,d)=>t+expandDemand(d.dow,ws).length,0);

  const covStrip = d => {
    const prof = coverageProfile(d.date,d.dow,ws);
    if(!prof) return `<div class="mini" style="padding:4px 0">Closed</div>`;
    return `<div class="covbar" title="Coverage against your minimums, meal periods counted as off duty">${
      prof.pts.map(p=>`<i class="${p.shut?"shut":p.gap>0?(p.gap>1?"r":"y"):"g"}" title="${m2disp(p.t)}${p.shut?" · closed for lunch":" · "+p.staff+" on the floor"+(p.gap>0?" · short "+p.gap:"")}"></i>`).join("")}</div>`;
  };

  /* On a phone the wide grid is unusable, so the week is shown a day at a time —
     same data, same taps, no sideways scrolling. */
  const dayList = () => `
    <div class="stack" style="gap:9px">
      ${dates.map(d=>{
        const h=S.hours[d.dow];
        const on=wk.assignments.filter(a=>a.date===d.date).sort((x,y)=>x.startMin-y.startMin);
        const want=expandDemand(d.dow,ws).length;
        const gaps=V.filter(v=>v.date===d.date && v.sev==="crit").length;
        const open = DAYOPEN.has(d.dow);
        return `<div class="dcard ${h.closed?"shut":""} ${open?"open":""}">
          <button class="dhead" data-togday="${d.dow}" aria-expanded="${open}">
            <div class="dl"><strong>${DAYS[d.dow]}</strong> <span class="mini">${esc(prettyDate(d.date))}</span>
${(()=>{const _h=(S.holidays.list||[]).find(h=>h.date===d.date); if(_h) return ' <span class="busy" title="'+esc(_h.name)+'">'+(holMode(_h)==="closed"?"closed — holiday":holMode(_h)==="reduced"?"holiday cover":"holiday")+'</span>'; return ''})()}${holAdj(d.date)?'<span class="busy" title="Counts one step busier when drafting">holiday rush</span>':dayLoad(d.dow)>0?'<span class="busy">busy</span>':dayLoad(d.dow)<0?'<span class="quiet">quiet</span>':""}
              <div class="mini">${h.closed?"Closed":
                (on.length? esc(on.slice(0,3).map(a=>(empById(a.empId)||{name:"?"}).name.split(" ")[0]).join(", "))+(on.length>3?" +"+(on.length-3):"") : "nobody on")}</div></div>
            <div class="dr">${h.closed? '<span class="mini">Closed</span>'
              : `<span class="chip ${on.length>=want?"ok":"crit"}">${on.length}/${want}</span>`+
                (gaps? ' <span class="chip crit" title="Coverage or compliance problem">!</span>':"")}
              <span class="carat">${open?"▾":"▸"}</span></div>
          </button>
          ${!open||h.closed? "" : on.length? `<div class="dbody">
            ${on.map(a=>{ const e=empById(a.empId)||{name:"—"}, sh=aShift(a);
              const bad=V.some(v=>v.sev==="crit"&&v.empId===a.empId&&v.date===a.date);
              return `<button class="drow ${bad?"viol":""}${CHG.has(a.empId+"|"+a.date)?" chg":""}${a.callout?" cout":""}" data-edita="${a.id}" style="--sc:${sh.color}">
                <span class="dw">${esc(e.name)}</span>
                <span class="ds">${a.locked?"● ":""}${esc(sh.label)}${a.topUp?" +":""}</span>
                <span class="dt mono">${m2disp(a.startMin)}–${m2disp(a.endMin)}</span></button>`;
            }).join("")}
            <div class="dfoot"><button class="btn sm ghost" data-openday="${d.dow}">Day sheet →</button>
              <button class="btn sm ghost" data-addday="${d.date}:${d.dow}">Add someone</button></div>
          </div>` : `<div class="dbody"><div class="mini" style="padding:8px 2px">Nobody on this day.
            <button class="btn sm ghost" data-addday="${d.date}:${d.dow}" style="margin-left:6px">Add someone</button></div></div>`}
        </div>`;
      }).join("")}
    </div>`;

  return `
  <div class="stack">
    <div class="card"><div class="body spread" style="padding:12px 14px">
      <div class="row">
        <button class="btn sm" id="wprev">←</button>
        <div><strong style="font-family:Archivo,sans-serif;font-size:15px">${prettyDate(ws)} – ${prettyDate(addDays(ws,6))}</strong>
          <div class="mini">${wk.generatedAt? "Drafted "+new Date(wk.generatedAt).toLocaleString([],{dateStyle:"short",timeStyle:"short"}) : "Not drafted yet"}${wk.published?" · posted":""}</div></div>
        <button class="btn sm" id="wnext">→</button>
        <button class="btn sm ghost" id="wtoday">This week</button>
      </div>
      <div class="row${isPhone()?" phonehide":""}">
        <button class="btn sm ${wk.patternId?"primary":""}" id="wpat" title="What shape this week runs">${esc(patternName(ws))}</button>
        <span class="chip">${wk.assignments.length}/${wantSlots} shifts</span>
        <span class="chip">${fmtHrs(totalMin)}</span>
        ${crit.length? `<span class="chip crit">${crit.length} must fix</span>`:wk.assignments.length?`<span class="chip ok">compliant</span>`:""}
        ${warn.length? `<span class="chip warn">${warn.length} warnings</span>`:""}
        ${haveRates()? `<span class="chip ${S.org.budget && weekCost(ws)>S.org.budget?"warn":""}">${money(weekCost(ws))}${S.org.budget?" of "+money(S.org.budget):""}</span>`:""}
        <button class="btn" id="wmore">More ▾</button>
        <button class="btn primary" id="wgen">Draft${(S.horizon||1)>1? " "+S.horizon+" weeks":""}…</button>
      </div>
      ${isPhone()? `<div class="row" style="width:100%">
        <button class="btn sm" id="wmore2">More ▾</button>
        <button class="btn sm primary" id="wgen2" style="flex:1">Draft ${(S.horizon||1)>1? S.horizon+" weeks":"the week"}</button>
      </div>`:""}
    </div></div>

    ${reviewCard(ws, wk, V, crit, warn, wantSlots, roster)}

    ${isPhone()? dayList() : `<div class="scroll"><div class="week">
      <div class="hrow">
        <div class="hcell"><div class="dn">Staff</div><div class="dd">${roster.length} active</div></div>
        ${dates.map(d=>{
          const h=S.hours[d.dow];
          return `<div class="hcell ${h.closed?"closed":""}">
            <div class="dn">${DSHORT[d.dow]} ${prettyDate(d.date)}${(()=>{const _h=(S.holidays.list||[]).find(h=>h.date===d.date); if(_h) return ' <span class="busy" title="'+esc(_h.name)+'">'+(holMode(_h)==="closed"?"closed — holiday":holMode(_h)==="reduced"?"holiday cover":"holiday")+'</span>'; return ''})()}${holAdj(d.date)?' <span class="busy" title="Counts one step busier when drafting">holiday rush</span>':dayLoad(d.dow)>0?' <span class="busy">busy</span>':dayLoad(d.dow)<0?' <span class="quiet">quiet</span>':""}</div>
            <div class="dd">${h.closed?"Closed":m2disp(t2m(h.open))+"–"+m2disp(t2m(h.close))}</div>
            ${covStrip(d)}
            <div style="margin-top:4px"><button class="btn sm ghost" data-openday="${d.dow}" style="padding:2px 6px;font-size:11px">Day sheet →</button></div>
          </div>`;
        }).join("")}
      </div>
      ${roster.length? roster.map(e=>{
        const mins=empWeekMinutes(e.id,ws);
        const pct=e.maxH?clamp(mins/(e.maxH*60),0,1):0;
        const over = e.maxH && mins>e.maxH*60+1, under = e.minH && mins<e.minH*60-1 && e.type!=="PRN";
        return `<div class="erow">
          <div class="name">
            <div class="nm">${esc(e.name)}</div>
            <div class="meta"><span class="mono">${fmtHrs(mins)}</span> · ${esc(e.type)}${cyclesOn()&&cycleLabel(e)? " · "+esc(cycleLabel(e)):""}
              ${e.roleIds.slice(0,2).map(id=>{const r=roleById(id);return r?`<span class="tag" style="--sc:${r.color}">${esc(r.abbr||r.name)}</span>`:"";}).join("")}</div>
            <div class="bar"><i style="width:${pct*100}%;background:${over?"var(--crit)":under?"var(--warn)":"var(--accent)"}"></i></div>
          </div>
          ${dates.map(d=>{
            const mine=wk.assignments.filter(a=>a.empId===e.id && a.date===d.date);
            const off = onTimeOff(e.id,d.date);
            const offCycle = cyclesOn() && !cycleWorksOn(e,d.date);
            const unavail = !(e.avail[d.dow]||{}).ok || offCycle;
            const cellViol = V.some(v=>v.sev==="crit" && v.empId===e.id && v.date===d.date);
            return `<div class="ecell ${(off||unavail)&&!mine.length?"off":""}">
              ${off&&!mine.length? `<span class="mini" style="text-align:center">${esc((timeOffFor(e.id,d.date)||{type:"Off"}).type)}</span>`
                : offCycle&&!mine.length? `<span class="mini" style="text-align:center">off cycle</span>`:""}
              ${mine.map(a=>{
                const sh=aShift(a);
                const dv = desireOf(a.shiftId,a.dow);
                return `<div class="shiftblk ${cellViol?"viol":""}${CHG.has(a.empId+"|"+a.date)?" chg":""}${a.callout?" cout":""}" data-edita="${a.id}" tabindex="0" role="button" style="--sc:${sh.color}"
                  title="${esc(sh.label)} · ${DESIRE_LABEL[clamp(dv,-2,2)]}">
                  ${a.locked?'<span class="lk">●</span>':""}
                  <span class="lb">${dv?`<span class="dmark ${dv>0?"g":"b"}">${dv>0?"+":"−"}</span>`:""}${esc(sh.label)}${a.topUp?' <span class="tup">+</span>':""}</span>
                  <span class="tm">${m2disp(a.startMin)}–${m2disp(a.endMin)}</span>
                  ${a.breaks&&a.breaks.meals.length&&S.rules.breakMode==="assigned"?`<span class="tm" style="opacity:.7">meal ${m2disp(a.breaks.meals[0].start)}</span>`:""}
                </div>`;
              }).join("")}
              ${!mine.length && !off && !unavail? `<button class="addbtn" aria-label="Add a shift for ${esc(e.name)}, ${DSHORT[d.dow]}" data-adda="${e.id}:${d.date}:${d.dow}">+</button>`:""}
            </div>`;
          }).join("")}
        </div>`;
      }).join("") : `<div class="empty"><strong>No active staff</strong>Add people under Team.</div>`}
    </div></div>`}

    ${cyclesOn() && roster.some(e=>cycleOf(e))? `<div class="card"><header><h3>Where people are in their cycle</h3>
      <span class="hint">Week of ${esc(prettyDate(ws))}</span></header>
      <div class="scroll"><table><thead><tr><th style="width:180px">Person</th><th style="width:180px">Pattern</th><th>This week</th></tr></thead>
      <tbody>${roster.filter(e=>cycleOf(e)).map(e=>{ const st=cycleStatus(e,ws)||{};
        return `<tr><td><strong>${esc(e.name)}</strong></td><td><span class="chip acc">${esc(st.label||"")}</span></td>
          <td class="mini">${esc(st.detail||"")}</td></tr>`;}).join("")}</tbody></table></div></div>`:""}

    <div class="legend${isPhone()?" phonehide":""}">
      <span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>coverage met</span>
      <span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>short one</span>
      <span><i style="background:var(--crit-soft);border:1px solid var(--crit)"></i>short two or more</span>
      <span>● locked — kept when you rebuild</span>
      <span><b style="color:var(--ok)">+</b> a shift people want · <b style="color:var(--warn)">−</b> one they don't</span>
      ${S.rules.fillMode==="full"? `<span><span class="tup">+</span> ${esc(S.rules.topUpLabel||"Project time")} — beyond the cover you asked for</span>`:""}
      <span>Diagonal cells are time off or outside availability.</span>
    </div>

    ${!costOn()? "" : haveRates()? (()=>{
      const perDay = dates.map(d=>wk.assignments.filter(a=>a.date===d.date).reduce((t,a)=>t+costOf(a),0));
      const mx = Math.max(1,...perDay);
      const hol = holidayPayCost(ws);
      const total = perDay.reduce((a,b)=>a+b,0) + hol;
      const dayBudget = S.org.budget? S.org.budget/7 : 0;
      return `<div class="card"><header><h3>Labor cost</h3>
        <span class="hint">Paid hours at each person's rate, overtime at time and a half. Meals come out; paid rest breaks stay in.</span></header>
        <div class="body grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)">
          <div class="grid3" style="grid-template-columns:1fr 1fr">
            <div class="kpi ${S.org.budget&&total>S.org.budget?"warn":"ok"}"><span class="k">This week</span><span class="v">${money(total)}</span>
              <span class="m">${S.org.budget? (total>S.org.budget? money(total-S.org.budget)+" over budget" : money(S.org.budget-total)+" under budget") : "no budget set"}</span></div>
            <div class="kpi"><span class="k">${hol? "Holiday pay":"Average per shift"}</span>
              <span class="v">${hol? money(hol) : money(total/Math.max(1,wk.assignments.length))}</span>
              <span class="m">${hol? holidaysIn(ws).length+" holiday"+(holidaysIn(ws).length===1?"":"s")+" this week, paid whether worked or not" : wk.assignments.length+" shifts"}</span></div>
          </div>
          <div>
            <div class="spark">${perDay.map(v=>`<i class="${dayBudget&&v>dayBudget?"over":""}" style="height:${Math.max(3,v/mx*100)}%" title="${money(v)}"></i>`).join("")}</div>
            <div class="sparkx">${dates.map(d=>`<span>${DSHORT[d.dow]}</span>`).join("")}</div>
          </div>
        </div></div>`;
    })() : `<div class="card"><header><h3>Labor cost</h3></header><div class="body">
      <div class="help">Add hourly rates on each person's profile and this turns into a live cost-per-day chart against your weekly budget. Rates never leave this board and never appear on a printed schedule.</div>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-go="team">Add rates</button></div></div></div>`}

    <div class="card" style="display:${DIFF.length?"":"none"}"><header><h3>Changed since it last went out</h3>
      <span class="hint">${DIFF.length} change${DIFF.length===1?"":"s"} — the dots on the grid mark who's affected</span></header>

        ${DIFF.map(d=>`<div class="viol-i"><span class="sv warn"></span><div class="tx"><strong>${DSHORT[d.dow]} — ${esc(d.name)}</strong><span>${esc(d.say)}</span></div></div>`).join("")}

        ${V.length? V.map(v=>`<div class="viol-i"><span class="sv ${v.sev}"></span>
          <div class="tx"><strong>${esc(v.title)}</strong><span>${esc(v.detail)}</span></div>
          ${v.openSlot? `<button class="btn sm primary" data-fill="${v.openSlot}" style="margin-left:auto;flex:none">Who could work it?</button>`

          : `<div class="empty"><strong>Nothing drafted yet</strong>Draft the week and it gets checked shift by shift.</div>`}

}
WIRE.week = root=>{
  root.querySelector("#wprev").onclick=()=>{ S.currentWeek=addDays(S.currentWeek,-7); save(); render(); };
  root.querySelector("#wnext").onclick=()=>{ S.currentWeek=addDays(S.currentWeek,7); save(); render(); };
  root.querySelector("#wtoday").onclick=()=>{ S.currentWeek=weekStartOf(ymd(new Date()),S.org.weekStart); save(); render(); };
  root.querySelector("#wgen").onclick=()=>draftModal();
  root.querySelector("#wmore").onclick=()=>weekMoreModal();
  const wp2=root.querySelector("#wpat"); if(wp2) wp2.onclick=()=>weekPatternModal(S.currentWeek);
  const g2=root.querySelector("#wgen2");
  if(g2) g2.onclick=()=>{ const r=generateSchedule(); const w=getWeek(); w.suggested=true; w.touched=true; save(); render();
    toast(r.unfilled.length? r.filled+" shifts drafted · "+r.unfilled.length+" left open" : r.filled+" shifts drafted"); };
  const rg=root.querySelector("#wredo");
  if(rg) rg.onclick=()=>redoModal(S.currentWeek);
  const wsh=root.querySelector("#wshape"); if(wsh) wsh.onclick=()=>weekPatternModal(S.currentWeek);
  const wp=root.querySelector("#wpost");
  if(wp) wp.onclick=()=>{ const ws=S.currentWeek, changes=weekDiff(ws);
    repostGuard(ws, choice=>{ const wk=getWeek(); wk.published=true; wk.publishedAt=Date.now(); wk.postedOnce=true; snapWeek(wk);
      wk.assignments.forEach(a=>a.locked=true); save(); render();
      if(choice){ toast("Posted and locked"); repostNotify(ws, choice, changes); }
      else if(sendOn()){ toast("Posted and locked — now send it out"); setTimeout(()=>sendModal(S.currentWeek), 350); }
      else toast("Week posted and locked"); }); };
  const wsend=root.querySelector("#wsend"); if(wsend) wsend.onclick=()=>sendModal(S.currentWeek);
  const wu=root.querySelector("#wunpost");
  if(wu) wu.onclick=()=>{ const wk=getWeek(); wk.published=false; wk.assignments.forEach(a=>a.locked=false); save(); render(); toast("Unposted — edits are open again"); };
  root.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{

  root.querySelectorAll("[data-denyreq]").forEach(b=>b.onclick=()=>requestConflictModal(S.currentWeek));
  wireDragDrop(root);
  root.querySelectorAll("[data-openday]").forEach(b=>b.onclick=()=>{ DAYVIEW=+b.dataset.openday; go("day"); });
  root.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ DAYVIEW=+b.dataset.jump; go("day"); });
  root.querySelectorAll("[data-edita]").forEach(b=>{ b.onclick=()=>assignModal(b.dataset.edita);
    if(b.tagName!=="BUTTON") b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); assignModal(b.dataset.edita); } }; });
  root.querySelectorAll("[data-adda]").forEach(b=>b.onclick=()=>{
    const [empId,date,dow]=b.dataset.adda.split(":"); newAssignModal(empId,date,+dow);
  });
  root.querySelectorAll("[data-addday]").forEach(b=>b.onclick=()=>{
    const [date,dow]=b.dataset.addday.split(":"); addToDayModal(date,+dow);
  });
  root.querySelectorAll("[data-togday]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.togday;
    if(DAYOPEN.has(d)) DAYOPEN.delete(d); else DAYOPEN.add(d);
    render();
  });
  const m2b=root.querySelector("#wmore2"); if(m2b) m2b.onclick=()=>weekMoreModal();
  const g2b=root.querySelector("#wgen2"); if(g2b) g2b.onclick=()=>draftModal();
};

/* Who's free that day — pick a name, then the usual shift picker. */
function addToDayModal(date, dow){
  const wk=peekWeek(S.currentWeek);
  const busy=new Set(wk.assignments.filter(a=>a.date===date).map(a=>a.empId));
  const free=S.employees.filter(e=>e.active && !busy.has(e.id));
  if(!free.length){ toast("Everyone active is already on that day"); return; }
  const ok=free.filter(e=>(e.avail[dow]||{}).ok && !onTimeOff(e.id,date) && cycleWorksOn(e,date));
  const rest=free.filter(e=>!ok.includes(e));
  modal("Add someone — "+DAYS[dow]+" "+prettyDate(date), `
    <div class="stack">
      <div class="field"><label>Who</label><select id="adw">
        ${ok.map(e=>`<option value="${e.id}">${esc(e.name)} · ${esc(e.type)}</option>`).join("")}
        ${rest.length? `<optgroup label="Not normally available that day">
          ${rest.map(e=>`<option value="${e.id}">${esc(e.name)} · ${onTimeOff(e.id,date)?"on time off":"outside their availability"}</option>`).join("")}
        </optgroup>`:""}
      </select></div>
      <div class="mini">Pick a name and you'll choose the shift next. Anything that breaks a rule is flagged before you save.</div>
    </div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="adgo">Next</button>`,
    r=>{ r.querySelector("#adgo").onclick=()=>{
      const id=r.querySelector("#adw").value; closeModal(); newAssignModal(id,date,dow); }; });
}

        const ok=availOk(e,dow,a,b);
        return `<option value="${s.id}">${esc(s.label)} · ${m2disp(a)}–${m2disp(b)}${ok?"":"  (outside stated availability)"}</option>`;}).join("")}</select></div>
      <div class="field"><label>Working as</label><select id="nr">${e.roleIds.map(id=>`<option value="${id}">${esc(roleName(id))}</option>`).join("")||'<option value="">No role set</option>'}</select></div>
      <label class="switch"><input type="checkbox" id="nl"> Lock it — keep this when I rebuild the week</label>

}
