<style>
:root{
  --ground:#eaedeb; --surface:#ffffff; --surface2:#f4f6f5; --sunken:#e2e6e4;
  --ink:#18211f; --ink2:#3c4a47; --muted:#697773; --faint:#667470;
  --line:#d2d8d6; --line2:#bfc7c4; --line-strong:#7d8b87;
  --accent:#1c6a66; --accent-soft:#dcebe9; --accent-ink:#0f4a47; --on-accent:#ffffff;
  --ok:#2c7a4b; --ok-soft:#dcefe2;
  --warn:#8f5d10; --warn-soft:#f6ead4; --on-warn:#ffffff;
  --crit:#ab382c; --crit-soft:#f7e0dc;
  --shadow:0 1px 2px rgba(24,33,31,.06),0 6px 18px rgba(24,33,31,.05);
  --r:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101514; --surface:#191f1e; --surface2:#212927; --sunken:#0b100f;
    --ink:#e7ecea; --ink2:#c2ccc9; --muted:#8d9b97; --faint:#6d7b77; --line-strong:#778682; --line-strong:#778682;
    --line:#2c3634; --line2:#3c4846;
    --accent:#4cb3a9; --accent-soft:#173432; --accent-ink:#8fd8d0; --on-accent:#08201f;
    --ok:#5cb87e; --ok-soft:#16301f;
    --warn:#d9a441; --warn-soft:#33260f; --on-warn:#241905; --on-warn:#241905;
    --crit:#e2796a; --crit-soft:#3a1c17;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --ground:#101514; --surface:#191f1e; --surface2:#212927; --sunken:#0b100f;
  --ink:#e7ecea; --ink2:#c2ccc9; --muted:#8d9b97; --faint:#6d7b77;
  --line:#2c3634; --line2:#3c4846;
  --accent:#4cb3a9; --accent-soft:#173432; --accent-ink:#8fd8d0; --on-accent:#08201f;
  --ok:#5cb87e; --ok-soft:#16301f;
  --warn:#d9a441; --warn-soft:#33260f; --on-warn:#241905;
  --crit:#e2796a; --crit-soft:#3a1c17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Archivo","Public Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.012em}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.brand .mark{
  width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-family:"Archivo","Public Sans",sans-serif;font-weight:700;font-size:15px;flex:none;letter-spacing:-.02em;
}
.brand h1{font-size:15px;font-weight:700;line-height:1.15}
.brand .sub{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:500}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px;flex:1}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:600;padding:14px 8px 5px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:8px 9px;border-radius:6px;cursor:pointer;color:var(--ink2);font-size:13.5px;font-weight:500;
}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .n{margin-left:auto;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.nav button[aria-current="true"] .n{color:var(--accent-ink)}
.railfoot{padding:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok)}
.railfoot small{color:var(--muted);font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.topbar h2{font-size:18px;font-weight:600}
.topbar .desc{color:var(--muted);font-size:12.5px;flex:1;min-width:160px}
.pane{padding:22px;max-width:1240px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>header h3{font-size:13.5px;font-weight:600}
.card>header .hint{font-size:12px;color:var(--muted);flex:1;min-width:120px}
.card .body{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
/* a two-up layout asked for by name still has to fold on a phone */
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)!important}}
/* let a wrapping row inside a spread actually wrap instead of pushing wide */
.spread>*{min-width:0}.row>.row{min-width:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=email],input[type=tel],select,textarea{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:7px 9px;width:100%;
  transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:60px;font-size:13px}
input[type=time],input[type=date],input[type=number]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);
  padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;
  transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:var(--surface2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--line2)}
.btn.danger:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn.sm{padding:4px 8px;font-size:12px;border-radius:5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap;
}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.03em}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto;overscroll-behavior-x:contain}
.empty{padding:30px 18px;text-align:center;color:var(--muted);font-size:13px}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-family:"Archivo","Public Sans",sans-serif}
.help{font-size:12px;color:var(--muted);line-height:1.5}
.sep{height:1px;background:var(--line);margin:4px 0}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none}
.switch input{appearance:none;width:34px;height:19px;border-radius:99px;background:var(--sunken);border:1px solid var(--line2);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input::after{content:"";position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked::after{transform:translateX(15px)}
.seg{display:inline-flex;background:var(--sunken);border-radius:6px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:"Archivo","Public Sans",sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .m{font-size:11.5px;color:var(--muted)}
.kpi.crit{border-color:var(--crit)} .kpi.crit .v{color:var(--crit)}
.kpi.warn{border-color:var(--warn)} .kpi.warn .v{color:var(--warn)}
.kpi.ok .v{color:var(--ok)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,18,17,.5);backdrop-filter:blur(2px);z-index:100;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.28);width:100%;min-width:0;max-width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;margin:auto}
.modal>header{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal>header h3{font-size:15px;font-weight:600;flex:1}
.modal .body{padding:18px;overflow-y:auto;overscroll-behavior:contain}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface2);border-radius:0 0 10px 10px}
.modal>footer>*{min-width:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:7px;font-size:13px;font-weight:500;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:80vw}

/* ---------- availability grid ---------- */
.avail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:700px){.avail{grid-template-columns:repeat(4,minmax(0,1fr))}}
.avail .d{border:1px solid var(--line);border-radius:6px;padding:8px 6px;text-align:center;background:var(--surface2)}
.avail .d .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);margin-bottom:6px}
.avail .d.on{background:var(--accent-soft);border-color:var(--accent)}
.avail .d input[type=time]{font-size:11px;padding:3px 2px;text-align:center;width:100%;min-width:0}
.vmonths{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vmon .t{font-weight:700;font-size:12.5px;margin-bottom:5px}
.vgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.vgrid span{font-size:9px;color:var(--muted);text-align:center}
.vgrid i{display:block;aspect-ratio:1;border-radius:3px;background:var(--sunken);position:relative;font-style:normal;font-size:8.5px;color:var(--muted);text-align:center;line-height:2.1}
.vgrid i.h1{background:#e7d9ae}.vgrid i.h2{background:#dfb684}.vgrid i.h3{background:#d99a8f}
.vgrid i.ok{background:var(--accent);color:#fff;font-weight:700}
.vgrid i.hol{outline:2px solid var(--warn);outline-offset:-2px}
@media (prefers-color-scheme: dark){.vgrid i.h1{background:#4d431f}.vgrid i.h2{background:#59391b}.vgrid i.h3{background:#5c241c}}
.vleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.vleg i{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px}
.avail .d .tog{width:100%;border:0;background:var(--sunken);border-radius:4px;padding:4px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);margin-bottom:5px}
.avail .d.on .tog{background:var(--accent);color:var(--on-accent)}

/* ---------- week grid ---------- */
.week{min-width:900px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.week .hrow,.week .erow{display:grid;grid-template-columns:170px repeat(7,1fr)}
.week .hrow{background:var(--surface2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.week .hcell{padding:8px 10px;border-left:1px solid var(--line);font-size:11px}
.week .hcell:first-child{border-left:0}
.week .hcell .dn{font-weight:700;font-family:"Archivo","Public Sans",sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.week .hcell .dd{color:var(--muted);font-size:11px}
.week .hcell.closed{opacity:.5}
.week .erow{border-bottom:1px solid var(--line)}
.week .erow:last-child{border-bottom:0}
.week .erow:hover{background:var(--surface2)}
.week .ecell{border-left:1px solid var(--line);padding:5px;min-height:56px;display:flex;flex-direction:column;gap:4px}
.week .name{padding:8px 10px;display:flex;flex-direction:column;gap:2px;justify-content:center;min-width:0}
.week .name .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .name .meta{font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.week .name .bar{height:3px;border-radius:2px;background:var(--sunken);overflow:hidden;margin-top:3px}
.week .name .bar i{display:block;height:100%;background:var(--accent)}
.shiftblk{
  border-radius:5px;padding:4px 6px;font-size:11.5px;line-height:1.3;cursor:pointer;border-left:3px solid var(--accent);
  background:var(--accent-soft);color:var(--accent-ink);position:relative;
}
.shiftblk .lb{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shiftblk .tm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.85;font-variant-numeric:tabular-nums}
.shiftblk.viol{border-left-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.shiftblk .lk{position:absolute;top:2px;right:4px;font-size:9px;opacity:.7}
.shiftblk.chg::before{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.card.folded>*:not(header){display:none}
.fixopt.bestfix{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 5%,var(--surface))}
.hnotice{display:flex;align-items:center;gap:10px;justify-content:space-between;
  border-left:3px solid var(--accent);background:var(--surface);border-radius:0 7px 7px 0;
  padding:9px 12px;font-size:13px;color:var(--ink2)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid.mhead{margin-bottom:4px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mgrid.mhead div{text-align:center}

/* ---------- coverage bar ---------- */
.stblk{display:flex;gap:6px;align-items:center;margin-bottom:3px;font-size:12px;white-space:nowrap}
.stblk .mono{color:var(--muted);font-size:11px;min-width:88px}

/* ---------- day timeline ---------- */
.tl{min-width:820px}
.tlrow{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tlrow:last-child{border-bottom:0}
.tlname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlname small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.tltrack{position:relative;height:34px;background:var(--sunken);border-radius:5px}
.tlshut{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent,transparent 4px,var(--line2) 4px,var(--line2) 5px);opacity:.55;pointer-events:auto}
.tlbar{position:absolute;top:0;bottom:0;background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px;display:flex;align-items:center;padding:0 6px;font-size:11px;color:var(--accent-ink);font-weight:600;overflow:hidden;white-space:nowrap}
.tlmeal{position:absolute;top:2px;bottom:2px;background:var(--warn);border-radius:3px;display:grid;place-items:center;color:var(--on-warn);font-size:9px;font-weight:700;overflow:hidden;z-index:2}
.tlmeal.apart{outline:2px dashed var(--ink2);outline-offset:1px}
.tlrest{position:absolute;top:2px;bottom:2px;background:var(--ok);border-radius:2px;z-index:2;min-width:4px}
.tlhead{display:grid;grid-template-columns:160px 1fr;gap:10px;padding-bottom:4px}
.tlticks{position:relative;height:16px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--faint)}
.tlticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tlgrid{position:absolute;inset:0;pointer-events:none}
.tlgrid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}

/* ---------- misc ---------- */
.viollist{display:flex;flex-direction:column;gap:0}
.viol-i{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:flex-start;font-size:13px}
.viol-i:last-child{border-bottom:0}
.viol-i .sv{width:3px;align-self:stretch;border-radius:2px;flex:none}
.viol-i .sv.crit{background:var(--crit)} .viol-i .sv.warn{background:var(--warn)} .viol-i .sv.info{background:var(--muted)}
.viol-i .tx strong{display:block;font-weight:600;font-size:13px}
.viol-i .tx span{color:var(--muted);font-size:12px}
.rank{display:flex;flex-direction:column;gap:6px}
.rankitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.rankitem .no{width:22px;height:22px;border-radius:5px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.codebox{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:10px;word-break:break-all;max-height:130px;overflow:auto;line-height:1.45}
.banner{display:flex;flex-wrap:wrap;gap:10px;padding:11px 14px;border-radius:var(--r);font-size:13px;align-items:flex-start;border:1px solid}

@media (max-width:430px){ .banner>.btn{width:100%;margin-left:0!important;justify-content:center} }
.banner.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.banner b{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}

/* shift + role colours that survive both themes */

}

   Weeksolved — staff scheduling with labor-law aware breaks

/* ---------- small utils ---------- */
const $ = (s,r)=> (r||document).querySelector(s);

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function m2t(m){ m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mm=m%60;
  return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0"); }
function t2m(t){ if(!t) return 0; const p=String(t).split(":"); return (+p[0])*60+(+(p[1]||0)); }
function m2disp(m){ m=((m%1440)+1440)%1440; let h=Math.floor(m/60); const mm=m%60;
  const ap=h>=12?"p":"a"; h=h%12; if(h===0)h=12;
  return h+(mm?":"+String(mm).padStart(2,"0"):"")+ap; }
function hrs(m){ return Math.round(m/6)/10; }
function fmtHrs(m){ const h=m/60; return (Math.round(h*100)/100).toString().replace(/\.0+$/,"")+"h"; }
function ymd(d){ const z=new Date(d); return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0"); }
function parseYmd(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function weekStartOf(dateStr, startDow){
  const d=parseYmd(dateStr); const diff=(d.getDay()-startDow+7)%7; d.setDate(d.getDate()-diff); return ymd(d);
}
function prettyDate(s){ const d=parseYmd(s);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function prettyFull(s){ const d=parseYmd(s);

/* ============================================================
   Handing the schedule out
   ------------------------------------------------------------
   Nothing is sent by Weeksolved itself — it has no mail server and never will
   without one behind it. What it does is write the message and open your
   own mail or messaging app with everything already in it, so sending is
   one tap and the wording is the same every week.
   ============================================================ */
function sendOn(){ return !!(S.rules && S.rules.sendOut); }
function contactOf(e){ return {email:(e.email||"").trim(), phone:(e.phone||"").trim()}; }
function hasContact(e, how){
  const c=contactOf(e);
  return how==="sms"? !!c.phone : !!c.email;
}
/* one person's week, in the plainest words that still say everything */
function personalText(empId, ws){
  const e=empById(empId); if(!e) return "";
  const wk=peekWeek(ws);
  const mine=wk.assignments.filter(a=>a.empId===empId).sort((x,y)=>x.date.localeCompare(y.date)||x.startMin-y.startMin);
  const L=[];
  L.push((S.org.name||"Work")+" — your shifts, "+prettyDate(ws)+" to "+prettyDate(addDays(ws,6)));
  L.push("");
  const D=weekDiff(ws).filter(d=>d.empId===empId);
  if(D.length){
    L.push("CHANGED since the last version you saw:");
    D.forEach(d=>L.push("   "+DSHORT[d.dow]+": "+d.say));
    L.push("");
  }
  if(!mine.length){ L.push("You're not on the schedule this week."); }
  else {
    weekDates(ws).forEach(d=>{
      const on=mine.filter(a=>a.date===d.date);
      if(!on.length) return;
      on.forEach(a=>{
        const sh=aShift(a);
        let line=DSHORT[d.dow]+" "+prettyDate(d.date)+"  "+m2disp(a.startMin)+"\u2013"+m2disp(a.endMin)+"  "+sh.label;
        if(a.topUp) line += " ("+(S.rules.topUpLabel||"project time")+")";
        L.push(line);
        const b=a.breaks||{meals:[],rests:[]};
        if(S.rules.breakMode==="assigned" && b.meals.length)
          L.push("      meal "+b.meals.filter(m=>!m.waived).map(m=>m2disp(m.start)).join(", "));
        const st=a.station? stationById(a.station):null;
        if(st) L.push("      station: "+st.name+(a.station2? ", then "+(stationById(a.station2)||{name:""}).name : ""));
      });
    });
    L.push("");
    L.push("Total "+fmtHrs(mine.reduce((t,a)=>t+paidMinutes(a),0))+" paid across "+
      new Set(mine.map(a=>a.date)).size+" day"+(new Set(mine.map(a=>a.date)).size===1?"":"s")+".");
  }
  L.push("");
  L.push("Anything wrong, tell your manager before the week starts.");
  return L.join("\n");
}
/* the whole week, day by day, for everyone */
function wholeWeekText(ws){
  const wk=peekWeek(ws);
  const L=[];
  L.push((S.org.name||"Work")+" — schedule for "+prettyDate(ws)+" to "+prettyDate(addDays(ws,6)));
  L.push("");
  const D=weekDiff(ws);
  if(D.length){
    L.push("CHANGED since the last version you saw:");
    D.forEach(d=>L.push("   "+DSHORT[d.dow]+" — "+d.name+": "+d.say));
    L.push("");
  }
  weekDates(ws).forEach(d=>{
    const on=wk.assignments.filter(a=>a.date===d.date).sort((x,y)=>x.startMin-y.startMin);
    L.push(DAYS[d.dow]+" "+prettyDate(d.date)+(S.hours[d.dow].closed? "  — closed":""));
    if((wk.dayNotes||{})[d.date]) L.push("   NOTE: "+wk.dayNotes[d.date]);
    if(!on.length){ L.push("   nobody scheduled"); }
    else on.forEach(a=>{
      const e=empById(a.empId)||{name:"—"}, sh=aShift(a);
      L.push("   "+m2disp(a.startMin)+"\u2013"+m2disp(a.endMin)+"  "+e.name+"  ("+sh.label+")");
    });
    L.push("");
  });
  L.push("Questions to your manager, please.");
  return L.join("\n");
}
function openMail(to, subject, body){
  window.open("mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subject)+
    "&body="+encodeURIComponent(body.slice(0,1800)),"_blank");
}
function openSms(to, body){
  /* iOS wants &body=, Android wants ?body= — this form works on both */
  const sep = /(iPhone|iPad|iPod|Mac)/i.test(navigator.userAgent) ? "&" : "?";
  window.open("sms:"+encodeURIComponent(to)+sep+"body="+encodeURIComponent(body.slice(0,900)),"_blank");
}

function sendModal(ws){
  ws = ws||S.currentWeek;
  const wk=getWeek(ws);
  if(!wk.assignments.length){ toast("Nothing to send — this week is empty"); return; }
  const roster=S.employees.filter(e=>e.active);
  const working=roster.filter(e=>wk.assignments.some(a=>a.empId===e.id));
  let mode="each", how="email", step=1, queue=[], at=0;

  const paint=(r)=>{
    const body=r.querySelector("#sbody");
    const people = mode==="each"? working : roster;
    const reachable = people.filter(e=>hasContact(e,how));
    const missing = people.filter(e=>!hasContact(e,how));

    if(step===1){
      body.innerHTML = `
        <p class="whead">Weeksolved writes the message and opens your own mail or messages app with it ready to go. Nothing leaves this device until you press send there.</p>
        <div class="field"><label>What to send</label>
          <div class="wopts">
            <button type="button" class="wopt ${mode==="each"?"on":""}" data-mode="each">
              <span class="wt">Each person gets just their own shifts</span>
              <span class="wd">${working.length} ${working.length===1?"person is":"people are"} on this week. One message each, with their days, times, meal breaks and station.</span></button>
            <button type="button" class="wopt ${mode==="all"?"on":""}" data-mode="all">
              <span class="wt">Everyone gets the whole week</span>
              <span class="wd">One message, the full rota day by day, to all ${roster.length} active staff.</span></button>
          </div></div>
        <div class="field"><label>How</label>
          <div class="seg" id="show">
            <button type="button" data-how="email" aria-pressed="${how==="email"}">Email</button>
            <button type="button" data-how="sms" aria-pressed="${how==="sms"}">Text</button>
            <button type="button" data-how="copy" aria-pressed="${how==="copy"}">Just copy it</button>
          </div></div>
        ${how!=="copy"? `<div class="banner ${missing.length?"warn":"info"}"><div>
          <b>${reachable.length} of ${people.length} can be reached by ${how==="sms"?"text":"email"}.</b>
          ${missing.length? "No "+(how==="sms"?"mobile number":"email address")+" on file for "+esc(missing.map(e=>e.name.split(" ")[0]).join(", "))+". Add one on their profile under Team." : "Everyone has one on file."}
        </div></div>`:""}
        <div class="field"><label>Preview${mode==="each"&&working.length? " — "+esc(working[0].name.split(" ")[0])+"'s copy":""}</label>
          <textarea rows="9" readonly style="font-family:'IBM Plex Mono',monospace;font-size:11.5px">${esc(mode==="each"? personalText((working[0]||{}).id, ws) : wholeWeekText(ws))}</textarea></div>`;
      r.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; paint(r); });
      r.querySelectorAll("[data-how]").forEach(b=>b.onclick=()=>{ how=b.dataset.how; paint(r); });
      r.querySelector("#sgo").textContent = how==="copy"? "Copy it" : "Send \u2014 one at a time";
      r.querySelector("#sgo").disabled = how!=="copy" && !reachable.length;
    } else {
      const e=queue[at];
      body.innerHTML = `
        <p class="whead">${at+1} of ${queue.length}. Your ${how==="sms"?"messages":"mail"} app opens with this ready — press send there, then come back for the next one.</p>
        <div class="card"><div class="body">
          <b>${esc(e? e.name : "")}</b>
          <div class="mini">${esc(e? (how==="sms"? contactOf(e).phone : contactOf(e).email) : "")}</div>
        </div></div>
        <div class="field"><label>What they'll get</label>
          <textarea rows="8" readonly style="font-family:'IBM Plex Mono',monospace;font-size:11.5px">${esc(e? personalText(e.id, ws) : "")}</textarea></div>
        <div class="mini">Sent so far: ${at} of ${queue.length}.</div>`;
      r.querySelector("#sgo").textContent = at+1>=queue.length? "Open the last one" : "Open this one";
      r.querySelector("#sgo").disabled=false;
    }
  };

  modal("Send the schedule", `<div class="stack" id="sbody"></div>`,
    `<button class="btn" data-close>Close</button><button class="btn primary" id="sgo">Send</button>`,
    r=>{
      paint(r);
      r.querySelector("#sgo").onclick=async()=>{
        const people = mode==="each"? working : roster;
        const reachable = people.filter(e=>hasContact(e,how));

        if(how==="copy"){
          const txt = mode==="each"
            ? working.map(e=>personalText(e.id,ws)).join("\n\n" + "-".repeat(40) + "\n\n")
            : wholeWeekText(ws);
          try{ await navigator.clipboard.writeText(txt); toast("Copied — paste it wherever you like"); }
          catch(err){ toast("Couldn't copy here — use the Export page instead"); }
          return;
        }

        if(mode==="all"){
          const sub=(S.org.name||"Work")+" schedule — week of "+prettyDate(ws);
          const txt=wholeWeekText(ws);
          if(how==="email") openMail(reachable.map(e=>contactOf(e).email).join(","), sub, txt);
          else openSms(reachable.map(e=>contactOf(e).phone).join(","), txt);
          wk.sentAt=Date.now(); wk.sentTo=reachable.length; snapWeek(wk); save(); closeModal(); render();
          toast("Opened your "+(how==="sms"?"messages":"mail")+" app with all "+reachable.length+" on it");
          return;
        }

        /* one person at a time, so each gets only their own */
        if(step===1){ queue=reachable; at=0; step=2; paint(r); return; }
        const e=queue[at];
        if(e){
          if(how==="email") openMail(contactOf(e).email, "Your shifts — week of "+prettyDate(ws), personalText(e.id,ws));
          else openSms(contactOf(e).phone, personalText(e.id,ws));
        }
        at++;
        if(at>=queue.length){
          wk.sentAt=Date.now(); wk.sentTo=queue.length; snapWeek(wk); save(); closeModal(); render();
          toast("That's all "+queue.length+" — check your sent folder to be sure");
        } else paint(r);
      };
    });
}

function codeHash(str){
  const P=[2166136261,16777619,2246822519,3266489917];
  let h=[P[0],P[2],P[3],P[1]];
  const t=String(str).trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  for(let i=0;i<t.length;i++){
    for(let k=0;k<4;k++){
      h[k]^=t.charCodeAt(i)+k*7+i;
      h[k]=Math.imul(h[k],P[k])>>>0;
      h[k]=(h[k]<<13|h[k]>>>19)>>>0;
    }
  }
  return h.map(x=>(x>>>0).toString(36).padStart(7,"0")).join("");
}

function accessOk(){
  if(!ACCESS.on) return true;
  try{
    const raw=localStorage.getItem(PASSKEY);
    const p=raw? JSON.parse(raw) : null;
    if(p && p.life && p.id) return ACCESS.codes.some(c=>c.id===p.id);  /* founding pass: no end date, ever */
    if(ACCESS.until && ymd(new Date()) > ACCESS.until) return false;
    if(!p || !p.id || !p.exp) return false;
    if(ymd(new Date()) > p.exp) return false;
    return ACCESS.codes.some(c=>c.id===p.id);
  }catch(e){ return false; }
}
function accessWho(){

  inp.onkeydown=e=>{ if(e.key==="Enter") tryIt(); };

function cloudBoot(){

async function cloudEnter(){
  const uid=FB.user.uid;
  const prof=await FB.db.doc("users/"+uid+"/meta/profile").get();
  if(!prof.exists){
    await FB.auth.signOut().catch(()=>{});
    authScreen("That account isn't part of this test. Create one with the access code you were given.");
    return;
  }
  const p=prof.data()||{};
  window.TESTER_ID=p.codeId||"";
  window.TESTER_LIFE=!!p.life;
  const expMs=(p.activated||0)+(p.days||30)*86400000;
  const hardEnd=ACCESS.until? parseYmd(ACCESS.until).getTime()+86400000 : Infinity;
  if(!p.life && (Date.now()>expMs || Date.now()>hardEnd)){ expiredScreen(); return; }

  WKHASH={};
  const remote=await cloudFetchAll(uid);
  const local=lsLoad();
  if(remote){
    CLOUD_REV=remote.rev;
    const localAt=local? (local._at||0):0;
    if(!local || remote.at>=localAt){ S=migrate(remote.state); lsSave(); if(remote.legacy) cloudPushNow(); }
    else { S=migrate(local); cloudPushNow(); }   /* this device is ahead — push it up */
  } else {
    S=(local && local.v===3)? migrate(local) : seedState();
    cloudPushNow();
  }
  startApp();
  setSync(true,"Signed in — your board follows you between devices");
  if(cloudUnsub) cloudUnsub();
  cloudUnsub=FB.db.doc("users/"+uid+"/board/current").onSnapshot(async sn=>{
    if(!sn.exists || (sn.metadata&&sn.metadata.hasPendingWrites)) return;
    const d=sn.data()||{};
    if((d.rev||0)<=CLOUD_REV) return;
    CLOUD_REV=d.rev||0;
    try{
      const r=await cloudFetchAll(uid);
      if(r){ S=migrate(r.state); lsSave(); render(); toast("Updated from your other device"); }
    }catch(e){}
  });
}

function cloudPush(){
  if(!FB || !FB.user) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(cloudPushNow, 1200);
}
let WKHASH={};    /* last-pushed fingerprint per week, so only changed weeks travel */
function coreJson(){ const c=Object.assign({}, S); c.weeks={}; return JSON.stringify(c); }
function cloudPushNow(){
  if(!FB || !FB.user) return;
  CLOUD_REV++;
  const uid=FB.user.uid;
  const jobs=[];
  /* weeks first, board last — the board's rev is the signal that everything under it is in place */
  Object.keys(S.weeks).forEach(ws=>{
    const j=JSON.stringify(S.weeks[ws]);
    const h=codeHash(j);
    if(WKHASH[ws]===h) return;
    jobs.push(FB.db.doc("users/"+uid+"/weeks/"+ws).set({json:j, at:Date.now()}).then(()=>{ WKHASH[ws]=h; }));
  });
  /* weeks that no longer exist locally (Clear everything) come off the cloud too */
  Object.keys(WKHASH).forEach(ws=>{
    if(S.weeks[ws]) return;
    const ref=FB.db.doc("users/"+uid+"/weeks/"+ws);
    if(ref.delete) jobs.push(ref.delete().then(()=>{ delete WKHASH[ws]; }).catch(()=>{}));
    else delete WKHASH[ws];
  });
  Promise.all(jobs)
    .then(()=>FB.db.doc("users/"+uid+"/board/current").set({json:coreJson(), split:true, rev:CLOUD_REV, at:Date.now()}))
    .then(()=>setSync(true,"Saved to your account"))
    .catch(()=>setSync(false,"Offline — kept on this device, sends when you're back"));
}
async function cloudFetchAll(uid){
  const board=await FB.db.doc("users/"+uid+"/board/current").get();
  if(!board.exists || !(board.data()||{}).json) return null;
  const d=board.data();
  if(!d.split){
    /* legacy single-document board from an earlier build */
    return {state:JSON.parse(d.json), rev:d.rev||0, at:d.at||0, legacy:true};
  }
  const core=JSON.parse(d.json);
  core.weeks={};
  const snap=await FB.db.collection("users/"+uid+"/weeks").get();
  (snap.docs||[]).forEach(ds=>{
    try{ const w=(ds.data()||{}).json; if(w){ core.weeks[ds.id]=JSON.parse(w); WKHASH[ds.id]=codeHash(w); } }catch(e){}
  });
  return {state:core, rev:d.rev||0, at:d.at||0, legacy:false};
}

function authErrSay(e){
  const c=(e&&e.code)||"";
  if(c==="auth/email-already-in-use") return "That email already has an account — use Sign in instead.";
  if(c==="auth/invalid-email") return "That doesn't look like an email address.";
  if(c==="auth/weak-password") return "Pick a longer password — 8 characters or more.";
  if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found") return "Email and password don't match an account here.";
  if(c==="auth/too-many-requests") return "Too many tries — wait a minute and try again.";
  if(c==="auth/network-request-failed") return "No connection. Try again when you're back online.";
  return (e&&e.message)||"Something went wrong — try again.";
}

async function cloudSignup(code,email,pass){
  const h=codeHash((code||"").trim());
  const hit=ACCESS.codes.find(c=>c.h===h);
  if(!hit) throw {message:"That access code isn't recognized. Check it and try again."};
  if(!hit.life && ACCESS.until && ymd(new Date())>ACCESS.until) throw {message:"This test has ended."};
  SIGNING_UP=true;
  try{
    const cred=await FB.auth.createUserWithEmailAndPassword(email.trim(), pass);
    FB.user=cred.user;
    try{ await FB.db.doc("codes/"+h).set({uid:cred.user.uid, id:hit.id, at:Date.now()}); }
    catch(e){
      await cred.user.delete().catch(()=>{});
      await FB.auth.signOut().catch(()=>{});
      throw {message:"That code has already been used to create an account. Each code works once."};
    }
    await FB.db.doc("users/"+cred.user.uid+"/meta/profile")
      .set({codeId:hit.id, days:hit.days||30, life:!!hit.life, activated:Date.now(), email:email.trim()});
    try{ localStorage.setItem(PASSKEY, JSON.stringify({id:hit.id, exp:hit.life?"9999-12-31":ymd(new Date(Date.now()+(hit.days||30)*86400000)), life:!!hit.life, at:Date.now()})); }catch(e){}
  } finally { SIGNING_UP=false; }
  await cloudEnter();
}

function migrate(o){

  if(!Array.isArray(s.requests)) s.requests=[];
  if(!Array.isArray(s.patterns)) s.patterns=[];
  if(!Array.isArray(s.stations)) s.stations=[];
  if(!Array.isArray(s.bugs)) s.bugs=[];

  if(!s.support.email || s.support.email==="hello@weeksolved.com") s.support.email="weeksolved@gmail.com";

    if(typeof x.critical!=="boolean") x.critical=false;
    if(x.reliefFrom===undefined) x.reliefFrom=null; });

  if(!s.rules.fillMode) s.rules.fillMode="demand";

  if(typeof s.org.trackPto!=="boolean") s.org.trackPto=false;

  if(!s.rules.projectShare) s.rules.projectShare="fair";
  if(typeof s.rules.projectMinH!=="number") s.rules.projectMinH=4;

  if(!s.rules.stationRotation) s.rules.stationRotation="fair";
  if(!s.rules.stationSpan) s.rules.stationSpan="day";
  s.employees.forEach(e=>{ if(!e.hoursMode) e.hoursMode="range";
    if(!e.projectOk) e.projectOk="yes";
    if(typeof e.onCall!=="boolean") e.onCall = false;
    if(typeof e.holidayPay!=="boolean") e.holidayPay = e.type==="FT";
    if(typeof e.holidayPayH!=="number") e.holidayPayH = 8; });
  (s.coverage||[]).forEach(c=>{ if(!c.kind) c.kind="min"; });
  if(!Array.isArray(s.dayDesire) || s.dayDesire.length!==7) s.dayDesire = base.dayDesire.slice();
  if(!Array.isArray(s.dayLoad) || s.dayLoad.length!==7) s.dayLoad = base.dayLoad.slice();
  s.shifts.forEach(x=>{ if(typeof x.desire!=="number") x.desire=0; });
  if(!s.currentWeek) s.currentWeek = weekStartOf(ymd(new Date()), s.org.weekStart);
  return s;
}

/* ============================================================
   Break engine
   ============================================================ */
function law(){ return LAW[S.org.jurisdiction] || LAW.NONE; }
function round5(n){ return Math.round(n/5)*5; }

/* ---- how this business handles the lunch hour ----
   auto   — placed inside the legal window and staggered so the floor stays covered
   slots  — the manager names the meal times and everyone is put on one of them
   closed — the doors shut for a set stretch and everybody eats then
   Only meaningful when meal times are being scheduled at all. */
function mealPlan(){
  return S.rules.breakMode==="assigned" ? (S.rules.mealPlan||"auto") : "auto";
}
function mealSlotList(){
  return (S.rules.mealSlots||[]).map(t2m).filter(x=>x>0).sort((a,b)=>a-b);
}
function lunchClosure(){
  if(mealPlan()!=="closed") return null;
  const c=S.rules.mealClose||{};
  const f=t2m(c.from||"13:00"); let t=t2m(c.to||"14:00");
  if(t<=f) t=f+60;
  return {from:f, to:t};
}
/* The doors are shut — nobody is expected on the floor, so a coverage rule
   doesn't count these minutes against you. */
function shutAt(t){
  const c=lunchClosure(); if(!c) return false;
  const m=((t%1440)+1440)%1440;
  return m>=c.from && m<c.to;
}
/* Where this person's meal wants to start, before any staggering. */
function mealTarget(startMin, endMin, natural, deadline, len){
  const lo=startMin+60, hi=Math.min(deadline, endMin-30-len);
  if(hi<lo) return natural;
  const plan=mealPlan();
  if(plan==="closed"){
    const c=lunchClosure();
    if(c && c.from>=lo && c.from<=hi) return c.from;
    return natural;
  }
  if(plan==="slots"){
    const ok=mealSlotList().filter(x=>x>=lo && x<=hi);
    if(!ok.length) return natural;
    return ok.reduce((best,x)=>Math.abs(x-natural)<Math.abs(best-natural)?x:best, ok[0]);
  }
  return natural;
}

function restsOwed(L, workedMin){
  if(!L.rest) return 0;
  if(workedMin < L.rest.minShiftMin) return 0;
  let n=0;
  for(const [upTo,count] of L.rest.tiers){ if(workedMin<=upTo){ return count; } n=count; }
  return n;
}

/* Lay the paid rest breaks into the working stretches either side of the meals,
   spread evenly and never inside one. Re-run whenever a meal moves. */
function layRests(startMin, endMin, meals, nRest, rlen){
  const out=[];
  if(!(nRest>0)) return out;
  const cuts = meals.filter(m=>!m.waived).slice().sort((a,b)=>a.start-b.start);
  let segs=[], cur=startMin;
  cuts.forEach(m=>{ if(m.start>cur) segs.push([cur,m.start]); cur=Math.max(cur,m.end); });
  if(cur<endMin) segs.push([cur,endMin]);
  segs = segs.filter(s=>s[1]-s[0] >= rlen+10);
  if(!segs.length) segs=[[startMin,endMin]];
  const total = segs.reduce((a,s)=>a+(s[1]-s[0]),0);
  let alloc = segs.map(s=>({seg:s, raw:(s[1]-s[0])/total*nRest}));
  alloc.forEach(a=>a.n=Math.floor(a.raw));
  let left = nRest - alloc.reduce((a,b)=>a+b.n,0);
  alloc.sort((a,b)=>(b.raw-b.n)-(a.raw-a.n));
  for(let i=0;i<left;i++) alloc[i%alloc.length].n++;
  alloc.sort((a,b)=>a.seg[0]-b.seg[0]);
  alloc.forEach(a=>{
    const [s0,s1]=a.seg, len=s1-s0;
    for(let i=0;i<a.n;i++){
      let t = round5(s0 + len*(i+1)/(a.n+1) - rlen/2);
      t = clamp(t, s0, s1-rlen);
      out.push({start:t,len:rlen});
    }
  });
  return out.sort((a,b)=>a.start-b.start);
}
/* Returns {meals:[{start,end,len,waived,deadline,late}], rests:[{start,len}], notes:[], owed:{meals,rests} } */
function computeBreaks(startMin, endMin, opts){
  opts = opts || {};
  const L = law();
  const worked = endMin - startMin;
  const out = { meals:[], rests:[], notes:[], owed:{meals:0,rests:0}, worked, netWorked:worked };
  if(worked<=0) return out;

  const mealMode = S.rules.breakMode;   // assigned | lengths | self
  const restMode = S.rules.restMode;

  /* ---- meals ---- */
  if(L.meal && worked >= L.meal.firstAfterMin){
    out.owed.meals = 1;
    const len = L.meal.lengthMin;
    const deadline = startMin + L.meal.mustStartByMin;
    const waivable = S.rules.allowMealWaiver && L.meal.waivableIfShiftUnderMin && worked <= L.meal.waivableIfShiftUnderMin;
    let target = round5(startMin + Math.floor(worked/2) - len/2);
    if(opts.nudge) target += opts.nudge;
    target = clamp(target, startMin+60, deadline);
    if(target+len > endMin-30) target = Math.max(startMin+60, endMin-30-len);
    target = mealTarget(startMin, endMin, target, deadline, len);
    out.meals.push({start:target,end:target+len,len,waivable,waived:false,deadline,late:target>deadline,idx:1});

    /* A second meal is owed on HOURS WORKED, and the first unpaid meal is not
       hours worked. A 10.5-hour shift with a 30-minute lunch is 10 hours worked,
       which is not "more than ten" — one meal, not two. The deadline moves out by
       the same half hour, because the clock that matters is the working clock. */
    const sec = L.meal.second;
    const off  = out.meals[0].waived? 0 : len;          /* time already off duty */
    const workedForSecond = sec && sec.fromNet===false ? worked : worked - off;
    if(sec && workedForSecond >= sec.afterMin){
      out.owed.meals = 2;
      const dl2 = startMin + sec.mustStartByMin + (sec.fromNet===false? 0 : off);
      const w2 = sec.waivableIfShiftUnderMin && workedForSecond <= sec.waivableIfShiftUnderMin;
      let t2 = round5(startMin + Math.floor(worked*0.72) - len/2);
      t2 = clamp(t2, target+len+90, dl2);
      if(t2+len > endMin-30) t2 = Math.max(target+len+60, endMin-30-len);
      if(mealPlan()==="slots"){
        const ok=mealSlotList().filter(x=>x>=target+len+90 && x<=Math.min(dl2, endMin-30-len));
        if(ok.length) t2 = ok.reduce((b,x)=>Math.abs(x-t2)<Math.abs(b-t2)?x:b, ok[0]);
      }
      out.meals.push({start:t2,end:t2+len,len,waivable:!!w2,waived:false,deadline:dl2,late:t2>dl2,idx:2});
    }
  }

  /* ---- rests ---- */
  /* Rest entitlement runs on HOURS WORKED, so the unpaid meal comes out first. */
  const netWorked = worked - out.meals.filter(m=>!m.waived).reduce((t,m)=>t+m.len,0);
  out.unpaid = worked - netWorked;
  const nRest = restsOwed(L, netWorked);
  out.owed.rests = nRest;
  out.rests = layRests(startMin, endMin, out.meals, nRest, L.rest? L.rest.lengthMin : 10);

  out.netWorked = netWorked;
  if(mealMode==="self") out.notes.push("Meal times coordinated by staff");
  else if(mealMode==="lengths") out.notes.push("Meal length set, timing by staff");
  if(restMode==="self") out.notes.push("Rest breaks coordinated by staff");
  return out;
}

/* How far one coverage rule falls short over a stretch of the day, counted in
   person-quarter-hours. Zero means it holds throughout. */
function ruleShort(day, r, from, to){
  let rs=t2m(r.start), re=t2m(r.end); if(re<=rs) re+=1440;
  if(from!=null) rs=Math.max(rs,from);
  if(to!=null) re=Math.min(re,to);
  const O={ignoreMeals:r.mealsCount===false}, kind=r.kind||"min";
  let bad=0;
  for(let t=rs;t<re;t+=15){
    if(shutAt(t)) continue;
    if(kind==="min"){
      const have=onDutyAt(day,t,r.roleId||null,O);
      if(have < (r.min||0)) bad += (r.min||0)-have;
    } else {
      const sub=onDutyAt(day,t,r.perRoleId,O); if(!sub) continue;
      const have=onDutyAt(day,t,r.roleId,O);
      const need = kind==="ratio"? Math.ceil(sub/Math.max(1,r.ratio||1)) : (r.min||1);
      if(have<need) bad += need-have;
    }
  }
  return bad;
}
function dayShortfall(day, dow){
  return (S.coverage||[]).filter(r=>r.days.includes(dow))
    .reduce((t,r)=>t+ruleShort(day,r),0);
}
/* Spread meals across a day so the floor doesn't empty at noon. Every candidate
   time is measured against your coverage rules first: a meal is never moved to a
   slot that leaves any one rule worse off than it already was, and among the
   times that don't, the one that costs the least coverage wins. Spreading
   lunches must never be the thing that puts you below a minimum. */
function staggerDay(list, all){
  const plan = mealPlan();
  /* When the doors shut for lunch there is nothing to stagger — that's the point of it. */
  if(plan==="closed") return;
  if(plan!=="slots" && !S.rules.staggerMeals) return;
  const withMeals = list.filter(a=>a.breaks && a.breaks.meals.length);
  if(!withMeals.length) return;
  const day = (all && all.length)? all : list;
  const dow = withMeals[0].dow;
  const rules = (S.coverage||[]).filter(r=>r.days.includes(dow));
  const slots = plan==="slots"? mealSlotList() : null;
  withMeals.sort((a,b)=>a.startMin-b.startMin);
  const taken = [];
  withMeals.forEach(a=>{
    let floor = a.startMin+45;                 /* a second meal can't land on the first */
    a.breaks.meals.forEach(m=>{
      const home = m.start;
      const lo = floor;
      const hi = Math.min(m.deadline, a.endMin-30-m.len);
      let cands;
      if(slots){
        cands = slots.filter(t=>t>=lo && t<=hi);        /* only the times you named */
      } else {
        cands=[home];
        for(let k=1;k<=6;k++){ cands.push(home+k*15, home-k*15); }
        cands = cands.filter(t=>t>=lo && t<=hi);
      }
      if(!cands.length) cands=[clamp(home, lo, Math.max(lo,hi))];
      const win=[Math.min.apply(null,cands), Math.max.apply(null,cands)+m.len];
      const base = rules.map(r=>{ m.start=home; m.end=home+m.len; return ruleShort(day,r,win[0],win[1]); });
      let best=null;
      cands.forEach(t=>{
        m.start=t; m.end=t+m.len;
        const v = rules.map(r=>ruleShort(day,r,win[0],win[1]));
        const regress = v.some((x,i)=>x>base[i]) ? 1 : 0;
        const total = v.reduce((x,y)=>x+y,0);
        const spread = taken.length? Math.min.apply(null,taken.map(x=>Math.abs(x-t))) : 999;
        const sc = regress*1e6 + total*1000 - Math.min(spread,60)*(slots?2:5) + Math.abs(t-home)/60;
        if(!best || sc<best.sc) best={t,sc};
      });
      m.start=best.t; m.end=best.t+m.len; m.late = best.t>m.deadline;
      floor = m.end + 90;
      taken.push(best.t);
    });
    /* the rests were laid out around where the meals used to be */
    if(a.breaks.rests.length)
      a.breaks.rests = layRests(a.startMin, a.endMin, a.breaks.meals,
        a.breaks.rests.length, a.breaks.rests[0].len);
  });
}

function applyBreaks(a){
  const b = computeBreaks(a.startMin, a.endMin);
  a.breaks = b;
  return a;
}
/* Redo every meal and rest break everywhere — after a change to the law,
   the meal approach, or the times you named. */
function rebuildBreaks(){
  Object.keys(S.weeks).forEach(ws=>{
    const wk=S.weeks[ws]; if(!wk || !wk.assignments) return;
    wk.assignments.forEach(applyBreaks);
    weekDates(ws).forEach(({date})=>{
      const all=wk.assignments.filter(a=>a.date===date);
      staggerDay(all.filter(a=>!a.locked), all);
    });
  });
}

/* ============================================================
   Week helpers
   ============================================================ */
function weekDates(ws){
  ws = ws || S.currentWeek;
  const out=[];
  for(let i=0;i<7;i++){ const d=addDays(ws,i); out.push({date:d, dow:parseYmd(d).getDay(), idx:i}); }
  return out;
}
function getWeek(ws){
  ws = ws || S.currentWeek;
  if(!S.weeks[ws]) S.weeks[ws] = {assignments:[], published:false, generatedAt:null};
  return S.weeks[ws];
}
/* Look at a week without bringing it into existence — every read path uses this,
   so a deleted week stays deleted and the board doesn't fill up with empty shells. */
const BLANK_WEEK = {assignments:[], published:false, generatedAt:null};
function peekWeek(ws){ return S.weeks[ws||S.currentWeek] || BLANK_WEEK; }
const empById = id => S.employees.find(e=>e.id===id);
const shiftById = id => S.shifts.find(s=>s.id===id);
/* views ask for a shift label via the assignment; seeded holiday work has none */
function aShift(a){ return shiftById(a&&a.shiftId) || {label:(a&&a.holAssign)? "Holiday":"Shift", color:"#8f5d10"}; }
const roleById = id => S.roles.find(r=>r.id===id);
function roleName(id){ const r=roleById(id); return r?r.name:"Any role"; }
function roleAbbr(id){ const r=roleById(id); return r?r.abbr:"Any"; }

function shiftMinutes(sh){
  let a=t2m(sh.start), b=t2m(sh.end);
  if(b<=a) b+=1440;
  return [a,b];
}
function paidMinutes(a){
  const gross = a.endMin-a.startMin;
  const unpaid = (a.breaks?a.breaks.meals:[]).filter(m=>!m.waived).reduce((t,m)=>t+m.len,0);
  return gross-unpaid;
}
function paidEstimate(aMin,bMin){
  const b = computeBreaks(aMin,bMin);
  return (bMin-aMin) - b.meals.reduce((t,m)=>t+m.len,0);
}
function empWeekMinutes(empId, ws){
  return peekWeek(ws).assignments.filter(a=>a.empId===empId).reduce((t,a)=>t+paidMinutes(a),0);
}
function empDays(empId, ws){
  return new Set(peekWeek(ws).assignments.filter(a=>a.empId===empId).map(a=>a.date)).size;
}
function onTimeOff(empId, date){
  return S.timeoff.some(t=>t.empId===empId && t.status!=="denied" && date>=t.start && date<=t.end);
}
function timeOffFor(empId,date){
  return S.timeoff.find(t=>t.empId===empId && t.status!=="denied" && date>=t.start && date<=t.end);
}
/* When someone's day ends. A "to" at or after 23:59 means midnight — the time
   picker can't say 24:00 — and a "to" at or before "from" means it runs overnight. */
function availEnd(av){
  const f=t2m(av.from), t=t2m(av.to);
  if(t<=f) return f<=0? 1440 : t+1440;
  return t>=1439? 1440 : t;
}
function availOk(e, dow, aMin, bMin){
  const av = e.avail && e.avail[dow];
  if(!av || !av.ok) return false;
  const f = t2m(av.from), t = availEnd(av);
  if(aMin < f) return false;
  if(bMin <= t) return true;
  /* A shift that runs past midnight: the tail belongs to the next day, so it
     only works if they're free right up to midnight and free from midnight on. */
  if(t !== 1440) return false;
  const av2 = e.avail && e.avail[(dow+1)%7];
  if(!av2 || !av2.ok || t2m(av2.from) !== 0) return false;
  return bMin <= 1440 + availEnd(av2);
}
/* A week can run a different shape — 4x10 normally, 5x8 over a holiday. */
function patternFor(ws){
  const wk = S.weeks[ws||S.currentWeek];
  const id = wk && wk.patternId;
  if(!id) return null;
  return (S.patterns||[]).find(p=>p.id===id) || null;
}
function demandOf(ws){
  const p = patternFor(ws);
  return p? p.demand : S.demand;
}
function patternName(ws){
  const p = patternFor(ws);
  return p? p.name : "Standard week";
}
/* Line the shifts you asked for up against the ones you've got.
   A slot that names no role is filled by whoever takes it, and the assignment
   then carries that person's own role — so match the named roles first and let
   the "any role" slots mop up what's left, or a filled slot reads as open. */
function matchDemand(slots, list){
  const want = slots.map(s=>({shiftId:s.shiftId, roleId:s.roleId||null, sh:s.sh, used:null}));
  const left = list.slice();
  want.filter(w=>w.roleId).forEach(w=>{
    const i = left.findIndex(a=>a.shiftId===w.shiftId && (a.roleId||null)===w.roleId);
    if(i>=0){ w.used=left[i]; left.splice(i,1); }
  });
  want.filter(w=>!w.roleId).forEach(w=>{
    const i = left.findIndex(a=>a.shiftId===w.shiftId);
    if(i>=0){ w.used=left[i]; left.splice(i,1); }
  });
  return {want, missing:want.filter(w=>!w.used), spare:left};
}
/* The holidays most US businesses reckon with, with their real dates worked out.
   Nothing is assumed observed — the manager says which ones touch their business. */
function nthDow(y, mon, dow, nth){            /* nth=1..4, or -1 for last */
  if(nth>0){ const d=new Date(y,mon,1); const shift=(dow-d.getDay()+7)%7; return new Date(y,mon,1+shift+(nth-1)*7); }
  const last=new Date(y,mon+1,0); const back=(last.getDay()-dow+7)%7; return new Date(y,mon+1,0-back);
}
function easterSunday(y){                     /* anonymous Gregorian algorithm */
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
        g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
        l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mon=Math.floor((h+l-7*m+114)/31)-1, day=((h+l-7*m+114)%31)+1;
  return new Date(y,mon,day);
}
const HOLIDAY_PRESETS=[
  {k:"ny",    n:"New Year's Day",        f:y=>new Date(y,0,1),            common:"closed"},
  {k:"mlk",   n:"Martin Luther King Jr. Day", f:y=>nthDow(y,0,1,3),      common:"normal"},
  {k:"pres",  n:"Presidents' Day",       f:y=>nthDow(y,1,1,3),            common:"normal"},
  {k:"easter",n:"Easter Sunday",         f:y=>easterSunday(y),            common:"closed"},
  {k:"mem",   n:"Memorial Day",          f:y=>nthDow(y,4,1,-1),           common:"reduced"},
  {k:"june",  n:"Juneteenth",            f:y=>new Date(y,5,19),           common:"normal"},
  {k:"jul4",  n:"Independence Day",      f:y=>new Date(y,6,4),            common:"closed"},
  {k:"labor", n:"Labor Day",             f:y=>nthDow(y,8,1,1),            common:"reduced"},
  {k:"vets",  n:"Veterans Day",          f:y=>new Date(y,10,11),          common:"normal"},
  {k:"thxeve",n:"Thanksgiving Eve",      f:y=>addDaysD(nthDow(y,10,4,4),-1), common:"normal"},
  {k:"thx",   n:"Thanksgiving",          f:y=>nthDow(y,10,4,4),           common:"closed"},
  {k:"bfri",  n:"Day after Thanksgiving",f:y=>addDaysD(nthDow(y,10,4,4),1),  common:"normal"},
  {k:"xeve",  n:"Christmas Eve",         f:y=>new Date(y,11,24),          common:"reduced"},
  {k:"xmas",  n:"Christmas Day",         f:y=>new Date(y,11,25),          common:"closed"},
  {k:"nye",   n:"New Year's Eve",        f:y=>new Date(y,11,31),          common:"reduced"}
];
function addDaysD(d,k){ const x=new Date(d.getTime()); x.setDate(x.getDate()+k); return x; }
/* Each preset's next occurrence from today, so the list a manager sees is always live */
function holidayCandidates(){
  const today=ymd(new Date()), y=new Date().getFullYear();
  return HOLIDAY_PRESETS.map(h=>{
    let d=ymd(h.f(y)); if(d<today) d=ymd(h.f(y+1));
    return {key:h.k, name:h.n, date:d, common:h.common};
  }).sort((a,b)=>a.date.localeCompare(b.date));
}
/* How a given holiday is run: its own answer wins, then the global setting. */
function holMode(h){
  if(h && h.hmode) return h.hmode;
  const g=S.holidays.mode||"same";
  return g==="closed"? "closed" : g==="custom"? "reduced" : "normal";
}
const HMODE_LABEL={closed:"Closed", reduced:"Fewer people", normal:"Normal hours"};
/* A holiday whose staffing the poll has already decided */
function holPolled(h){
  return !!(h && S.holidays.result && (S.holidays.result.result||[]).some(r=>r.holidayId===h.id));
}
/* Fraction of the week's open days this person is actually around for —
   someone on vacation half the week owes half the guaranteed hours. */
function minHFactor(empId, ws){
  const ds=weekDates(ws).filter(d=>!S.hours[d.dow].closed);
  if(!ds.length) return 1;
  const here=ds.filter(d=>!onTimeOff(empId,d.date)).length;
  return here/ds.length;
}
function holOn(dow, ws){
  const wd = weekDates(ws).find(x=>x.dow===dow);
  return wd? ((S.holidays.list||[]).find(h=>h.date===wd.date)||null) : null;
}
function expandDemand(dow, ws){
  let rows = (demandOf(ws)[dow])||[];
  const hol = holOn(dow, ws);
  if(hol){
    if(holPolled(hol)) return [];               /* the poll's assignments staff this day */
    const m=holMode(hol);
    if(m==="closed") return [];                 /* shut — nothing is drafted */
    if(m==="reduced") rows = S.holidays.demand||[];   /* the lighter holiday pattern */
    /* "normal" falls through to the weekday's own pattern */
  }
  const slots=[];
  rows.forEach(r=>{
    const sh = shiftById(r.shiftId); if(!sh) return;
    for(let i=0;i<(r.count||1);i++) slots.push({shiftId:r.shiftId, roleId:r.roleId||null, sh});
  });
  return slots;
}


/* ============================================================
   Requests — the pile of emails, turned into constraints
   ============================================================ */
const REQ_KINDS=[
  {k:"off",    t:"Day off",              hint:"Don't schedule them at all",              dates:1, hard:true},
  {k:"avoid",  t:"Rather not work",      hint:"Only if there's no other way",            dates:1, hard:false},
  {k:"want",   t:"Wants to work",        hint:"Give them the day if it fits",            dates:1, hard:false},
  {k:"shift",  t:"Wants this shift",     hint:"A named shift on those days",             dates:1, hard:false, shift:true},
  {k:"noshift",t:"Not this shift",       hint:"Keep them off a named shift",             dates:1, hard:false, shift:true},
  {k:"late",   t:"Can't start before",   hint:"Class, school run, second job",           dates:1, hard:true,  time:true},
  {k:"early",  t:"Must leave by",        hint:"Has to be out the door at a set time",    dates:1, hard:true,  time:true},
  {k:"maxh",   t:"Cap their hours",      hint:"Fewer hours than usual this stretch",     dates:0, hard:true,  num:true},
  {k:"note",   t:"Just a note",          hint:"Something to remember, no rule attached", dates:1, hard:false}
];
const reqKind = k => REQ_KINDS.find(x=>x.k===k)||REQ_KINDS[0];

function reqActive(period){
  return (S.requests||[]).filter(r=>{
    if(r.status==="declined") return false;
    if(r.kind==="maxh") return true;
    if(!period) return true;
    if(r.every && r.every.length) return r.from<=period.to && (!r.to || r.to==="2099-01-01" || r.to>=period.from);
    return !(r.to < period.from || r.from > period.to);
  });
}
function reqsFor(empId, date){
  return (S.requests||[]).filter(r=>{
    if(r.empId!==empId || r.status==="declined") return false;
    if(r.kind==="maxh") return true;
    if(r.every && r.every.length){
      if(!r.every.includes(parseYmd(date).getDay())) return false;
      return date>=r.from && (!r.to || r.to==="2099-01-01" || date<=r.to);
    }
    return date>=r.from && date<=r.to;
  });
}
function reqRepeatText(r){
  if(!r.every || !r.every.length) return null;
  const d=r.every.slice().sort();
  if(d.length===7) return "every day";
  if(d.join()==="1,2,3,4,5") return "every weekday";
  if(d.join()==="0,6") return "every weekend";
  return "every "+d.map(i=>DAYS[i]).join(" and ");
}
function reqPeriod(ws, weeks){
  return {from:ws, to:addDays(ws,(weeks||1)*7-1)};
}

/* Hard requests narrow what the scheduler may do. */
function reqBlocks(e, date, aMin, bMin, weekMins){
  for(const r of reqsFor(e.id,date)){
    if(!r.hard) continue;
    if(r.kind==="off") return "asked for "+prettyDate(date)+" off";
    if(r.kind==="late" && aMin < t2m(r.time)) return "can't start before "+m2disp(t2m(r.time))+" that day";
    if(r.kind==="early" && bMin > t2m(r.time)) return "has to be gone by "+m2disp(t2m(r.time))+" that day";
    if(r.kind==="maxh" && r.num && (weekMins||0)+paidEstimate(aMin,bMin) > r.num*60+1)
      return "asked to stay under "+r.num+"h";
  }
  return null;
}
/* Soft requests just lean on the score. */
function reqScore(e, shiftId, date){
  let sc=0;
  reqsFor(e.id,date).forEach(r=>{
    if(r.hard) return;
    if(r.kind==="avoid") sc -= 45;
    else if(r.kind==="want") sc += 40;
    else if(r.kind==="shift") sc += (r.shiftId===shiftId? 42 : -12);
    else if(r.kind==="noshift" && r.shiftId===shiftId) sc -= 42;
  });
  return sc;
}

/* Did we manage it? Answered after a draft, in the manager's words. */
function reqOutcome(r, ws, weeks){
  const period=reqPeriod(ws,weeks||1);
  const all=[];
  for(let i=0;i<(weeks||1);i++) all.push.apply(all, peekWeek(addDays(ws,i*7)).assignments);
  const mine=all.filter(a=>a.empId===r.empId);
  const inRange=a=> r.kind==="maxh"? true
    : (r.every && r.every.length)
      ? (r.every.includes(a.dow) && a.date>=r.from && (!r.to||r.to==="2099-01-01"||a.date<=r.to))
      : (a.date>=r.from && a.date<=r.to);
  const hit=mine.filter(inRange);
  const name=(empById(r.empId)||{name:"They"}).name.split(" ")[0];
  switch(r.kind){
    case "off":   return hit.length? {ok:false, say:name+" is still on "+hit.map(a=>DSHORT[a.dow]).join(", ")}
                                   : {ok:true,  say:"Kept clear"};
    case "avoid": return hit.length? {ok:false, say:"Couldn't avoid it — "+hit.map(a=>DSHORT[a.dow]).join(", ")+"; nobody else could cover"}
                                   : {ok:true,  say:"Avoided"};
    case "want":  return hit.length? {ok:true,  say:"Working "+hit.map(a=>DSHORT[a.dow]).join(", ")}
                                   : {ok:false, say:"No shift there fit their hours or role"};
    case "shift": { const m=hit.filter(a=>a.shiftId===r.shiftId);
      return m.length? {ok:true, say:m.length+" of "+(hit.length||m.length)+" days on "+(shiftById(r.shiftId)||{label:"it"}).label}
                     : {ok:false, say:hit.length? "Got "+hit.map(a=>(shiftById(a.shiftId)||{label:"?"}).label).join(", ")+" instead" : "Not scheduled in that window"}; }
    case "noshift": { const m=hit.filter(a=>a.shiftId===r.shiftId);
      return m.length? {ok:false, say:"Still on it "+m.map(a=>DSHORT[a.dow]).join(", ")} : {ok:true, say:"Kept off it"}; }
    case "late":  { const bad=hit.filter(a=>a.startMin < t2m(r.time));
      return bad.length? {ok:false, say:"Starts at "+m2disp(bad[0].startMin)+" on "+DSHORT[bad[0].dow]} : {ok:true, say:"Nothing starts too early"}; }
    case "early": { const bad=hit.filter(a=>a.endMin > t2m(r.time));
      return bad.length? {ok:false, say:"Runs to "+m2disp(bad[0].endMin)+" on "+DSHORT[bad[0].dow]} : {ok:true, say:"Out in time every day"}; }
    case "maxh":  { const mins=hit.reduce((t,a)=>t+paidMinutes(a),0);
      return mins <= r.num*60+1? {ok:true, say:fmtHrs(mins)+" of "+r.num+"h"} : {ok:false, say:fmtHrs(mins)+", over the "+r.num+"h they asked for"}; }
    default: return {ok:null, say:"Noted"};
  }
}

/* ============================================================
   Scheduler
   ============================================================ */
/* A nudge that makes a redraft come out differently without bending a single rule.
   Same inputs, same seed, same schedule — change the seed and the ties fall the other way. */
let SHUFFLE = 0;
function jitter(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ((h>>>0)%1400)/100 - 7;      /* -7 .. +7 */
}
/* Shifts the manager has said no to — "not this person, not here" — kept on the week
   so every later redraft still honours them. */
function vetoed(empId, date, shiftId){
  const wk = S.weeks[weekStartOf(date, S.org.weekStart)];
  if(!wk || !wk.vetoes || !wk.vetoes.length) return false;
  return wk.vetoes.some(v=>v.empId===empId && v.date===date && (!v.shiftId || v.shiftId===shiftId));
}
function generateSchedule(ws, opts){
  opts = opts||{};
  ws = ws || S.currentWeek;
  const wk = getWeek(ws);
  SHUFFLE = wk.seed||0;
  const kept = wk.assignments.filter(a=>a.locked);
  const assignments = kept.slice();
  const dates = weekDates(ws);
  const unfilled = [];

  /* Holidays the poll has staffed: put those people on, at the holiday's hours,
     locked — the manager already settled who works them. */
  dates.forEach(d=>{
    const h=(S.holidays.list||[]).find(x=>x.date===d.date);
    if(!h || !holPolled(h)) return;
    (S.holidays.result.result||[]).filter(r=>r.holidayId===h.id).forEach(rrow=>{
      const e=empById(rrow.empId); if(!e||!e.active) return;
      if(onTimeOff(e.id, d.date)) return;                       /* away — leave the gap visible */
      if(assignments.some(a=>a.empId===e.id && a.date===d.date)) return;   /* already on (kept) */
      let aMin=null,bMin=null;
      const m=/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/.exec((h.hours||"").trim());
      if(m){ aMin=(+m[1])*60+(+m[2]); bMin=(+m[3])*60+(+m[4]); }
      else { const hr=S.hours[d.dow]; if(hr && !hr.closed){ aMin=t2m(hr.open); bMin=t2m(hr.close); } else { aMin=600; bMin=840; } }
      if(bMin<=aMin) bMin=aMin+240;
      const match=S.shifts.find(sh=>{ const [x,y]=shiftMinutes(sh); return x===aMin&&y===bMin; });
      const a={id:uid("a"), empId:e.id, date:d.date, dow:d.dow, shiftId:match? match.id:null,
        startMin:aMin, endMin:bMin, roleId:rrow.roleId||e.roleIds[0]||null, locked:true, holAssign:h.id};
      applyBreaks(a);
      assignments.push(a);
    });
  });

  const target = {};
  S.employees.forEach(e=>{ const L=effLimits(e, ws);
    const base = L.exactH? L.exactH*60 : (((L.minH||0)+(L.maxH||0))/2*60 || (L.maxH||0)*60);
    target[e.id] = Math.round(base * minHFactor(e.id, ws)); });

  priorityRefresh();
  const state = {};
  S.employees.forEach(e=>{ state[e.id] = {min:0, days:new Set(), byDate:{}, lastEnd:{}, weekend:0}; });
  assignments.forEach(a=>{
    const st=state[a.empId]; if(!st) return;
    st.min += paidMinutes(a); st.days.add(a.date); (st.byDate[a.date]=st.byDate[a.date]||[]).push(a);
    if(a.dow===0||a.dow===6) st.weekend++;
  });
  /* the tail of the previous week, so rest and days-in-a-row carry across the boundary */
  const prevWk = S.weeks[addDays(ws,-7)];
  if(prevWk) prevWk.assignments.forEach(a=>{
    const st=state[a.empId]; if(!st) return;
    (st.byDate[a.date]=st.byDate[a.date]||[]).push(a);   /* dates only — hours reset each week */
  });

  dates.forEach(({date,dow})=>{
    let slots = expandDemand(dow, ws);
    /* remove slots already covered by locked assignments */
    const held = matchDemand(slots, kept.filter(a=>a.date===date));
    slots = held.missing.map(w=>({shiftId:w.shiftId, roleId:w.roleId, sh:w.sh}));
    /* hardest-to-fill first */
    const supervising = new Set((S.coverage||[]).filter(r=>r.kind&&r.kind!=="min").map(r=>r.roleId));
    slots.forEach(s=>{ s._pool = S.employees.filter(e=>hardOk(e,s,date,dow,state,assignments)).length;
                       s._des = desireOf(s.shiftId,dow);
                       s._sup = supervising.has(s.roleId)?0:1; });
    slots.sort((a,b)=> a._sup-b._sup || a._pool-b._pool || b._des-a._des);

    /* If the same person is the only candidate for more than one slot, let them take the
       one they actually score best on rather than whichever came first in the list. */
    (function resolveSingletons(){
      const only={};
      slots.forEach(slot=>{
        const c=S.employees.filter(e=>hardOk(e,slot,date,dow,state,assignments));
        if(c.length===1){ (only[c[0].id]=only[c[0].id]||[]).push({slot,emp:c[0]}); }
      });
      Object.keys(only).forEach(id=>{
        const set=only[id]; if(set.length<2) return;
        set.forEach(x=>{ x.sc = score(x.emp, x.slot, date, dow, state, target); });
        set.sort((a,b)=>b.sc-a.sc);
        set.slice(1).forEach(x=>{ x.slot._deferred = (empById(id)||{name:"They"}).name.split(" ")[0]+
          " is the only person free, and is on "+(shiftById(set[0].slot.shiftId)||{label:"another shift"}).label; });
        const first=set[0].slot;
        slots.splice(slots.indexOf(first),1); slots.unshift(first);
      });
    })();

    slots.forEach(slot=>{
      const [aMin,bMin] = shiftMinutes(slot.sh);
      const cands = S.employees.filter(e=>hardOk(e,slot,date,dow,state,assignments));
      if(!cands.length){
        const sameDay = assignments;
        const probe = S.employees.find(e=>e.active && (!slot.roleId||e.roleIds.includes(slot.roleId)) && availOk(e,dow,aMin,bMin) && !onTimeOff(e.id,date) && !(state[e.id].byDate[date]||[]).length);
        if(probe) slot._breach = breachReason(probe, slot.roleId||probe.roleIds[0], date, dow, sameDay, aMin, bMin);
        unfilled.push({date,dow,shiftId:slot.shiftId,roleId:slot.roleId,reason:reasonNoOne(slot,date,dow,state)}); return; }
      let best=null,bestScore=-1e9;
      cands.forEach(e=>{
        const sc = score(e,slot,date,dow,state,target);
        if(sc>bestScore){ bestScore=sc; best=e; }
      });
      const a = {
        id:uid("a"), empId:best.id, date, dow, shiftId:slot.shiftId,
        startMin:aMin, endMin:bMin, roleId:slot.roleId||best.roleIds[0]||null, locked:false
      };
      applyBreaks(a);
      assignments.push(a);
      const st=state[best.id];
      st.min += paidMinutes(a); st.days.add(date); (st.byDate[date]=st.byDate[date]||[]).push(a);
      st.lastEnd[date]=bMin; if(dow===0||dow===6) st.weekend++;
    });
  });

  /* If the numbers you gave are a floor rather than a target, keep going until
     everyone who is owed hours has them. */
  const short = S.rules.fillMode==="full"
    ? topUpPass(ws, assignments, state, dates)
    : [];

  /* stagger meals within each day */
  dates.forEach(({date})=>{
    staggerDay(assignments.filter(a=>a.date===date && !a.locked), assignments.filter(a=>a.date===date));
  });
  wk.short = short;

  wk.assignments = assignments.sort((x,y)=> x.date.localeCompare(y.date) || x.startMin-y.startMin);
  wk.generatedAt = Date.now();
  wk.unfilled = unfilled;
  /* per diem on auto: when nobody regular can cover, call in the on-call bench without asking */
  if(S.rules.perDiem==="auto" && unfilled.length && S.employees.some(e=>e.active && e.onCall)){
    const still=[];
    unfilled.forEach(u=>{
      const opt=optionsFor({shiftId:u.shiftId, roleId:u.roleId, date:u.date, dow:u.dow}, ws)
        .find(o=>o.kind==="percall");
      if(opt){
        opt.apply();
        const a=wk.assignments.find(x=>x.empId===opt.emp.id && x.date===u.date && x.shiftId===u.shiftId);
        if(a) a.perDiemAuto=true;
      } else still.push(u);
    });
    wk.perDiemUsed=(unfilled.length-still.length)||0;
    wk.unfilled = still;
  } else wk.perDiemUsed=0;
  if((S.stations||[]).length){ const T=seedTally(ws);
    dates.forEach(({date})=>{ clearAdmin(date,ws); assignStations(date,ws,T); }); }
  return {filled:assignments.length-kept.length, unfilled:wk.unfilled, perDiem:wk.perDiemUsed||0};
}

/* Lay shifts of a given length across an open window, overlapping only as much as needed. */
function shiftsForWindow(openT, closeT, lengthH){
  const o=t2m(openT); let c=t2m(closeT); if(c<=o) c+=1440;
  const span=c-o, len=Math.round(lengthH*60);
  if(len>=span) return [{start:m2t(o), end:m2t(o+Math.min(len,span))}];
  const k=Math.ceil(span/len);
  const out=[];
  for(let i=0;i<k;i++){
    const st = Math.round((o + (span-len)*(k===1?0:i/(k-1)))/15)*15;
    out.push({start:m2t(st), end:m2t(st+len)});
  }
  return out;
}
function patternShiftName(i,k){
  if(k===1) return "Day";
  if(k===2) return i===0? "Opening":"Closing";
  if(k===3) return ["Opening","Mid","Closing"][i];
  return ["Opening","Early mid","Mid","Late mid","Closing"][Math.min(i,4)] + (i>4? " "+(i+1):"");
}

/* Draft several weeks in a row, each aware of the one before it. */
function generateRange(fromWs, nWeeks){
  let filled=0, unfilled=0, built=[];
  for(let i=0;i<nWeeks;i++){
    const ws=addDays(fromWs, i*7);
    const wk=getWeek(ws);
    if(wk.published) continue;              /* never rewrite a posted week */
    const r=generateSchedule(ws);
    wk.suggested=true; wk.touched=true; wk.auto=false;
    filled+=r.filled; unfilled+=r.unfilled.length; built.push(ws);
  }
  return {filled, unfilled, built};
}
