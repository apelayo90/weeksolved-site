/* Give people the rest of their contracted hours out of the shifts you've defined.
   Never invents a shift, never breaks a limit — it just keeps offering until it can't. */
/* Who may be given project time, and in what order.
   "first" — the leads who take project work before anyone else
   "yes"   — in the rotation like everyone else
   "no"    — keep them on the floor; never top them up with project work */
function projectOk(e){ return e.projectOk || "yes"; }
function projectRank(e){ const v=projectOk(e); return v==="first"?0 : v==="no"?2 : 1; }
function projectLabel(){ return S.rules.topUpLabel || "Project time"; }
/* Does any of this even apply? Only in floor mode, and only if someone has been
   singled out — otherwise the whole idea stays out of the way. */
function projectRulesOn(){
  return S.rules.fillMode==="full" && S.employees.some(e=>projectOk(e)!=="yes");
}

function topUpPass(ws, assignments, state, dates){
  const chunk = (S.rules.projectShape||"chunk")==="chunk";
  const minBlock = chunk? (S.rules.projectMinH||0)*60 : 0;
  const stack = (S.rules.projectShare||"fair")==="best";
  const pool=S.employees.filter(e=>{
    if(!e.active || e.onCall) return false;
    if(projectOk(e)==="no") return false;         /* kept on the floor by choice */
    const L=effLimits(e, ws);
    return (L.exactH || L.minH) > 0;
  });
  const exhausted=new Set();
  const deficit=e=>{ const L=effLimits(e, ws); return Math.round((L.exactH||L.minH)*60*minHFactor(e.id,ws)) - state[e.id].min; };
  const soFar=e=>assignments.filter(a=>a.empId===e.id && a.topUp).length;
  let guard=0;

  while(guard++ < 400){
    const need=pool.filter(e=>!exhausted.has(e.id) && deficit(e) > 30)
      .sort((a,b)=>
        projectRank(a)-projectRank(b) ||                       /* leads first */
        (stack ? soFar(b)-soFar(a) : soFar(a)-soFar(b)) ||     /* pile it on, or share it round */
        deficit(b)-deficit(a));
    if(!need.length) break;
    const e=need[0];
    const want=deficit(e);
    const mine=assignments.filter(a=>a.empId===e.id && a.topUp).map(a=>a.date);
    const nextTo=d=>mine.some(x=>x===addDays(d,-1)||x===addDays(d,1))?0:1;

    /* Chunked project time wants to sit next to the block they already have.
       Otherwise: busiest days first, then whichever day is thinnest. */
    const days=dates.slice().sort((x,y)=>
      (chunk? nextTo(x.date)-nextTo(y.date) : 0) ||
      dateLoad(y.date,y.dow)-dateLoad(x.date,x.dow) ||
      assignments.filter(a=>a.date===x.date).length - assignments.filter(a=>a.date===y.date).length);

    /* Chunked: the longest shift they can take, so it's a half or whole day rather
       than an hour here and an hour there. Scattered: whatever fits what's left. */
    const roleId=e.roleIds[0]||null;
    const shifts=S.shifts.slice().sort((x,y)=>{
      const [ax,bx]=shiftMinutes(x), [ay,by]=shiftMinutes(y);
      const lx=bx-ax, ly=by-ay;
      const px=(e.prefShiftIds.includes(x.id)?-1:0)+(e.avoidShiftIds.includes(x.id)?1:0);
      const py=(e.prefShiftIds.includes(y.id)?-1:0)+(e.avoidShiftIds.includes(y.id)?1:0);
      if(px!==py) return px-py;
      const base = (chunk || S.rules.preferLong)? ly-lx : Math.abs(lx-want)-Math.abs(ly-want);
      return base + (SHUFFLE? jitter(e.id+x.id+SHUFFLE)-jitter(e.id+y.id+SHUFFLE) : 0);
    });

    /* first pass insists on a block worth having; second takes anything that fits */
    let placed=false;
    for(const floorMin of (minBlock? [minBlock, 0] : [0])){
      outer:
      for(const d of days){
        if(S.hours[d.dow].closed) continue;
        for(const sh of shifts){
          const [aMin,bMin]=shiftMinutes(sh);
          if(floorMin && (bMin-aMin) < floorMin) continue;
          const slot={shiftId:sh.id, roleId, sh};
          if(!hardOk(e, slot, d.date, d.dow, state, assignments)) continue;
          const a={id:uid("a"), empId:e.id, date:d.date, dow:d.dow, shiftId:sh.id,
            startMin:aMin, endMin:bMin, roleId, locked:false, topUp:true};
          applyBreaks(a);
          assignments.push(a);
          const st=state[e.id];
          st.min += paidMinutes(a); st.days.add(d.date);
          (st.byDate[d.date]=st.byDate[d.date]||[]).push(a);
          if(d.dow===0||d.dow===6) st.weekend++;
          placed=true; break outer;
        }
      }
      if(placed) break;
    }
    if(!placed) exhausted.add(e.id);
  }

  /* who is still short, and precisely what stopped each one */
  const short = pool.filter(e=>deficit(e) > 30).map(e=>({
    empId:e.id, deficit:deficit(e), owed:(effLimits(e,ws).exactH||effLimits(e,ws).minH),
    have:state[e.id].min, why:whyNotPlaced(e, ws, state, assignments, dates)
  }));
  /* the people deliberately kept off project work, said plainly rather than silently */
  S.employees.filter(e=>e.active && !e.onCall && projectOk(e)==="no").forEach(e=>{
    const L=effLimits(e, ws);
    if(Math.round((L.exactH||L.minH)*60*minHFactor(e.id,ws)) - state[e.id].min > 30)
      short.push({empId:e.id, deficit:Math.round((L.exactH||L.minH)*60*minHFactor(e.id,ws))-state[e.id].min,
        owed:(L.exactH||L.minH), have:state[e.id].min, held:true,
        why:"they're set to stay on the floor rather than take "+projectLabel().toLowerCase()});
  });
  return short;
}

/* Walk every day and every shift they could have taken, and name the wall they hit most. */
function whyNotPlaced(e, ws, state, assignments, dates){
  const L=effLimits(e, ws);
  const tally={};
  const note=(k)=>{ tally[k]=(tally[k]||0)+1; };
  const roleId=e.roleIds[0]||null;
  dates.forEach(d=>{
    if(S.hours[d.dow].closed) return;
    if((state[e.id].byDate[d.date]||[]).length){ note("they're already on that day"); return; }
    if(onTimeOff(e.id,d.date)){ const t=timeOffFor(e.id,d.date);
      note("they're on "+((t&&t.type)||"time off")); return; }
    if(e.licExp && d.date>e.licExp && empLicensed(e)){
      note("their "+(e.licLabel||"license")+" expired "+prettyDate(e.licExp)); return; }
    if(cyclesOn() && !cycleWorksOn(e,d.date)){ note("their work pattern has them off"); return; }
    if(L.maxD && state[e.id].days.size>=L.maxD && !state[e.id].days.has(d.date)){
      note("they're already on "+state[e.id].days.size+" days, their limit"); return; }
    S.shifts.forEach(sh=>{
      const [aMin,bMin]=shiftMinutes(sh);
      if(!availOk(e,d.dow,aMin,bMin)){ note("that shift falls outside the hours they can work"); return; }
      if(L.maxShiftH && (bMin-aMin) > L.maxShiftH*60){ note("every remaining shift is longer than they may work"); return; }
      if(L.maxH && state[e.id].min + paidEstimate(aMin,bMin) > L.maxH*60+1){
        note("another shift would take them past their "+L.maxH+"h cap"); return; }
      if(reqBlocks(e,d.date,aMin,bMin,state[e.id].min)){ note("a request of theirs rules those days out"); return; }
      const prev=(state[e.id].byDate[addDays(d.date,-1)]||[]);
      if(prev.length){
        const gap=(aMin+1440)-Math.max.apply(null,prev.map(x=>x.endMin));
        if(gap < (L.minRestH||0)*60){ note("it would leave too short a turnaround"); return; }
      }
      const nxt=(state[e.id].byDate[addDays(d.date,1)]||[]);
      if(nxt.length){
        const gap=(Math.min.apply(null,nxt.map(x=>x.startMin))+1440)-bMin;
        if(gap < (L.minRestH||0)*60){ note("it would leave too short a turnaround"); return; }
      }
      {
        let run=1, n=0, k=addDays(d.date,-1);
        while(state[e.id].byDate[k] && state[e.id].byDate[k].length && n++<20){ run++; k=addDays(k,-1); }
        k=addDays(d.date,1); n=0;
        while(state[e.id].byDate[k] && state[e.id].byDate[k].length && n++<20){ run++; k=addDays(k,1); }
        if(L.maxConsecDays && run > L.maxConsecDays){ note("it would put them on "+run+" days in a row, past their limit"); return; }
      }
      const br=breachReason(e, roleId, d.date, d.dow, assignments, aMin, bMin);
      if(br){
        const rule=(S.coverage||[]).find(r=>r.kind==="ratio" || r.kind==="pair");
        note(rule && /ratio|leave/.test(br)
          ? "putting another "+roleName(roleId).toLowerCase()+" on would break your "+esc(rule.label||ruleSentence(rule))
          : "a coverage rule keeps them off");
        return;
      }
      note("nothing left in the pool fits");
    });
  });
  const best=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
  return best || "nothing left in your shift pool fits without breaking a limit";
}

function hardOk(e, slot, date, dow, state, assignments){
  if(!e.active) return false;
  if(e.onCall && !slot._allowOnCall) return false;   /* only called in when you ask for them */
  if(slot.roleId && !e.roleIds.includes(slot.roleId)) return false;
  if(!slot.roleId && !e.roleIds.length) return false;
  const [aMin,bMin] = shiftMinutes(slot.sh);
  if(!availOk(e,dow,aMin,bMin)) return false;
  if(onTimeOff(e.id,date)) return false;
  if(e.licExp && date>e.licExp && empLicensed(e)) return false;   /* license lapsed */
  if(!cycleWorksOn(e,date)) return false;             /* off-cycle days aren't theirs to work */
  const st = state[e.id], lim = effLimits(e, date);
  if(st.byDate[date] && st.byDate[date].length) return false;            // already working that day
  if(st.days.size >= (lim.maxD||7) && !st.days.has(date)) return false;  // max days per week
  const add = paidEstimate(aMin,bMin);
  if(lim.maxH && (st.min + add) > lim.maxH*60 + 1) return false;         // max hours (paid, meals excluded)
  if(lim.maxShiftH && (bMin-aMin) > lim.maxShiftH*60) return false;
  /* Turnaround on BOTH sides. Days don't always get filled front to back — the
     top-up pass works busiest-day-first — so the day after this one may already
     be spoken for, and a rule that only looks backwards would miss it. */
  const prevA = (st.byDate[addDays(date,-1)]||[]);
  if(prevA.length){
    const prevEnd = Math.max.apply(null, prevA.map(x=>x.endMin));
    const gap = (aMin+1440) - prevEnd;
    if(gap < (lim.minRestH||0)*60) return false;
    if(S.rules.noClopen && gap < 12*60 && prevEnd >= 19*60 && aMin <= 9*60) return false;
  }
  const nextA = (st.byDate[addDays(date,1)]||[]);
  if(nextA.length){
    const nextStart = Math.min.apply(null, nextA.map(x=>x.startMin));
    const gap = (nextStart+1440) - bMin;
    if(gap < (lim.minRestH||0)*60) return false;
    if(S.rules.noClopen && gap < 12*60 && bMin >= 19*60 && nextStart <= 9*60) return false;
  }
  /* days in a row, counted through this one in both directions */
  if(lim.maxConsecDays){
    let run=1, n=0, d=addDays(date,-1);
    while(st.byDate[d] && st.byDate[d].length && n++<20){ run++; d=addDays(d,-1); }
    d=addDays(date,1); n=0;
    while(st.byDate[d] && st.byDate[d].length && n++<20){ run++; d=addDays(d,1); }
    if(run > lim.maxConsecDays) return false;
  }
  /* requests the manager marked as must-do */
  if((S.requests||[]).length && reqBlocks(e, date, aMin, bMin, st.min)) return false;
  /* and anything the manager rejected on a previous draft */
  if(vetoed(e.id, date, slot.shiftId)) return false;
  /* ratio, pairing and never-alone rules */
  if(assignments && (S.coverage||[]).some(r=>r.kind&&r.kind!=="min") || lim.canBeAlone===false){
    if(breachReason(e, slot.roleId||e.roleIds[0], date, dow, assignments||[], aMin, bMin)) return false;
  }
  return true;
}

function reasonNoOne(slot,date,dow,state){
  const on = S.employees.filter(e=>e.active);
  if(!on.length) return S.employees.length
    ? "everyone on your team is marked inactive"
    : "there's nobody on the team yet — add people under Team";
  const need = slot.roleId ? on.filter(e=>e.roleIds.includes(slot.roleId)) : on;
  if(!need.length) return "nobody on the team is qualified for "+roleName(slot.roleId);
  const callable = need.filter(e=>!e.onCall);
  if(!callable.length) return roleName(slot.roleId)+" is only covered by people you keep on call — use “Show who could cover it” to call one in";
  const [aMin,bMin]=shiftMinutes(slot.sh);
  const avail = need.filter(e=>availOk(e,dow,aMin,bMin));
  if(!avail.length) return "nobody qualified is available "+DSHORT[dow]+" at that time";
  const free = avail.filter(e=>!onTimeOff(e.id,date) && !(state[e.id].byDate[date]||[]).length);
  if(!free.length) return "everyone qualified is already scheduled or off that day";
  if(free.length){
    const [aM,bM]=shiftMinutes(slot.sh);
    const why=free.map(e=>reqBlocks(e,date,aM,bM,state[e.id].min)).filter(Boolean);
    if(why.length===free.length) return "everyone who could take it "+(why.length===1? why[0] : "asked not to be scheduled then");
    const tooLong=free.filter(e=>{ const L=effLimits(e,date); return L.maxShiftH && (bM-aM) > L.maxShiftH*60; });
    if(tooLong.length===free.length){
      const L=effLimits(tooLong[0],date);
      return "this shift is "+fmtHrs(bM-aM)+", longer than the "+L.maxShiftH+"h cap on "+(L.groups[0]||"their group");
    }
  }
  if(slot._deferred) return slot._deferred;
  if(slot._breach) return slot._breach;
  return "hour, rest, or consecutive-day limits blocked every candidate";
}

function score(e, slot, date, dow, state, target){
  const st=state[e.id];
  const [aMin,bMin]=shiftMinutes(slot.sh);
  let sc = 100;
  if(S.rules.honorPrefs){
    if(e.prefShiftIds.includes(slot.shiftId)) sc += 34;
    if(e.avoidShiftIds.includes(slot.shiftId)) sc -= 30;
    if((e.prefDaysOff||[]).includes(dow)) sc -= 26;
  }
  const lim = effLimits(e, date);
  const after = st.min + paidEstimate(aMin,bMin);
  if(lim.exactH){
    const goal = lim.exactH*60;
    const before = Math.abs(goal - st.min), now = Math.abs(goal - after);
    sc += (before - now)/60 * 55;                 /* every hour closer to the contract counts */
    if(after > goal + 1) sc -= 200;               /* going over is worse than leaving it open */
  } else {
    const t = target[e.id]||0;
    if(lim.minH && st.min < lim.minH*60) sc += 40 * (1 - st.min/Math.max(1,lim.minH*60));
    if(t) sc += 22 * (1 - clamp(after/Math.max(1,t),0,2));
  }
  if(S.rules.fairness){
    const share = lim.maxH? st.min/(lim.maxH*60) : 0;
    sc -= share*30;
    if(dow===0||dow===6) sc -= st.weekend*9;
  }
  if(e.roleIds[0]===slot.roleId) sc += 8;
  if(e.type==="FT") sc += 6; else if(e.type==="PRN") sc -= 5;
  sc += priorityBonus(e.id, slot.shiftId, dow);
  sc += reqScore(e, slot.shiftId, date);
  if(SHUFFLE) sc += jitter(e.id+"|"+slot.shiftId+"|"+date+"|"+SHUFFLE);
  if(S.priority.mode==="off") sc += Math.min(tenure(e),15)*0.35;
  return sc;
}


/* ============================================================
   Staff groups + ratio and pairing rules
   ============================================================ */
function groupsFor(e){
  return (S.groups||[]).filter(g=>{
    const r=(g.match&&g.match.roleIds)||[], t=(g.match&&g.match.types)||[], m=(g.match&&g.match.empIds)||[];
    if(m.length) return m.includes(e.id);
    const roleOk = !r.length || e.roleIds.some(x=>r.includes(x));
    const typeOk = !t.length || t.includes(e.type);
    return roleOk && typeOk;
  });
}
/* A person's effective limits: their own, tightened by every group they fall into. */
/* `ref` is any date in the week these limits are for — an averaged work cycle
   spends its hours across a period, so the cap depends on which week you ask about.
   Left out, it means the week on screen. */
function effLimits(e, ref){
  const exact = e.hoursMode==="exact" ? (e.maxH||0) : 0;
  const L={ minH: exact||e.minH||0, maxH: exact||e.maxH||0, exactH: exact, maxD:e.maxD||7,
            maxShiftH:S.rules.maxShiftH, minRestH:S.rules.minRestH,
            maxConsecDays:S.rules.maxConsecDays, canBeAlone:true, groups:[] };
  const wcap = cyclesOn()? cycleWeekCap(e, weekStartOf(ref||S.currentWeek, S.org.weekStart)) : null;
  if(wcap!=null){ L.maxH = L.maxH? Math.min(L.maxH, wcap) : wcap; L.cycleCap=wcap; }
  groupsFor(e).forEach(g=>{
    const r=g.rules||{}; L.groups.push(g.name);
    if(r.exactH){ L.exactH=r.exactH; L.minH=r.exactH; L.maxH=r.exactH; }
    if(!L.exactH && r.maxH) L.maxH = L.maxH? Math.min(L.maxH, r.maxH) : r.maxH;
    if(!L.exactH && r.minH) L.minH = Math.max(L.minH, r.minH);
    if(r.maxD) L.maxD = Math.min(L.maxD, r.maxD);
    if(r.maxShiftH) L.maxShiftH = Math.min(L.maxShiftH||99, r.maxShiftH);
    if(r.minRestH) L.minRestH = Math.max(L.minRestH||0, r.minRestH);
    if(r.maxConsecDays) L.maxConsecDays = Math.min(L.maxConsecDays||99, r.maxConsecDays);
    if(r.canBeAlone===false){ L.canBeAlone = false; L.aloneGroup = g.name; }
  });
  return L;
}

/* Shift a set of breaks back a day, for the part of a night shift that lands
   after midnight. */
function rebaseBreaks(b){
  b = b||{meals:[],rests:[]};
  return { owed:b.owed||{meals:0,rests:0},
    meals:(b.meals||[]).filter(m=>m.end>1440).map(m=>Object.assign({},m,{start:Math.max(0,m.start-1440),end:m.end-1440})),
    rests:(b.rests||[]).filter(r=>r.start+r.len>1440).map(r=>Object.assign({},r,{start:Math.max(0,r.start-1440)})) };
}
/* Who is actually on the floor on a given date — the shifts that start that day,
   plus whoever is still here from the night before. */
function floorOn(pool, date){
  const out = pool.filter(a=>a.date===date);
  if(!anyOvernight()) return out;
  const yday = addDays(date,-1);
  let tails = pool.filter(a=>a.date===yday && a.endMin>1440);
  if(!tails.length && yday < weekStartOf(date, S.org.weekStart)){
    /* the night before the week began — that one is already posted */
    const pw = S.weeks[weekStartOf(yday, S.org.weekStart)];
    if(pw) tails = pw.assignments.filter(a=>a.date===yday && a.endMin>1440);
  }
  tails.forEach(a=>{
    out.push(Object.assign({},a,{startMin:0, endMin:a.endMin-1440, breaks:rebaseBreaks(a.breaks)}));
  });
  return out;
}
/* Would putting this person on this shift breach a ratio or pairing rule?
   A shift that runs past midnight is checked against the next day's rules too —
   the people it needs alongside it are tomorrow's roster, not today's. */
function breachReason(e, roleId, date, dow, pool, aMin, bMin){
  pool = pool||[];
  const lim = effLimits(e,date);
  const mine = {empId:e.id, date, dow, roleId, startMin:aMin, endMin:bMin,
                breaks:computeBreaks(aMin,bMin)};

  function scan(d, dw, probe, from, to){
    const rules=(S.coverage||[]).filter(r=>r.kind && r.kind!=="min" && r.days.includes(dw));
    for(const r of rules){
      const rs=t2m(r.start); let re=t2m(r.end); if(re<=rs) re+=1440;
      const O={ignoreMeals: r.mealsCount===false};
      for(let t=Math.max(from,rs); t<Math.min(to,re); t+=30){
        const sup = onDutyAt(probe,t,r.roleId,O);
        const sub = onDutyAt(probe,t,r.perRoleId,O);
        if(r.kind==="ratio"){
          if(sub>0 && sup < Math.ceil(sub/Math.max(1,r.ratio||1)))
            return "would leave "+sub+" "+roleName(r.perRoleId).toLowerCase()+" to "+sup+" "+roleName(r.roleId).toLowerCase()+" at "+m2disp(t)+" (limit is "+(r.ratio||1)+":1)";
        } else if(r.kind==="pair"){
          if(sub>0 && sup < (r.min||1))
            return roleName(r.perRoleId)+" can't be on at "+m2disp(t)+" without "+(r.min||1)+" "+roleName(r.roleId).toLowerCase();
        }
      }
    }
    if(lim.canBeAlone===false){
      for(let t=from;t<to;t+=30){
        if(onDutyAt(probe,t,null)===1 && onDutyAt(probe.filter(x=>x.empId===e.id),t,null)===1)
          return e.name.split(" ")[0]+" would be the only person on the floor at "+m2disp(t);
      }
    }
    return null;
  }

  const today = floorOn(pool, date).filter(a=>a.empId!==e.id || a.date!==date).concat([mine]);
  let r = scan(date, dow, today, aMin, Math.min(bMin,1440));
  if(r) return r;
  if(bMin>1440){
    const nd=(dow+1)%7, nDate=addDays(date,1);
    const tail = Object.assign({}, mine, {startMin:0, endMin:bMin-1440, breaks:rebaseBreaks(mine.breaks)});
    r = scan(nDate, nd, floorOn(pool, nDate).concat([tail]), 0, bMin-1440);
    if(r) return r;
  }
  return null;
}


/* ============================================================
   When a shift can't be covered — concrete, named, dated fixes
   ============================================================ */
function openSlots(ws){
  ws = ws||S.currentWeek;
  const wk=peekWeek(ws), out=[];
  weekDates(ws).forEach(({date,dow})=>{
    matchDemand(expandDemand(dow,ws), wk.assignments.filter(a=>a.date===date))
      .missing.forEach(w=>out.push({date, dow, shiftId:w.shiftId, roleId:w.roleId}));
  });
  return out;
}

/* Every way this one slot could be covered, in the order worth trying.
   Works from what is actually in the way rather than a fixed order of guesses. */
function optionsFor(slot, ws){
  ws = ws||S.currentWeek;
  const sh=shiftById(slot.shiftId); if(!sh) return [];
  const [aMin,bMin]=shiftMinutes(sh);
  const wk=peekWeek(ws);
  const out=[];
  const when=DSHORT[slot.dow]+" "+prettyDate(slot.date);
  const otLine=(S.org.otWeeklyH||40)*60;

  S.employees.filter(e=>e.active).forEach(e=>{
    if(slot.roleId && !e.roleIds.includes(slot.roleId)) return;
    const lim=effLimits(e, ws);
    const mins=empWeekMinutes(e.id,ws), add=paidEstimate(aMin,bMin);
    const total=mins+add;
    const sameDay=wk.assignments.filter(a=>a.empId===e.id && a.date===slot.date);
    const days=empDays(e.id,ws);

    /* hard walls nothing here can move */
    if(!availOk(e,slot.dow,aMin,bMin)) return;                 /* they simply aren't free then */
    if(!cycleWorksOn(e,slot.date)) return;                     /* off-cycle */
    if(onTimeOff(e.id,slot.date)) return;                      /* away for the stretch */
    if(lim.maxShiftH && (bMin-aMin) > lim.maxShiftH*60) return;/* longer than they may work */

    const reqBlock=reqBlocks(e,slot.date,aMin,bMin,mins);
    const overCap = lim.maxH && total > lim.maxH*60+1;
    const overDays = days >= (lim.maxD||7) && !sameDay.length;
    let restGap=null;
    const prev=wk.assignments.filter(a=>a.empId===e.id && a.date===addDays(slot.date,-1));
    if(prev.length){
      const gap=(aMin+1440)-Math.max.apply(null,prev.map(x=>x.endMin));
      if(gap < (lim.minRestH||0)*60) restGap=gap;
    }
    /* and the day after — the schedule may already have them on it */
    const nxt=wk.assignments.filter(a=>a.empId===e.id && a.date===addDays(slot.date,1));
    if(nxt.length){
      const gap=(Math.min.apply(null,nxt.map(x=>x.startMin))+1440)-bMin;
      if(gap < (lim.minRestH||0)*60 && (restGap===null || gap<restGap)) restGap=gap;
    }

    /* someone you keep on call, and nothing else in the way */
    if(e.onCall){
      if(!sameDay.length && !reqBlock && !restGap)
        out.push({kind:"percall", emp:e, rank:1,
          title:"Call in "+e.name,
          why:(e.type==="PRN"? "Per diem — no guaranteed hours. " : "Kept on call. ")+
              fmtHrs(mins)+" so far this week"+(overCap? ", so this one is on top of their usual":"")+".",
          cost: e.rate? add/60*e.rate : 0,
          apply:()=>placeInSlot(e,slot,ws,{allowOnCall:true})});
      return;
    }

    /* a request is what's in the way — you can decline it */
    if(reqBlock){
      const req=reqsFor(e.id,slot.date).find(r=>r.hard);
      if(req && !sameDay.length) out.push({kind:"deny", emp:e, rank:5, req,
        title:"Decline "+e.name.split(" ")[0]+"'s request",
        why:"They "+reqBlock+". Declining it puts them back in the frame for "+sh.label+", "+when+".",
        cost: e.rate? add/60*e.rate : 0,
        apply:()=>{ req.status="declined"; req.deniedAt=Date.now(); placeInSlot(e,slot,ws,{}); }});
      return;
    }

    /* already on something else that day — moving them opens a different hole */
    if(sameDay.length){
      const other=sameDay[0];
      if(other.locked) return;
      const otherSh=shiftById(other.shiftId)||{label:"their other shift"};
      if(otherSh.id===slot.shiftId) return;
      out.push({kind:"move", emp:e, rank:6, other,
        title:"Move "+e.name.split(" ")[0]+" off "+otherSh.label,
        why:"They're on "+otherSh.label+" that day. Moving them here leaves "+otherSh.label+" open instead — worth it only if this one matters more.",
        cost:0,
        apply:()=>{ const i=wk.assignments.indexOf(other); if(i>=0) wk.assignments.splice(i,1); placeInSlot(e,slot,ws,{}); }});
      return;
    }

    /* the turnaround is short */
    if(restGap!==null){
      if(restGap>=8*60) out.push({kind:"rest", emp:e, rank:7,
        title:"Give "+e.name.split(" ")[0]+" a shorter turnaround",
        why:"They'd have "+fmtHrs(restGap)+" off instead of your usual "+lim.minRestH+"h. Legal in most places, but it's the kind of thing people notice.",
        cost: e.rate? add/60*e.rate : 0,
        apply:()=>placeInSlot(e,slot,ws,{shortRest:true})});
      return;
    }

    /* nothing but their own hours or days stands in the way */
    if(overCap || overDays){
      const overOT=Math.max(0, total - otLine);
      if(overOT > 1){
        out.push({kind:"overtime", emp:e, rank:4,
          title:"Ask "+e.name+" to work overtime",
          why:"Would take them to "+fmtHrs(total)+" — "+fmtHrs(overOT)+" past the "+(S.org.otWeeklyH||40)+
              "h line"+(e.rate? ", about "+money(overOT/60*e.rate*1.5)+" at time and a half":"")+".",
          cost: e.rate? (add-overOT)/60*e.rate + overOT/60*e.rate*1.5 : 0,
          apply:()=>placeInSlot(e,slot,ws,{overtime:true})});
      } else {
        const bits=[];
        if(overCap) bits.push(fmtHrs(total - lim.maxH*60)+" past their usual "+lim.maxH+"h"+(lim.exactH?" contract":""));
        if(overDays) bits.push("a "+(days+1)+(days+1===6?"th":days+1===7?"th":"th")+" day, one more than they normally do");
        out.push({kind:"extra", emp:e, rank:2,
          title:"Ask "+e.name+" to pick up an extra shift",
          why:"Would take them to "+fmtHrs(total)+" — "+bits.join(" and ")+". Still under the "+
              (S.org.otWeeklyH||40)+"h line, so it's paid at the normal rate"+(e.rate? " (about "+money(add/60*e.rate)+")":"")+".",
          cost: e.rate? add/60*e.rate : 0,
          apply:()=>placeInSlot(e,slot,ws,{extra:true})});
      }
      return;
    }

    /* free, within every limit — something else (a ratio, a lone-worker rule) kept them off */
    out.push({kind:"free", emp:e, rank:0,
      title:"Put "+e.name+" on it",
      why:"Free that day and inside every limit — a coverage rule was what kept them off, so check it still holds after.",
      cost: e.rate? add/60*e.rate : 0,
      apply:()=>placeInSlot(e,slot,ws,{})});
  });

  out.sort((a,b)=>a.rank-b.rank || (a.cost||0)-(b.cost||0));
  return out;
}

/* ============================================================
   Not right? — reject a draft and say what to change
   ============================================================ */
/* Redraft one day only, leaving the rest of the week exactly as it is. */
function redoDay(ws, date){
  const wk=getWeek(ws);
  const was=wk.assignments.map(a=>a.locked);
  wk.assignments.forEach(a=>{ a.locked = a.date!==date; });
  wk.seed=(wk.seed||0)+1;
  const r=generateSchedule(ws);
  wk.assignments.forEach((a,i)=>{ if(i<was.length) a.locked=was[i]; else a.locked=false; });
  wk.touched=true; wk.suggested=true;
  return r;
}
/* Redraft the whole week, with the ties falling differently this time. */
function redoWeek(ws, opts){
  opts=opts||{};
  const wk=getWeek(ws);
  /* anything you locked is yours and stays; everything else is rebuilt */
  wk.assignments = opts.dropLocks? [] : wk.assignments.filter(a=>a.locked);
  wk.seed=(wk.seed||0)+1;
  const r=generateSchedule(ws);
  wk.touched=true; wk.suggested=true;
  return r;
}
function addVeto(ws, v){
  const wk=getWeek(ws);
  wk.vetoes=wk.vetoes||[];
  if(!wk.vetoes.some(x=>x.empId===v.empId && x.date===v.date && (x.shiftId||null)===(v.shiftId||null)))
    wk.vetoes.push(v);
}
function vetoText(v){
  const n=(empById(v.empId)||{name:"Someone"}).name.split(" ")[0];
  return v.shiftId
    ? n+" off "+(shiftById(v.shiftId)||{label:"that shift"}).label+", "+prettyDate(v.date)
    : n+" off "+prettyDate(v.date)+" altogether";
}

/* Put someone on a slot, overriding whatever normally stops it. */
function placeInSlot(e, slot, ws, opts){
  opts=opts||{};
  const sh=shiftById(slot.shiftId); if(!sh) return;
  const [aMin,bMin]=shiftMinutes(sh);
  const wk=getWeek(ws||S.currentWeek);
  const rec={id:uid("a"), empId:e.id, date:slot.date, dow:slot.dow, shiftId:slot.shiftId,
    startMin:aMin, endMin:bMin, roleId:slot.roleId||e.roleIds[0]||null, locked:true,
    override: opts.overtime? "overtime" : opts.extra? "extra shift" : opts.shortRest? "short rest" : opts.allowOnCall? "called in" : null};
  applyBreaks(rec);
  wk.assignments.push(rec);
  wk.assignments.sort((x,y)=>x.date.localeCompare(y.date)||x.startMin-y.startMin);
  staggerDay(wk.assignments.filter(a=>a.date===slot.date && !a.locked), wk.assignments.filter(a=>a.date===slot.date));
  save();
}

/* The same shift open on several days — one ask covers them all. */
function groupOpen(slots){
  const g={};
  slots.forEach(sl=>{ const k=sl.shiftId+"|"+(sl.roleId||""); (g[k]=g[k]||[]).push(sl); });
  return Object.keys(g).map(k=>({shiftId:k.split("|")[0], roleId:k.split("|")[1]||null,
    slots:g[k].sort((a,b)=> dateLoad(b.date,b.dow)-dateLoad(a.date,a.dow) || a.date.localeCompare(b.date))}));
}

/* ============================================================
   When requests collide — you decide which one gives
   ============================================================ */
function requestConflictModal(ws){
  ws = ws||S.currentWeek;
  const period=reqPeriod(ws, 1);
  const live=(S.requests||[]).filter(r=>{
    if(r.status==="declined") return false;
    if(r.kind==="maxh") return true;
    if(r.every && r.every.length) return r.from<=period.to && (!r.to||r.to==="2099-01-01"||r.to>=period.from);
    return !(r.to<period.from || r.from>period.to);
  });
  const missed=live.map(r=>({r, o:reqOutcome(r,ws,1)})).filter(x=>x.o.ok===false);
  const open=openSlots(ws);

  /* which granted requests are actually costing you cover? */
  const costing=[];
  live.forEach(r=>{
    if(!r.hard) return;
    const o=reqOutcome(r,ws,1);
    if(o.ok===false) return;                       /* already not honoured */
    const e=empById(r.empId); if(!e) return;
    const helps=open.filter(sl=>{
      if(sl.roleId && !e.roleIds.includes(sl.roleId)) return false;
      const sh=shiftById(sl.shiftId); if(!sh) return false;
      const [a,b]=shiftMinutes(sh);
      if(!availOk(e,sl.dow,a,b)) return false;
      if(onTimeOff(e.id,sl.date)) return false;
      if(getWeek(ws).assignments.some(x=>x.empId===e.id && x.date===sl.date)) return false;
      return !!reqBlocks(e,sl.date,a,b,empWeekMinutes(e.id,ws));
    });
    if(helps.length) costing.push({r, e, helps});
  });

  modal("What gives?", `
    <div class="stack">
      ${costing.length? `
        <p class="whead">These requests are the reason a shift is open. Declining one puts that person back in the frame — you decide which, and nobody has to guess what it cost.</p>
        <div class="stack" style="gap:7px">
          ${costing.map((c,i)=>`<div class="fixopt">
            <span class="fixk deny">granted</span>
            <div style="flex:1;min-width:0">
              <strong>${esc(c.e.name)} — ${esc(reqKind(c.r.kind).t.toLowerCase())}${reqRepeatText(c.r)? ", "+esc(reqRepeatText(c.r)) : c.r.from===c.r.to? " on "+prettyDate(c.r.from) : " "+prettyDate(c.r.from)+"–"+prettyDate(c.r.to)}</strong>
              <div class="mini">Granting it leaves ${esc(c.helps.map(h=>(shiftById(h.shiftId)||{label:"a shift"}).label+" "+DSHORT[h.dow]).join(", "))} open${c.r.note? ' · they said: "'+esc(c.r.note)+'"':""}</div></div>
            <div class="row" style="gap:6px;flex:none">
              <button class="btn sm" data-keep="${c.r.id}">Keep it</button>
              <button class="btn sm danger" data-deny="${c.r.id}">Decline and fill the shift</button>
            </div></div>`).join("")}
        </div>` : ""}
      ${missed.length? `
        <div class="sep"></div>
        <div class="lab" style="margin-bottom:7px">Already couldn't be met</div>
        <p class="help">These didn't work out, and the schedule reflects that. Marking one declined just makes it official so it stops showing up as a miss — and gives you a record of what you turned down and why.</p>
        <div class="stack" style="gap:7px">
          ${missed.map(x=>`<div class="fixopt">
            <span class="fixk">not met</span>
            <div style="flex:1;min-width:0">
              <strong>${esc((empById(x.r.empId)||{name:"—"}).name)} — ${esc(reqKind(x.r.kind).t.toLowerCase())}</strong>
              <div class="mini">${esc(x.o.say)}</div></div>
            <button class="btn sm" data-deny="${x.r.id}" style="flex:none">Mark declined</button>
          </div>`).join("")}
        </div>` : ""}
      ${!costing.length && !missed.length? `<div class="banner info"><div><b>Nothing is in conflict.</b> Every request in this week landed the way it was asked, and none of them is holding a shift open.</div></div>`:""}
    </div>`,
    `<button class="btn" data-close>Done</button>`,
    r=>{
      r.querySelectorAll("[data-deny]").forEach(b=>b.onclick=()=>{
        const req=(S.requests||[]).find(x=>x.id===b.dataset.deny); if(!req) return;
        req.status="declined";
        req.deniedAt=Date.now();
        const wk=getWeek(ws);
        wk.assignments=wk.assignments.filter(a=>a.locked);
        const res=generateSchedule(ws); wk.suggested=true; wk.touched=true;
        save(); closeModal(); render();
        toast("Declined — redrafted, "+res.filled+" shifts"+(res.unfilled.length? ", "+res.unfilled.length+" still open":", nothing left open"));
      });
      r.querySelectorAll("[data-keep]").forEach(b=>b.onclick=()=>{ closeModal(); fixModal(ws); });
    });
}


/* ============================================================
   Stations — where people actually stand, and whose turn it is
   ============================================================ */
function activeStations(){ return (S.stations||[]).filter(x=>!x.off); }
function stationById(id){ return (S.stations||[]).find(x=>x.id===id); }
function stationsOn(dow){ return activeStations().filter(x=>!x.days || !x.days.length || x.days.includes(dow)); }

/* How often each person has drawn each station, from posted weeks. */
/* Posts that share a rotation: "Typist 1" and "Typist 2" are both Typist, so a turn
   on either counts as a turn on Typist. Numbered posts group themselves. */
function stFamily(st){
  if(!st) return "";
  if(S.rules.stationFamilies===false) return "";      /* every post stands alone */
  if(st.family) return st.family;
  const m=/^(.*?)[\s\-#]*\d+$/.exec((st.name||"").trim());
  return (m? m[1] : (st.name||"")).trim().toLowerCase();
}
function stationFamilies(){
  const f={};
  (S.stations||[]).filter(x=>x.kind!=="admin"&&!x.off).forEach(st=>{
    const k=stFamily(st); (f[k]=f[k]||[]).push(st);
  });
  return f;
}
function stationLedger(){
  const L={};
  S.employees.forEach(e=>{ L[e.id]={good:0,bad:0,byStation:{},byFamily:{},total:0}; });
  Object.keys(S.weeks).forEach(k=>{
    const wk=S.weeks[k];
    if(S.priority.ledgerFrom==="posted" && !wk.published) return;
    wk.assignments.forEach(a=>{
      [a.station,a.station2].filter(Boolean).forEach(sid=>{
        const st=stationById(sid), rec=L[a.empId];
        if(!st||!rec) return;
        rec.total++; rec.byStation[sid]=(rec.byStation[sid]||0)+1;
        const fam=stFamily(st); if(fam) rec.byFamily[fam]=(rec.byFamily[fam]||0)+1;
        if((st.desire||0)>0) rec.good++; else if((st.desire||0)<0) rec.bad++;
      });
    });
  });
  return L;
}

/* Hand out the day's stations. Whoever has had a post least often gets first refusal
   on the bad ones and first claim on the good — counted across history AND the week
   being drafted, so the same person doesn't draw the short straw five days running. */
/* How long someone holds a post before the floor rotates. "day" keeps the
   classic one-post-all-day behaviour; anything else splits the open hours into
   equal blocks and rotates people through the posts, CVS-style. */
const SPAN_MIN={day:0, half:-1, "2h":120, "3h":180, "4h":240};
function stationBlocks(date, dow, list){
  const span=S.rules.stationSpan||"day";
  if(span==="day" || !list.length) return null;
  const open=Math.min.apply(null, list.map(a=>a.startMin));
  const close=Math.max.apply(null, list.map(a=>a.endMin));
  if(close<=open) return null;
  let len = span==="half" ? Math.ceil((close-open)/2/15)*15 : (SPAN_MIN[span]||120);
  if(len<60) len=60;
  const out=[];
  for(let t=open; t<close; t+=len) out.push([t, Math.min(close, t+len)]);
  /* a stub tail (under half a block) folds into the one before it */
  if(out.length>1 && (out[out.length-1][1]-out[out.length-1][0]) < len*0.5){
    out[out.length-2][1]=out[out.length-1][1]; out.pop();
  }
  return out;
}
function assignStationBlocks(date, ws, T, posts, list, helpers){
  const {score, bump} = helpers;
  const blocks=stationBlocks(date, parseYmd(date).getDay(), list);
  if(!blocks) return false;
  const rows=list.filter(a=>!a.stationLocked);
  rows.forEach(a=>{ a.stationPlan=[]; });
  blocks.forEach(([bFrom,bTo])=>{
    /* who is actually on the floor for this block — and free of their meal */
    let onFloor=rows.map(a=>({a, e:empById(a.empId)})).filter(x=>x.e &&
      Math.min(x.a.endMin,bTo) - Math.max(x.a.startMin,bFrom) >= 30);   /* a real slice of that block */
    /* posts that must be staffed during this block */
    const live=posts.filter(st=>{
      if(st.holdAllDay) return false;                       /* handled as a day-long post */
      const f=st.from? t2m(st.from):null, t=st.to? t2m(st.to):null;
      if(f!=null && bTo<=f) return false;
      if(t!=null && bFrom>=t) return false;
      return true;
    }).sort((a,b)=>(b.desire||0)-(a.desire||0));
    live.forEach(st=>{
      let fit=onFloor.filter(x=>(!st.roleId || x.e.roleIds.includes(st.roleId)) &&
        (!st.slots || !st.slots.length || st.slots.includes(x.a.shiftId)));
      if(!fit.length) return;
      fit.sort((x,y)=> score(x,st)-score(y,st) || x.e.name.localeCompare(y.e.name));
      const pick=fit[0];
      onFloor=onFloor.filter(x=>x!==pick);
      bump(pick, st);
      pick.a.stationPlan.push({from:Math.max(bFrom, pick.a.startMin), to:Math.min(bTo, pick.a.endMin), st:st.id});
    });
  });
  /* tidy: merge a person's back-to-back blocks on the same post */
  rows.forEach(a=>{
    const p=(a.stationPlan||[]).sort((x,y)=>x.from-y.from);
    const merged=[];
    p.forEach(b2=>{ const last=merged[merged.length-1];
      if(last && last.st===b2.st && last.to===b2.from) last.to=b2.to; else merged.push(Object.assign({},b2)); });
    a.stationPlan=merged;
    if(merged.length) a.station=merged[0].st;      /* so every existing view still shows something */
  });
  return true;
}
function assignStations(date, ws, tally){
  ws = ws||S.currentWeek;
  const wk=peekWeek(ws);
  const dow=parseYmd(date).getDay();
  const list=wk.assignments.filter(a=>a.date===date).sort((a,b)=>a.startMin-b.startMin);
  if(!list.length) return;
  list.forEach(a=>{ if(!a.stationLocked){ delete a.station; delete a.station2; delete a.second; delete a.project; delete a.stationPlan; } });

  const posts=stationsOn(dow).filter(x=>x.kind!=="admin");
  const admin=stationsOn(dow).filter(x=>x.kind==="admin");
  const T = tally || seedTally(ws);
  const ladder=priorityOrder();
  const mode=S.rules.stationRotation||"fair";

  let people=list.filter(a=>!a.stationLocked).map(a=>({a, e:empById(a.empId)})).filter(x=>x.e);

  /* lower is "more owed this station" */
  /* a stable coin-flip: same week and day always shuffles the same way, so a redraft
     doesn't reshuffle the floor, but two equal claims aren't settled alphabetically */
  const jitter=(id)=>{ let h=(wk.seed||0)+date.length;
    const k=id+"|"+date; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0;
    return (h%1000)/1000; };
  const score=(x, st)=>{
    const rec=T[x.e.id] || {byStation:{}, byFamily:{}, good:0, bad:0, total:0};
    if(mode==="none") return jitter(x.e.id);
    if(mode==="seniority"){
      const rank=ladder.indexOf(x.e.id);
      /* the senior end gets the wanted posts and is spared the unwanted ones */
      return ((st.desire||0) >= 0 ? rank : -rank) + jitter(x.e.id)*0.01;
    }
    const fam=stFamily(st);
    const mineFam=fam? ((rec.byFamily||{})[fam]||0) : 0;
    const mine=(rec.byStation[st.id]||0);
    const bal=(rec.good||0)-(rec.bad||0);
    /* a turn anywhere in the family counts first, then this exact post,
       then whether they're up or down overall — ties broken by the coin-flip */
    return mineFam*10 + mine*4 + ((st.desire||0)>=0 ? bal : -bal) + (rec.total||0)*0.01 + jitter(x.e.id)*0.9;
  };
  const bump=(x, st)=>{
    const rec=T[x.e.id] = T[x.e.id] || {byStation:{}, byFamily:{}, good:0, bad:0, total:0};
    rec.byStation[st.id]=(rec.byStation[st.id]||0)+1; rec.total++;
    rec.byFamily=rec.byFamily||{};
    const fam=stFamily(st); if(fam) rec.byFamily[fam]=(rec.byFamily[fam]||0)+1;
    if((st.desire||0)>0) rec.good++; else if((st.desire||0)<0) rec.bad++;
  };
  const covers=(x, st)=>{
    if(st.slots && st.slots.length && !st.slots.includes(x.a.shiftId)) return false;
    const f=st.from? t2m(st.from):null, t=st.to? t2m(st.to):null;
    if(f==null && t==null) return true;
    return x.a.startMin <= (f==null? x.a.startMin : f) && x.a.endMin >= (t==null? x.a.endMin : t);
  };
  const take=(st)=>{
    let fit=people.filter(x=>(!st.roleId || x.e.roleIds.includes(st.roleId)) && covers(x,st));
    if(!fit.length && (st.from||st.to||(st.slots&&st.slots.length)))
      fit=people.filter(x=>!st.roleId || x.e.roleIds.includes(st.roleId));   /* nobody spans it — best available */
    if(!fit.length) return null;
    fit.sort((x,y)=> score(x,st)-score(y,st) || x.e.name.localeCompare(y.e.name));
    const pick=fit[0];
    people=people.filter(x=>x!==pick);
    bump(pick, st);
    return pick;
  };

  /* rotating floors: split the day into blocks and move people between posts */
  if((S.rules.stationSpan||"day")!=="day"){
    const rotated=assignStationBlocks(date, ws, T, posts.filter(st=>!st.holdAllDay), list, {score, bump});
    if(rotated){
      /* posts someone holds for the whole day still get handed out the classic way */
      posts.filter(st=>st.holdAllDay).forEach(st=>{ const p=take(st); if(p) p.a.station=st.id; });
      if(admin.length && list.length){
        const opener=list[0], closer=list[list.length-1];
        admin.forEach(t=>{
          const target = t.assignTo==="closer"? closer : t.assignTo==="opener"? opener : opener;
          target.admin=(target.admin||[]).concat([t.id]);
        });
      }
      return T;
    }
  }

  /* linked pairs swap at the middle of the day, so both people share the good and the bad */
  const done=new Set(), pairs=[];
  posts.forEach(st=>{
    if(done.has(st.id)) return;
    if(st.linkedTo && stationById(st.linkedTo) && !done.has(st.linkedTo) && posts.some(o=>o.id===st.linkedTo)){
      pairs.push([st, stationById(st.linkedTo)]); done.add(st.id); done.add(st.linkedTo);
    }
  });
  const singles=posts.filter(st=>!done.has(st.id)).sort((a,b)=>(b.desire||0)-(a.desire||0));

  pairs.forEach(([x,y])=>{
    const p1=take(x); if(p1){ p1.a.station=x.id; p1.a.station2=y.id; bump(p1,y); }
    const p2=take(y); if(p2){ p2.a.station=y.id; p2.a.station2=x.id; bump(p2,x); }
  });
  singles.forEach(st=>{ const p=take(st); if(p) p.a.station=st.id; });

  /* Spare bodies. Stations you've marked as taking two get a second person first,
     then whoever is left goes to project work — a whole shift of it, not an hour
     here and an hour there. */
  if(people.length){
    const doubles=posts.filter(st=>st.double);
    doubles.forEach(st=>{
      if(!people.length) return;
      const p=take(st);
      if(p){ p.a.station=st.id; p.a.second=true; }
    });
  }
  if(people.length && S.rules.fillMode==="full"){
    people.slice().sort((x,y)=> projectRank(x.e)-projectRank(y.e))
      .forEach(x=>{ if(projectOk(x.e)==="no") return; x.a.project=true; });
  }

  /* admin duties fall to whoever opens or closes */
  if(admin.length && list.length){
    const opener=list[0], closer=list[list.length-1];
    admin.forEach(t=>{
      const target = t.assignTo==="closer"? closer : t.assignTo==="opener"? opener : (people[0]&&people[0].a) || opener;
      target.admin=(target.admin||[]).concat([t.id]);
    });
  }
  return T;
}
/* Who steps onto a must-cover station while its person eats. Display-only —
   it never moves a shift; it names the best-placed person already on the floor.
   Invisible unless a station is marked as needing meal cover. */
function mealReliefFor(date, ws){
  const crit=(S.stations||[]).filter(x=>x.kind!=="admin" && !x.off && x.critical);
  if(!crit.length || S.rules.breakMode!=="assigned") return [];
  const wk=peekWeek(ws||S.currentWeek);
  const list=wk.assignments.filter(a=>a.date===date);
  const out=[];
  list.forEach(a=>{
    const st=a.station? stationById(a.station):null;
    if(!st || !st.critical) return;
    ((a.breaks||{}).meals||[]).filter(m=>!m.waived).forEach(m=>{
      /* a doubled-up colleague on the same post already keeps it covered */
      const colleague=list.some(b=>b!==a && b.station===a.station &&
        b.startMin<=m.start && b.endMin>=m.end &&
        !((b.breaks||{}).meals||[]).some(x=>!x.waived && x.start<m.end && x.end>m.start));
      if(colleague){ out.push({station:st, mealOf:a.empId, start:m.start, end:m.end, by:null, covered:true}); return; }
      const cand=list.filter(b=>{
        if(b===a) return false;
        if(b.startMin>m.start || b.endMin<m.end) return false;         /* on duty for the whole meal */
        const bst=b.station? stationById(b.station):null;
        if(bst && bst.critical) return false;                          /* can't abandon their own must-cover post */
        if(st.roleId && !((empById(b.empId)||{}).roleIds||[]).includes(st.roleId)) return false;
        if(((b.breaks||{}).meals||[]).some(x=>!x.waived && x.start<m.end && x.end>m.start)) return false;
        return true;
      });
      const prefers=(b)=>{
        if(!st.reliefFrom) return 1;
        if(st.reliefFrom==="family"){
          const bst=b.station? stationById(b.station):null;
          return (bst && stFamily(bst) && stFamily(bst)===stFamily(st))? 0 : 1;
        }
        return b.station===st.reliefFrom? 0 : 1;
      };
      cand.sort((x,y)=>{
        const xm=prefers(x), ym=prefers(y);
        if(xm!==ym) return xm-ym;
        const xp=(x.project||x.topUp)?0:1, yp=(y.project||y.topUp)?0:1;  /* project time is interruptible */
        if(xp!==yp) return xp-yp;
        const xs=x.second?0:1, ys=y.second?0:1;                          /* so is a second pair of hands */
        if(xs!==ys) return xs-ys;
        return 0;
      });
      out.push({station:st, mealOf:a.empId, start:m.start, end:m.end, by:cand.length? cand[0].empId : null});
    });
  });
  return out;
}
/* history the rotation starts from */
function seedTally(ws){
  const L=stationLedger();
  const T={};
  Object.keys(L).forEach(id=>{ T[id]={byStation:Object.assign({},L[id].byStation), byFamily:Object.assign({},L[id].byFamily||{}), good:L[id].good, bad:L[id].bad, total:L[id].total}; });
  /* plus anything already handed out earlier in the week being drafted */
  const wk=S.weeks[ws]; 
  return T;
}
function clearAdmin(date, ws){
  getWeek(ws||S.currentWeek).assignments.filter(a=>a.date===date).forEach(a=>{ if(!a.stationLocked) delete a.admin; });
}
let STATION_PASS=false;
function assignStationsWeek(ws){
  ws=ws||S.currentWeek;
  const T=seedTally(ws);
  weekDates(ws).forEach(({date})=>{ clearAdmin(date,ws); assignStations(date,ws,T); });
  save();
}


/* ============================================================
   Work cycles — 7 on 7 off, alternating weeks, averaged hours.
   Invisible unless switched on.
   ============================================================ */
/* How busy the business is, day by day — steers where spare hands go. */
const LOAD_LABEL={"-2":"Very quiet","-1":"Quiet","0":"Normal","1":"Busy","2":"Busiest"};
const LOAD_SHORT={"-2":"− −","-1":"−","0":"·","1":"+","2":"+ +"};
function dayLoad(dow){ return (S.dayLoad && typeof S.dayLoad[dow]==="number")? S.dayLoad[dow] : 0; }
/* Some places spike the day before a holiday, the day after, or both — set in
   setup or on the Holidays page. A rush day counts one step busier. */
function holRush(){ return (S.rules && S.rules.holidayRush) || "none"; }
function holAdj(dateStr){
  const r=holRush(); if(r==="none"||!dateStr) return null;
  const L=(S.holidays&&S.holidays.list)||[];
  if(L.some(h=>h.date===dateStr)) return null;              /* the holiday itself has its own staffing */
  if((r==="before"||r==="both")){ const h=L.find(h=>h.date===addDays(dateStr,1));  if(h) return {side:"before", name:h.name}; }
  if((r==="after" ||r==="both")){ const h=L.find(h=>h.date===addDays(dateStr,-1)); if(h) return {side:"after",  name:h.name}; }
  return null;
}
function dateLoad(dateStr,dow){ const a=holAdj(dateStr); return Math.max(-2, Math.min(2, dayLoad(dow)+(a?1:0))); }
/* Cover asked for on a day, as a share of the busiest day's cover. */
function coverOn(dow, ws){ return expandDemand(dow, ws).length; }
function loadMismatch(ws){
  const open=[0,1,2,3,4,5,6].filter(d=>!S.hours[d].closed);
  if(open.length<2) return [];
  const W=weekDates(ws);
  const rows=open.map(d=>{ const wd=W.find(x=>x.dow===d);
    return {d, date:wd&&wd.date, load:wd? dateLoad(wd.date,d) : dayLoad(d), cover:coverOn(d,ws)}; });
  const out=[];
  rows.forEach(a=>rows.forEach(b=>{
    if(a.d>=b.d) return;
    if(a.load>b.load && a.cover<b.cover) out.push({busy:a, quiet:b});
    if(b.load>a.load && b.cover<a.cover) out.push({busy:b, quiet:a});
  }));
  /* worst first — the day that's busiest against the day that's furthest ahead of it */
  out.forEach(x=>{ x.gap=(x.busy.load-x.quiet.load)*(x.quiet.cover-x.busy.cover); });
  return out.sort((x,y)=>y.gap-x.gap);
}

/* Turn a busy/quiet mismatch into something you can act on with one click:
   one named shift, moved from the quiet day to the busy one. It only ever moves
   shifts you have already defined, only onto days you're open, and only when the
   shift fits inside that day's hours. Nothing is applied until you say so. */
function fitsDay(sh, dow){
  const h=S.hours[dow]; if(!h || h.closed) return false;
  const [a,b]=shiftMinutes(sh);
  const o=t2m(h.open); let c=t2m(h.close); if(c<=o) c+=1440;
  return a>=o-1 && b<=c+1;
}
function loadProposals(ws){
  const D = demandOf(ws);
  const key = r => r.shiftId+"|"+(r.roleId||"");
  const tally = rows => { const m={}; (rows||[]).forEach(r=>{ m[key(r)]=(m[key(r)]||0)+(r.count||1); }); return m; };
  const out=[]; const seen={};
  loadMismatch(ws).forEach(x=>{
    const tag=x.busy.d+">"+x.quiet.d; if(seen[tag]) return; seen[tag]=1;
    const qc=tally(D[x.quiet.d]), bc=tally(D[x.busy.d]);
    /* the shift the quiet day has most spare of, that the busy day could run */
    let best=null;
    Object.keys(qc).forEach(k=>{
      const [shiftId, roleId] = [k.split("|")[0], k.split("|")[1]||null];
      const sh=shiftById(shiftId); if(!sh) return;
      if(!fitsDay(sh, x.busy.d)) return;
      const spare = qc[k] - (bc[k]||0);
      if(spare<=0) return;
      if(!best || spare>best.spare || (spare===best.spare && desireOf(shiftId,x.quiet.d) < desireOf(best.shiftId,x.quiet.d)))
        best={shiftId, roleId, spare, sh};
    });
    if(!best) return;
    const who = best.roleId? roleName(best.roleId) : "person";
    /* keep the pair's severity so the strongest suggestion leads */
    out.push({
      busy:x.busy, quiet:x.quiet, gap:x.gap, shiftId:best.shiftId, roleId:best.roleId,
      title:"Move one "+who.toLowerCase()+" from "+DAYS[x.quiet.d]+" to "+DAYS[x.busy.d],
      detail:DAYS[x.busy.d]+" is "+((holAdj(x.busy.date)? "the day "+holAdj(x.busy.date).side+" "+holAdj(x.busy.date).name : (LOAD_LABEL[dayLoad(x.busy.d)]||"").toLowerCase()))+
        " and asks for "+x.busy.cover+" shift"+(x.busy.cover===1?"":"s")+"; "+DAYS[x.quiet.d]+" is "+
        (LOAD_LABEL[dayLoad(x.quiet.d)]||"").toLowerCase()+" and asks for "+x.quiet.cover+". "+
        "This takes one "+best.sh.label+" off "+DAYS[x.quiet.d]+" and puts it on "+DAYS[x.busy.d]+
        " — same total shifts, same people, just a different day.",
      apply:()=>applyLoadProposal(ws, x, best)
    });
  });
  return out;
}
function applyLoadProposal(ws, x, best){
  const D = demandOf(ws);
  const same = r => r.shiftId===best.shiftId && (r.roleId||null)===(best.roleId||null);
  /* take one off the quiet day */
  const q=(D[x.quiet.d]||[]);
  const qi=q.findIndex(same);
  if(qi<0){ toast("That shift is no longer on "+DAYS[x.quiet.d]); return false; }
  if((q[qi].count||1)>1) q[qi].count=(q[qi].count||1)-1; else q.splice(qi,1);
  /* put one on the busy day */
  D[x.busy.d]=D[x.busy.d]||[];
  const bi=D[x.busy.d].findIndex(same);
  if(bi>=0) D[x.busy.d][bi].count=(D[x.busy.d][bi].count||1)+1;
  else D[x.busy.d].push({shiftId:best.shiftId, roleId:best.roleId, count:1});
  save();
  return true;
}
/* Apply, redraft the week if it isn't posted, and say what it did. */
function takeLoadProposal(p, ws){
  ws = ws||S.currentWeek;
  if(!applyLoadProposal(ws, {busy:p.busy, quiet:p.quiet}, {shiftId:p.shiftId, roleId:p.roleId})) return;
  const wk=S.weeks[ws];
  let note="";
  if(wk && !wk.published && wk.assignments && wk.assignments.length){
    const r=generateSchedule(ws); wk.touched=true; wk.suggested=true;
    note = r.unfilled.length? " · "+r.unfilled.length+" shift"+(r.unfilled.length===1?"":"s")+" left open — see the week" : " · redrafted";
  }
  save(); render();
  toast("Moved one "+((shiftById(p.shiftId)||{label:"shift"}).label)+" from "+DAYS[p.quiet.d]+" to "+DAYS[p.busy.d]+note);
}

function cyclesOn(){ return !!(S.rules && S.rules.useCycles); }
const CYCLE_TYPES=[
  {id:"", t:"The same every week", d:"The normal thing — their hours are the same shape week to week."},
  {id:"onoff", t:"So many days on, so many off", d:"Seven on and seven off, four on and three off — a block of days worked, then a block clear."},
  {id:"altweeks", t:"Alternating weeks", d:"A full week on, a full week off. Or two on, one off."},
  {id:"average", t:"Hours averaged over a period", d:"A set number of hours across two weeks or a pay period, spread however suits — heavy one week, light the next."}
];
function cycleOf(e){
  if(!cyclesOn()) return null;
  if(e.cycle && e.cycle.type) return e.cycle;
  const g=groupsFor(e).find(g=>g.rules && g.rules.cycle && g.rules.cycle.type);
  return g? g.rules.cycle : null;
}
function cycleAnchor(c){ return (c && c.anchor) || weekStartOf(ymd(new Date()), S.org.weekStart); }
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }

/* Is this a day they're on cycle to work at all? */
function cycleWorksOn(e, date){
  const c=cycleOf(e); if(!c) return true;
  if(c.type==="average") return true;                 /* averaging doesn't block days */
  const on = c.type==="altweeks" ? (c.onWeeks||1)*7 : (c.on||7);
  const off= c.type==="altweeks" ? (c.offWeeks||1)*7 : (c.off||7);
  const len = on+off; if(len<=0) return true;
  let n = daysBetween(cycleAnchor(c), date) % len;
  if(n<0) n+=len;
  return n < on;
}
/* The period an averaged cycle measures over, and this week's share of it. */
function cyclePeriod(e, ws){
  const c=cycleOf(e); if(!c || c.type!=="average") return null;
  const weeks=Math.max(1, c.weeks||2);
  const anchor=weekStartOf(cycleAnchor(c), S.org.weekStart);
  let n=Math.floor(daysBetween(anchor, ws)/7);
  const idx=((n % weeks)+weeks)%weeks;
  const start=addDays(ws, -idx*7);
  const list=[]; for(let i=0;i<weeks;i++) list.push(addDays(start,i*7));
  return {weeks, hours:c.hours||80, start, list, idx};
}
/* What this week's cap becomes once the rest of the period is accounted for. */
function cycleWeekCap(e, ws){
  const p=cyclePeriod(e, ws); if(!p) return null;
  const used=p.list.filter(k=>k!==ws).reduce((t,k)=>t+empWeekMinutes(e.id,k),0);
  return Math.max(0, p.hours*60 - used)/60;
}
function cycleLabel(e){
  const c=cycleOf(e); if(!c) return "";
  if(c.type==="onoff") return (c.on||7)+" on, "+(c.off||7)+" off";
  if(c.type==="altweeks") return (c.onWeeks||1)===1 && (c.offWeeks||1)===1 ? "week on, week off"
    : (c.onWeeks||1)+" week"+((c.onWeeks||1)===1?"":"s")+" on, "+(c.offWeeks||1)+" off";
  if(c.type==="average") return (c.hours||80)+"h over "+(c.weeks||2)+" weeks";
  return "";
}
/* A plain-language read of where they are right now. */
function cycleStatus(e, ws){
  const c=cycleOf(e); if(!c) return null;
  if(c.type==="average"){
    const p=cyclePeriod(e,ws); if(!p) return null;
    const used=p.list.reduce((t,k)=>t+empWeekMinutes(e.id,k),0);
    const cap=cycleWeekCap(e,ws);
    return {label:cycleLabel(e),
      detail:"Week "+(p.idx+1)+" of "+p.weeks+" · "+fmtHrs(used)+" of "+p.hours+"h used across the period"+
             (cap!=null? ", up to "+fmtHrs(cap*60)+" left for this one":"")};
  }
  const dates=weekDates(ws);
  const on=dates.filter(d=>cycleWorksOn(e,d.date));
  return {label:cycleLabel(e),
    detail: on.length===0? "Off the whole week"
      : on.length===7? "On the whole week"
      : "On "+on.map(d=>DSHORT[d.dow]).join(", ")};
}

/* ============================================================
   Coverage + validation
   ============================================================ */
const STEP = 15;
function dayWindow(dow){
  const h = S.hours[dow];
  if(h.closed) return null;
  return [t2m(h.open), t2m(h.close)<=t2m(h.open)? t2m(h.close)+1440 : t2m(h.close)];
}
/* on-duty count at minute t (meals are unpaid & off-duty; rests stay on premises but off the floor) */
function onDutyAt(list, t, roleId, opts){
  opts = opts||{};
  return list.filter(a=>{
    if(roleId && a.roleId!==roleId) return false;
    if(t < a.startMin || t >= a.endMin) return false;
    const b=a.breaks||{meals:[],rests:[]};
    if(!opts.ignoreMeals && b.meals.some(m=>!m.waived && t>=m.start && t<m.end)) return false;
    if(opts.countRests && b.rests.some(r=>t>=r.start && t<r.start+r.len)) return false;
    return true;
  }).length;
}
/* Does anything in the pool run past midnight? If not, none of the work below matters. */
function anyOvernight(){
  return S.shifts.some(s=>{ const [a,b]=shiftMinutes(s); return b>1440; });
}
/* Everyone on the floor on this date — including whoever is still here from
   last night's shift, rebased onto this morning's clock. */
function dayList(date, ws){
  const wk=peekWeek(ws);
  const out = wk.assignments.filter(a=>a.date===date);
  if(!anyOvernight()) return out;
  const prevDate = addDays(date,-1);
  const pool = wk.assignments.concat(peekWeek(addDays(ws||S.currentWeek,-7)).assignments);
  pool.filter(a=>a.date===prevDate && a.endMin>1440).forEach(a=>{
    const b=a.breaks||{meals:[],rests:[]};
    const shift = x => Object.assign({}, x, {start:Math.max(0,x.start-1440)});
    out.push(Object.assign({}, a, {
      _tail:true, startMin:0, endMin:a.endMin-1440,
      breaks:{ owed:b.owed||{meals:0,rests:0},
               meals:(b.meals||[]).filter(m=>m.end>1440).map(m=>Object.assign(shift(m),{end:m.end-1440})),
               rests:(b.rests||[]).filter(r=>r.start+r.len>1440).map(shift) }
    }));
  });
  return out;
}
function coverageProfile(date, dow, ws){
  const wk=peekWeek(ws);
  const list = dayList(date, ws);
  const win = dayWindow(dow);
  if(!win) return null;
  const [o,c]=win;
  const rules = S.coverage.filter(r=>r.days.includes(dow));
  const pts=[];
  for(let t=o;t<c;t+=STEP){
    let worst=0, detail=[];
    const shut = shutAt(t);
    rules.forEach(r=>{
      if(shut) return;                       /* doors closed for lunch — nothing owed */
      const rs=t2m(r.start), re=t2m(r.end)<=t2m(r.start)?t2m(r.end)+1440:t2m(r.end);
      if(t<rs||t>=re) return;
      const kind = r.kind||"min";
      const O = {ignoreMeals: r.mealsCount===false};
      let have, need;
      if(kind==="min"){
        have = r.roleId? onDutyAt(list,t,r.roleId,O) : onDutyAt(list,t,null,O);
        need = r.min||0;
      } else {
        const sub = onDutyAt(list,t,r.perRoleId,O);
        if(!sub) return;
        have = onDutyAt(list,t,r.roleId,O);
        need = kind==="ratio" ? Math.ceil(sub/Math.max(1,r.ratio||1)) : (r.min||1);
      }
      const gap = need - have;
      if(gap>0){ worst=Math.max(worst,gap); detail.push({rule:r,have,need}); }
    });
    pts.push({t, gap:worst, detail, shut, staff:onDutyAt(list,t,null)});
  }
  return {open:o, close:c, pts, rules};
}

/* Can this person's contracted hours be hit at all from the shifts you've defined?
   Answered exactly, by trying every combination up to their day limit. */
function exactHoursFeasible(e, ws){
  const L=effLimits(e, ws);
  if(!L.exactH) return {ok:true};
  const goal=Math.round(L.exactH*60);
  const maxD=L.maxD||7;
  /* the shift lengths this person could actually be given, from the pool in use that week */
  const lens=new Set();
  const D=demandOf(ws);
  Object.keys(D).forEach(dow=>{
    (D[dow]||[]).forEach(row=>{
      if(row.roleId && !e.roleIds.includes(row.roleId)) return;
      const sh=shiftById(row.shiftId); if(!sh) return;
      const [a,b]=shiftMinutes(sh);
      if(L.maxShiftH && (b-a) > L.maxShiftH*60) return;
      lens.add(paidEstimate(a,b));
    });
  });
  const list=[...lens].filter(x=>x>0).sort((a,b)=>a-b);
  if(!list.length) return {ok:false, why:"none of the shifts running that week are ones "+e.name.split(" ")[0]+" can fill", lens:[]};
  /* reachable sums with up to maxD shifts */
  let reach=new Set([0]);
  for(let k=0;k<maxD;k++){
    const next=new Set(reach);
    reach.forEach(v=>list.forEach(l=>{ if(v+l<=goal+240) next.add(v+l); }));
    reach=next;
    if(reach.has(goal)) return {ok:true, lens:list};
  }
  const all=[...reach].filter(v=>v>0).sort((a,b)=>Math.abs(a-goal)-Math.abs(b-goal));
  const near=all.slice(0,2).sort((a,b)=>a-b);
  return {ok:false, lens:list, near,
    why:"no combination of your "+list.map(x=>fmtHrs(x)).join(", ")+" shift"+(list.length===1?"":"s")+
        " adds up to "+fmtHrs(goal)+(near.length? " — the closest you can get is "+near.map(x=>fmtHrs(x)).join(" or ") : "")};
}

function ruleSentence(r){
  const k=r.kind||"min";
  if(k==="ratio") return "at least one "+roleName(r.roleId).toLowerCase()+" for every "+(r.ratio||1)+" "+roleName(r.perRoleId).toLowerCase();
  if(k==="pair")  return (r.min||1)+" "+roleName(r.roleId).toLowerCase()+" on whenever any "+roleName(r.perRoleId).toLowerCase()+" is";
  return "at least "+(r.min||1)+" "+(r.roleId? roleName(r.roleId).toLowerCase() : "on the floor");
}
/* ---- What changed since the schedule was last put in front of people ---- */
/* Re-posting a week people already planned around: say so, and choose who hears.
   Gate: rules.confirmRepost (default on). */
function repostGuard(ws, doPost){
  const wk=peekWeek(ws||S.currentWeek);
  const changes = wk && wk.postedOnce ? weekDiff(ws||S.currentWeek) : [];
  if(!(wk && wk.postedOnce) || !changes.length || S.rules.confirmRepost===false){ doPost(null); return; }
  const who=[...new Set(changes.map(d=>d.empId))].map(id=>(empById(id)||{name:"?"}).name);
  modal("This schedule was already posted", `
    <div class="stack">
      <div class="help"><b>${changes.length} change${changes.length===1?"":"s"}</b> since it went up, affecting <b>${esc(who.join(", "))}</b> — people may have planned around the old version. Who should hear about it?</div>
      ${changes.slice(0,8).map(d=>`<div class="mini">• ${esc(d.name)} — ${esc(prettyDate(d.date))}: ${esc(d.say)}</div>`).join("")}
      ${changes.length>8? `<div class="mini">…and ${changes.length-8} more.</div>`:""}
    </div>`,
    `<button class="btn" data-close>Cancel</button>
     <button class="btn" id="rpnone">Post quietly</button>
     <button class="btn" id="rpaff">Notify affected</button>
     <button class="btn primary" id="rpall">Notify everyone</button>`,
    r=>{
      r.querySelector("#rpnone").onclick=()=>{ closeModal(true); doPost("none"); };
      r.querySelector("#rpaff").onclick=()=>{ closeModal(true); doPost("affected"); };
      r.querySelector("#rpall").onclick=()=>{ closeModal(true); doPost("all"); };
    });
}
function repostNotify(ws, choice, changes){
  if(!choice || choice==="none") return;
  if(sendOn()){ setTimeout(()=>sendModal(ws),300); return; }
  const lines=(changes||weekDiff(ws)).map(d=>d.name+" — "+prettyDate(d.date)+": "+d.say);
  modal("Tell "+(choice==="all"?"everyone":"the affected people"), `
    <div class="stack"><div class="help">Sending isn't switched on, so here's the change list ready to paste into a text or email.</div>
    <textarea style="min-height:120px" id="rptxt">Schedule update for the week of ${esc(prettyDate(ws))}:
${lines.join("\n")}</textarea></div>`,
    `<button class="btn" data-close>Done</button><button class="btn primary" id="rpcopy">Copy it</button>`,
    r=>{ r.querySelector("#rpcopy").onclick=()=>copyText(r.querySelector("#rptxt").value,"Copied"); });
}
function snapWeek(wk){
  wk.snap = wk.assignments.map(a=>({empId:a.empId,date:a.date,dow:a.dow,startMin:a.startMin,endMin:a.endMin,shiftId:a.shiftId}));
  wk.snapAt = Date.now();
}
function weekDiff(ws){
  const wk=peekWeek(ws||S.currentWeek);
  if(!wk.snap) return [];
  const key=x=>x.empId+"|"+x.date;
  const line=list=>list.slice().sort((a,b)=>a.startMin-b.startMin)
    .map(x=>m2disp(x.startMin)+"–"+m2disp(x.endMin)+" "+((shiftById(x.shiftId)||{}).label||"shift")).join(" + ");
  const before={}, after={};
  wk.snap.forEach(x=>{ (before[key(x)]=before[key(x)]||[]).push(x); });
  wk.assignments.forEach(x=>{ (after[key(x)]=after[key(x)]||[]).push(x); });
  const out=[];
  new Set(Object.keys(before).concat(Object.keys(after))).forEach(k=>{
    const b=before[k]||[], a=after[k]||[];
    const bs=line(b), as=line(a);
    if(bs===as) return;
    const [empId,date]=k.split("|");
    const e=empById(empId);
    out.push({empId, date, dow:parseYmd(date).getDay(),
      name:(e? e.name : "Former staff"),
      before:bs, after:as,
      say: !bs? "now on "+as : !as? "off (was "+bs+")" : "now "+as+" (was "+bs+")"});
  });
  return out.sort((x,y)=>x.date.localeCompare(y.date)||x.name.localeCompare(y.name));
}

/* ---- What one shift does to a person's week — hours, overtime, dollars ---- */
function weekImpact(empId, ws, excludeAid, addStart, addEnd){
  const wk=peekWeek(ws||S.currentWeek);
  const base=wk.assignments.filter(a=>a.empId===empId && a.id!==excludeAid).reduce((t,a)=>t+paidMinutes(a),0);
  const add=addStart!=null? paidEstimate(addStart, addEnd<=addStart? addEnd+1440:addEnd) : 0;
  const tot=base+add;
  const otLine=(S.org.otWeeklyH||40)*60;
  const ot=Math.max(0,tot-otLine);
  const e=empById(empId);
  let msg="Takes them to "+fmtHrs(tot)+" this week";
  if(ot>0){ msg+=" — "+fmtHrs(ot)+" past the "+(S.org.otWeeklyH||40)+"h line";
    if(haveRates() && e && e.rate) msg+=", about "+money(ot/60*e.rate*0.5)+" extra at time-and-a-half";
  }
  return {tot, ot, msg: msg+"."};
}

/* PTO ledger — invisible unless switched on. Balances are the user's own numbers:
   a starting balance as of a date, an accrual rule, minus approved time off that draws on it. */
function ptoOn(){ return !!S.org.trackPto; }
function ptoWorkedMin(empId, from, to){
  let t=0;
  Object.keys(S.weeks).forEach(k=>{
    S.weeks[k].assignments.forEach(a=>{ if(a.empId===empId && a.date>=from && a.date<=to) t+=paidMinutes(a); });
  });
  return t;
}
function ptoUsedH(e, from, to){
  let h=0;
  (S.timeoff||[]).forEach(t=>{
    if(t.empId!==e.id || t.status!=="approved" || !t.usePto) return;
    let d=t.start<from? from : t.start;
    const end=t.end>to? to : t.end;
    let guard=0;
    while(d<=end && guard++<400){
      const dow=parseYmd(d).getDay();
      if(!S.hours[dow].closed) h+=(t.hoursPerDay || e.holidayPayH || 8);
      d=addDays(d,1);
    }
  });
  return h;
}
function ptoBalance(e, asOf){
  const p=e.pto; if(!p || !ptoOn()) return null;
  asOf=asOf||ymd(new Date());
  const anchor=p.anchor||asOf;
  let acc=0;
  if(p.per==="week"){
    const days=Math.max(0, Math.round((parseYmd(asOf)-parseYmd(anchor))/86400000));
    acc=days/7*(p.rate||0);
  } else if(p.per==="per30" || p.per==="per40"){
    acc=ptoWorkedMin(e.id, anchor, asOf)/60/(p.per==="per30"?30:40)*(p.rate||1);
  }
  return Math.round(((p.bal||0)+acc-ptoUsedH(e, anchor, asOf))*10)/10;
}

/* Licenses — invisible unless a role requires one */
function licenseOn(){ return (S.roles||[]).some(r=>r.licensed); }
function empLicensed(e){ return (e.roleIds||[]).some(id=>{const r=roleById(id); return r&&r.licensed;}); }

/* Say immediately when a hand edit breaks something new — never blocks the edit. */
function vKey(v){ return v.sev+"|"+v.title+"|"+(v.date||"")+"|"+(v.empId||""); }
function headsUp(fn, okMsg){
  const before=new Set(validate(S.currentWeek).map(vKey));
  fn();
  const fresh=validate(S.currentWeek).filter(v=>!before.has(vKey(v)));
  if(fresh.length){
    const worst=fresh.find(v=>v.sev==="crit")||fresh[0];
    toast((okMsg||"Saved")+" — heads up: "+worst.title.toLowerCase()+(fresh.length>1? " (+"+(fresh.length-1)+" more in the conflicts list)":""));
  } else if(okMsg) toast(okMsg);
}

function validate(ws){
  ws = ws||S.currentWeek;
  const wk=peekWeek(ws), L=law(), V=[];
  const dates = weekDates(ws);
  const push=(sev,title,detail,extra)=>V.push(Object.assign({sev,title,detail},extra||{}));

  /* unfilled demand */
  dates.forEach(({date,dow})=>{
    const missing = matchDemand(expandDemand(dow, ws), wk.assignments.filter(a=>a.date===date)).missing;
    missing.forEach(s=>{
      const u = (wk.unfilled||[]).find(x=>x.date===date&&x.shiftId===s.shiftId&&(x.roleId||null)===(s.roleId||null));
      push("crit","Open shift — "+(shiftById(s.shiftId)||{label:"Shift"}).label+", "+DSHORT[dow],
        roleName(s.roleId)+" · "+(u?u.reason:"no one assigned yet"),
        {date,dow,openSlot:date+"|"+s.shiftId+"|"+(s.roleId||"")});
    });
  });

  /* coverage minimums */
  dates.forEach(({date,dow})=>{
    const prof = coverageProfile(date,dow,ws); if(!prof) return;
    const open = {}, closed = [];
    prof.pts.forEach(p=>{
      const seen = {};
      p.detail.forEach(d=>{
        const k=d.rule.id; seen[k]=true;
        if(open[k] && open[k].to===p.t){ open[k].to=p.t+STEP; open[k].worst=Math.max(open[k].worst,d.need-d.have); }
        else { if(open[k]) closed.push(open[k]);
               open[k]={rule:d.rule, from:p.t, to:p.t+STEP, worst:d.need-d.have}; }
      });
      Object.keys(open).forEach(k=>{ if(!seen[k]){ closed.push(open[k]); delete open[k]; } });
    });
    Object.values(open).forEach(r=>closed.push(r));
    closed.forEach(r=>{
      push("crit","Below required coverage — "+DSHORT[dow],
        (r.rule.label||ruleSentence(r.rule))+": short "+r.worst+" from "+m2disp(r.from)+" to "+m2disp(r.to)+
        (S.rules.staggerMeals?" (meal periods count as off duty)":""), {date,dow});
    });
  });

  /* per-employee */
  S.employees.forEach(e=>{
    const mine = wk.assignments.filter(a=>a.empId===e.id).sort((a,b)=>a.date.localeCompare(b.date));
    const mins = mine.reduce((t,a)=>t+paidMinutes(a),0);
    const lim = effLimits(e, ws);
    if(e.licExp && empLicensed(e)){
      const bad=mine.filter(a=>a.date>e.licExp);
      if(bad.length) push("crit","License lapsed — "+e.name.split(" ")[0],
        (e.licLabel||"Their license")+" expired "+prettyDate(e.licExp)+" but they're scheduled "+bad.map(a=>DSHORT[a.dow]).join(", ")+". Renew it or hand those shifts to someone current.",
        {empId:e.id, date:bad[0].date, dow:bad[0].dow});
      else if(e.active && e.licExp<=addDays(dates[6].date,30))
        push("warn","License expiring — "+e.name.split(" ")[0],
          (e.licLabel||"Their license")+" runs out "+prettyDate(e.licExp)+". Get the renewal moving now — with a date past, the drafter will refuse to schedule them.",
          {empId:e.id});
    }
    if(lim.maxH && mins > lim.maxH*60+1)
      push("warn","Over hour cap — "+e.name, fmtHrs(mins)+" scheduled against a "+lim.maxH+"h cap"+
        (lim.groups.length&&lim.maxH!==e.maxH? " (set by the "+lim.groups.join(" and ")+" group)":"")+".", {empId:e.id});
    if(cyclesOn()){
      const p=cyclePeriod(e, ws);
      if(p && ws===p.list[p.list.length-1]){
        const used=p.list.reduce((t,k)=>t+empWeekMinutes(e.id,k),0);
        const diff=used - p.hours*60;
        if(Math.abs(diff) > 60)
          push(diff>0? "warn":"info", (diff>0?"Over the period":"Under the period")+" — "+e.name,
            fmtHrs(used)+" across the "+p.weeks+" weeks from "+prettyDate(p.start)+", against "+p.hours+"h averaged.",
            {empId:e.id});
      }
    }
    if(lim.exactH && Math.abs(mins - lim.exactH*60) > 1){
      const f=exactHoursFeasible(e, ws);
      push("crit","Off contract — "+e.name,
        e.name.split(" ")[0]+" is contracted to exactly "+lim.exactH+"h and has "+fmtHrs(mins)+". "+
        (f.ok? "It can be done from the shifts you've defined — something else got in the way this week, so try locking one of their shifts and drafting again."
             : "Can't be done: "+f.why+". Add a shift of the right length under Roles & shifts, or change the contract."),
        {empId:e.id});
    } else if(!lim.exactH && lim.minH && e.type!=="PRN"){
      const fac=minHFactor(e.id, ws);
      const owe=Math.round(lim.minH*60*fac);
      if(mins < owe-1){
        const sh=(wk.short||[]).find(x=>x.empId===e.id);
        push(S.rules.fillMode==="full"? "crit":"warn","Under guaranteed hours — "+e.name,
          fmtHrs(mins)+" scheduled, "+fmtHrs(owe)+" owed"+(fac<1? " (guarantee scaled — they're away part of this week)":" ("+lim.minH+"h guaranteed)")+"."+
          (S.rules.fillMode==="full"? " "+(sh? "It couldn't be topped up: "+sh.why+"." : "Nothing else in the pool fits."):""), {empId:e.id});
      }
    }
    if(lim.canBeAlone===false){
      mine.forEach(a=>{
        const day=dayList(a.date, ws);
        for(let t=a.startMin;t<a.endMin;t+=30){
          if(onDutyAt(day,t,null)===1 && t>=a.startMin && t<a.endMin){
            push("crit","Left on their own — "+e.name,
              DSHORT[a.dow]+" around "+m2disp(t)+", and "+(lim.aloneGroup||"their group")+" is set never to work alone.", {date:a.date,empId:e.id});
            break;
          }
        }
      });
    }
    if(mins > (S.org.otWeeklyH||40)*60+1)
      push("warn","Weekly overtime — "+e.name, fmtHrs(mins)+" exceeds the "+S.org.otWeeklyH+"h overtime threshold.", {empId:e.id});

    /* daily OT, availability, time off, double-booking */
    const byDate={};
    mine.forEach(a=>{ (byDate[a.date]=byDate[a.date]||[]).push(a); });
    Object.keys(byDate).forEach(d=>{
      const list=byDate[d], dm=list.reduce((t,a)=>t+paidMinutes(a),0), dow=parseYmd(d).getDay();
      if(list.length>1) push("crit","Double-booked — "+e.name, DSHORT[dow]+" has "+list.length+" overlapping shifts.", {date:d,empId:e.id});
      if(dm > (S.org.otDailyH||8)*60+1)
        push("info","Daily overtime — "+e.name, DSHORT[dow]+" "+prettyDate(d)+": "+fmtHrs(dm)+" (over "+S.org.otDailyH+"h).", {date:d,empId:e.id});
      if(dm > (S.org.dtDailyH||12)*60+1)
        push("warn","Double time — "+e.name, DSHORT[dow]+" "+prettyDate(d)+": "+fmtHrs(dm)+" (over "+S.org.dtDailyH+"h).", {date:d,empId:e.id});
      list.forEach(a=>{
        if(!availOk(e,dow,a.startMin,a.endMin))
          push("crit","Outside stated availability — "+e.name, DSHORT[dow]+" "+m2disp(a.startMin)+"–"+m2disp(a.endMin)+" falls outside the hours "+e.name.split(" ")[0]+" can work.", {date:d,empId:e.id});
        if(onTimeOff(e.id,d)){
          const t=timeOffFor(e.id,d);
          push("crit","Scheduled during time off — "+e.name, (t?t.type:"Time off")+" "+prettyDate(t?t.start:d)+"–"+prettyDate(t?t.end:d)+".", {date:d,empId:e.id});
        }
      });
    });

    /* rest between shifts + consecutive days */
    for(let i=1;i<mine.length;i++){
      const prev=mine[i-1], cur=mine[i];
      const dayGap = Math.round((parseYmd(cur.date)-parseYmd(prev.date))/86400000);
      if(dayGap===1){
        const gap = (cur.startMin + 1440) - prev.endMin;
        if(gap < (S.rules.minRestH||0)*60)
          push("crit","Short turnaround — "+e.name,
            fmtHrs(gap)+" between "+DSHORT[prev.dow]+" out and "+DSHORT[cur.dow]+" in ("+S.rules.minRestH+"h required).", {date:cur.date,empId:e.id});
        else if(S.rules.noClopen && prev.endMin>=19*60 && cur.startMin<=9*60)
          push("warn","Clopening — "+e.name, "Closes "+DSHORT[prev.dow]+" and opens "+DSHORT[cur.dow]+".", {date:cur.date,empId:e.id});
      }
    }
    let run=0,best=0;
    dates.forEach(({date})=>{ if(byDate[date]){run++;best=Math.max(best,run);} else run=0; });
    if(lim.maxConsecDays && best>lim.maxConsecDays)
      push("warn","Too many days in a row — "+e.name, best+" consecutive days (limit "+lim.maxConsecDays+").", {empId:e.id});

    /* break law compliance */
    if(S.rules.breakMode==="assigned"){
      mine.forEach(a=>{
        const b=a.breaks; if(!b) return;
        const owedM = b.owed.meals, gotM = b.meals.filter(m=>!m.waived).length;
        if(owedM>gotM)
          push("crit","Missing meal period — "+e.name, DSHORT[a.dow]+" "+fmtHrs(a.endMin-a.startMin)+" shift needs "+owedM+" meal period"+(owedM>1?"s":"")+" under "+L.name+" rules. "+(L.premium||""), {date:a.date,empId:e.id});
        b.meals.forEach(m=>{
          if(!m.waived && m.start>m.deadline)
            push("crit","Late meal period — "+e.name, DSHORT[a.dow]+" meal starts "+m2disp(m.start)+", must begin by "+m2disp(m.deadline)+". "+(L.premium||""), {date:a.date,empId:e.id});
          if(m.waived && !m.waivable)
            push("crit","Invalid meal waiver — "+e.name, DSHORT[a.dow]+" shift is too long for the meal to be waived under "+L.name+" rules.", {date:a.date,empId:e.id});
        });
        if(b.owed.rests > b.rests.length && S.rules.restMode==="assigned")
          push("warn","Rest breaks short — "+e.name, DSHORT[a.dow]+" owes "+b.owed.rests+" paid rest break"+(b.owed.rests>1?"s":"")+", "+b.rests.length+" placed.", {date:a.date,empId:e.id});
      });
    }
  });

  /* If you close for lunch, say plainly who couldn't eat then */
  if(mealPlan()==="closed" && S.rules.breakMode==="assigned"){
    const c=lunchClosure(), odd={};
    wk.assignments.forEach(a=>{
      const m=(a.breaks&&a.breaks.meals||[])[0];
      if(!m || m.waived) return;
      if(m.start!==c.from){
        const e=empById(a.empId); if(!e) return;
        (odd[e.id]=odd[e.id]||{name:e.name, at:[]}).at.push(DSHORT[a.dow]+" "+m2disp(m.start));
      }
    });
    const who=Object.values(odd);
    if(who.length)
      push("info","Eating outside the lunch closure",
        who.map(x=>x.name.split(" ")[0]+" ("+x.at.slice(0,3).join(", ")+")").join("; ")+
        ". Their shift starts too early or too late for a meal at "+m2disp(c.from)+
        " to be legal, so each keeps a compliant time of its own.");
  }

  const order={crit:0,warn:1,info:2};
  return V.sort((a,b)=>order[a.sev]-order[b.sev]);
}

const BUG_KINDS=[
  ["wrong",  "The schedule it built is wrong",     "Someone's on a shift they shouldn't be, or a rule was ignored"],
  ["missing","Something should have been filled",  "A shift was left open that you think could have been covered"],
  ["stuck",  "A button or screen didn't work",     "Nothing happened, or it did the wrong thing"],
  ["look",   "Something looks broken",             "Text cut off, overlapping, unreadable on this screen"],
  ["slow",   "It was slow or froze",               ""],
  ["lost",   "Something I entered disappeared",    ""],
  ["idea",   "Not a fault — an idea",              "Something you wish it did"]
];
const bugKind = k => BUG_KINDS.find(x=>x[0]===k) || BUG_KINDS[0];

/* What the report needs to be useful, and nothing about anybody by name. */
function bugContext(){
  const wk = peekWeek(S.currentWeek);
