/* ============================================================
   View: All schedules — every week you've worked on
   ============================================================ */
function weekStats(ws){
  const wk=peekWeek(ws);
  const mins=wk.assignments.reduce((t,a)=>t+paidMinutes(a),0);
  const cur=S.currentWeek; S.currentWeek=ws;
  const open=openSlots(ws).length;
  const V=validate(ws);
  S.currentWeek=cur;
  const want=weekDates(ws).reduce((t,d)=>t+expandDemand(d.dow,ws).length,0);
  return {wk, mins, open, want, crit:V.filter(v=>v.sev==="crit").length, warn:V.filter(v=>v.sev==="warn").length,
    people:new Set(wk.assignments.map(a=>a.empId)).size};
}
function weekState(ws){
  const wk=S.weeks[ws];
  if(!wk || !wk.assignments.length) return "unstarted";
  return wk.published? "posted" : "draft";
}
function vWeeks(){
  const today=weekStartOf(ymd(new Date()), S.org.weekStart);
  const known=Object.keys(S.weeks).filter(k=>S.weeks[k].assignments.length || S.weeks[k].note || S.weeks[k].patternId);
  /* always show a runway of upcoming weeks even if untouched */
  const runway=[]; for(let i=0;i<8;i++) runway.push(addDays(today,i*7));
  const all=[...new Set(known.concat(runway))].sort();
  const drafts=all.filter(k=>weekState(k)==="draft");
  const posted=all.filter(k=>weekState(k)==="posted");

  const row=(ws)=>{
    const st=weekStats(ws), state=weekState(ws), wk=S.weeks[ws]||{};
    const daysOut=Math.round((parseYmd(ws)-parseYmd(today))/86400000/7);
    const isNow = ws===S.currentWeek;
    return `<div class="wkrow ${state} ${isNow?"here":""}" data-open="${ws}">
      <div class="wkwhen">
        <strong>${prettyDate(ws)} – ${prettyDate(addDays(ws,6))}</strong>
        <div class="mini">${daysOut===0?"this week":daysOut===1?"next week":daysOut<0?Math.abs(daysOut)+" weeks ago":"in "+daysOut+" weeks"}${patternFor(ws)? " · "+esc(patternName(ws)) : ""}</div>
        ${wk.note? `<div class="wknote">${esc(wk.note)}</div>`:""}
      </div>
      <div class="wkstate">
        ${state==="posted"? `<span class="chip ok">posted</span><div class="mini">${wk.publishedAt? new Date(wk.publishedAt).toLocaleDateString():""}</div>`
          : state==="draft"? `<span class="chip acc">draft</span><div class="mini">${wk.generatedAt? "worked on "+new Date(wk.generatedAt).toLocaleDateString():""}</div>`
          : `<span class="chip">nothing yet</span>`}
      </div>
      <div class="wkfacts">
        ${state==="unstarted"? `<span class="mini">${st.want} shift${st.want===1?"":"s"} would be needed</span>`
          : `<span class="mono">${st.wk.assignments.length}/${st.want} shifts</span>
             <span class="mono">${fmtHrs(st.mins)}</span>
             <span class="mono">${st.people} people</span>
             ${st.open? `<span class="chip crit">${st.open} open</span>`:""}
             ${!st.open && st.crit? `<span class="chip crit">${st.crit} to fix</span>`:""}
             ${!st.open && !st.crit? `<span class="chip ok">clean</span>`:""}`}
      </div>
      <div class="wkacts">
        <button class="btn sm" data-goweek="${ws}">Open</button>
        <button class="btn sm ghost" data-wkmenu="${ws}">⋯</button>
      </div>
    </div>`;
  };

  const monthMode=(S.ui&&S.ui.schedView)==="month";
  const monthHtml=(function(){
    if(!monthMode) return "";
    const anchor=S.ui.monthAnchor || (S.currentWeek||ymd(new Date())).slice(0,7);
    const [Y,M]=anchor.split("-").map(Number);
    const first=new Date(Y, M-1, 1), label=first.toLocaleDateString([], {month:"long", year:"numeric"});
    const firstDow=first.getDay(), dim=new Date(Y, M, 0).getDate();
    const todayY=ymd(new Date());
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push('<div class="mcell off"></div>');
    for(let d=1; d<=dim; d++){
      const dateStr=Y+"-"+String(M).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const dow=new Date(Y,M-1,d).getDay();
      const wsOf=weekStartOf(dateStr, S.org.weekStart);
      const wk=S.weeks[wsOf];
      const n=wk? wk.assignments.filter(a=>a.date===dateStr).length : 0;
      const state=wk&&wk.published? "posted" : n? "draft" : "";
      const closed=S.hours[dow].closed;
      const hol=(S.holidays.list||[]).find(h=>h.date===dateStr);
      cells.push(`<button class="mcell ${state} ${closed?"closed":""} ${dateStr===todayY?"today":""}" data-mday="${dateStr}">
        <span class="md">${d}</span>
        ${hol? `<span class="mh" title="${esc(hol.name)}">★</span>`:""}
        ${closed? `<span class="mn">closed</span>` : n? `<span class="mn">${n} shift${n===1?"":"s"}</span>` : `<span class="mn faint">—</span>`}
      </button>`);
    }
    return `<div class="card"><header>
        <button class="btn sm" id="mprev">←</button>
        <h3 style="flex:1;text-align:center">${label}</h3>
        <button class="btn sm" id="mnext">→</button></header>
      <div class="body">
        <div class="mgrid mhead">${DSHORT.map(d=>`<div>${d}</div>`).join("")}</div>
        <div class="mgrid">${cells.join("")}</div>
        <div class="legend" style="margin-top:10px"><span><i style="background:var(--ok)"></i>posted</span><span><i style="background:var(--accent)"></i>drafted</span><span>★ holiday · tap a day to open its sheet</span></div>
      </div></div>`;
  })();

  return `
  <div class="stack">
    <div class="banner info"><div><b>Every week you've touched, and what state it's in.</b> Drafts are yours alone until you post one — work on several at once and let them go up whenever each is ready. Nothing here is posted by accident: posting is always a deliberate press.</div></div>
    <div class="row" style="justify-content:flex-end">
      <div class="seg"><button data-schedview="list" aria-pressed="${!monthMode}">Weeks</button><button data-schedview="month" aria-pressed="${monthMode}">Month</button></div>
    </div>
    ${monthMode? monthHtml : ""}${monthMode? "" : `

    <div class="hgrid">
      <div class="tile" style="cursor:default"><span class="tn">${drafts.length}</span><span class="tlab">drafts on the go</span>
        <span class="td">${drafts.filter(k=>weekStats(k).open).length} with a gap still open</span></div>
      <div class="tile good" style="cursor:default"><span class="tn">${posted.length}</span><span class="tlab">posted</span>
        <span class="td">locked and visible to staff</span></div>
      <div class="tile" style="cursor:default"><span class="tn">${all.filter(k=>weekState(k)==="unstarted").length}</span><span class="tlab">not started</span>
        <span class="td">in the next eight weeks</span></div>
    </div>

    ${all.filter(k=>weekState(k)==="unstarted").length? `<div class="card">

    </div>`:""}`}

}
WIRE.weeks = root=>{
  root.querySelectorAll("[data-schedview]").forEach(b=>b.onclick=()=>{ S.ui.schedView=b.dataset.schedview; save(); render(); });
  root.querySelectorAll("[data-mday]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.mday;
    S.currentWeek=weekStartOf(d, S.org.weekStart); DAYVIEW=parseYmd(d).getDay(); save(); go("day");
  });
  const mp=root.querySelector("#mprev"), mn=root.querySelector("#mnext");
  const shift=(dir)=>{ const a=S.ui.monthAnchor || (S.currentWeek||ymd(new Date())).slice(0,7);
    let [Y,M]=a.split("-").map(Number); M+=dir; if(M<1){M=12;Y--;} if(M>12){M=1;Y++;}
    S.ui.monthAnchor=Y+"-"+String(M).padStart(2,"0"); save(); render(); };
  if(mp) mp.onclick=()=>shift(-1);
  if(mn) mn.onclick=()=>shift(1);
  root.querySelectorAll("[data-goweek]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    S.currentWeek=b.dataset.goweek; save(); go("week");
  });
  root.querySelectorAll(".wkrow").forEach(r=>r.onclick=()=>{ S.currentWeek=r.dataset.open; save(); go("week"); });
  root.querySelectorAll("[data-wkmenu]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); weekMenu(b.dataset.wkmenu); });
  const pa=root.querySelector("#wkpostall");
  if(pa) pa.onclick=()=>{
    const drafts=Object.keys(S.weeks).filter(k=>weekState(k)==="draft");
    modal("Post "+drafts.length+" drafts?", `
      <div class="stack">
        <p class="whead">All of these go up at once and lock. Anything still open stays open — posting doesn't fill it.</p>
        <div class="stack" style="gap:6px">${drafts.map(k=>{ const st=weekStats(k);
          return `<div class="fixopt"><span class="fixk ${st.open?"deny":"free"}">${st.open? st.open+" open":"clean"}</span>
            <div style="flex:1"><strong>${prettyDate(k)} – ${prettyDate(addDays(k,6))}</strong>
              <div class="mini">${st.wk.assignments.length} shifts · ${fmtHrs(st.mins)}</div></div></div>`;}).join("")}</div>
      </div>`,
      `<button class="btn" data-close>Cancel</button><button class="btn primary" id="pallgo">Post them all</button>`,
      r=>{ r.querySelector("#pallgo").onclick=()=>{
        drafts.forEach(k=>{ const wk=S.weeks[k]; wk.published=true; wk.publishedAt=Date.now(); wk.postedOnce=true; snapWeek(wk);
          wk.assignments.forEach(a=>a.locked=true); });
        save(); closeModal(); render(); toast(drafts.length+" weeks posted"); }; });
  };
};

        <input type="text" id="wknoteinp" value="${esc(wk.note||"")}" placeholder="Waiting on Marcus before this goes up">

      </div>

      r.querySelector("#wknoteinp").addEventListener("change",()=>{ commitNote(); save(); });
      const on=(id,fn)=>{ const b=r.querySelector(id); if(b) b.onclick=()=>{ commitNote(); fn(); }; };
      on("#wkopen",()=>{ S.currentWeek=ws; save(); closeModal(); go("week"); });
      on("#wkredraft",()=>{
        const w=getWeek(ws); w.published=false; delete w.publishedAt;
        w.assignments=w.assignments.filter(a=>a.locked);
        const res=generateSchedule(ws); w.suggested=true; w.touched=true;
        S.currentWeek=ws; save(); closeModal(); render();
        toast(res.filled+" shifts drafted"+(res.perDiem? " · "+res.perDiem+" per diem called in":"")+(res.unfilled.length? ", "+res.unfilled.length+" left open":""));

      on("#wkfix",()=>{ S.currentWeek=ws; closeModal(); fixModal(ws); });
      on("#wkdup",()=>{ closeModal(); duplicateWeekModal(ws); });
      on("#wkpost",()=>{ const changes=weekDiff(ws); closeModal(true);
        repostGuard(ws, choice=>{ const w=getWeek(ws); w.published=true; w.publishedAt=Date.now(); w.postedOnce=true; snapWeek(w);
          w.assignments.forEach(a=>a.locked=true); save(); render(); toast("Posted"); repostNotify(ws, choice, changes); }); });
      on("#wkunpost",()=>{ const w=getWeek(ws); w.published=false; w.assignments.forEach(a=>a.locked=false);
        save(); closeModal(); render(); toast("Unposted — open for edits"); });
      on("#wkclear",()=>{
        const w=getWeek(ws); w.assignments=[]; w.unfilled=[]; w.touched=true; w.suggested=false; w.auto=false;
        w.published=false; delete w.publishedAt;
        save(); closeModal(); render(); toast("Draft cleared");
      });
      on("#wkdelete",()=>{
        modal("Delete this week?", `<p>Everything in the week of ${esc(prettyDate(ws))} goes — the shifts, the note, the shape you picked. Open it again later and it starts from scratch.</p>`,

            save(); closeModal(); render(); toast("Week deleted"); }; });
      });
    });
}

function duplicateWeekModal(from){
  const today=weekStartOf(ymd(new Date()), S.org.weekStart);
  const opts=[]; for(let i=0;i<12;i++){ const k=addDays(today,i*7); if(k!==from) opts.push(k); }
  modal("Copy this week somewhere else", `
    <div class="stack">
      <p class="whead">Same people on the same shifts, moved to another week. Anything already posted there is left alone.</p>
      <div class="field"><label>Copy it to</label><select id="dupto">
        ${opts.map(k=>`<option value="${k}">${prettyDate(k)} – ${prettyDate(addDays(k,6))}${weekState(k)!=="unstarted"? " · "+weekState(k):""}</option>`).join("")}
      </select></div>
      <label class="switch"><input type="checkbox" id="dupclear" checked> Replace whatever's there</label>
    </div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="dupgo">Copy it</button>`,
    r=>{ r.querySelector("#dupgo").onclick=()=>{
      const to=r.querySelector("#dupto").value;
      const dst=getWeek(to);
      if(dst.published){ toast("That week is posted — unpost it first"); return; }
      const src=getWeek(from);
      const shift=Math.round((parseYmd(to)-parseYmd(from))/86400000);
      if(r.querySelector("#dupclear").checked) dst.assignments=[];
      src.assignments.forEach(a=>{
        const c=Object.assign({},a,{id:uid("a"), date:addDays(a.date,shift), locked:false});
        applyBreaks(c); dst.assignments.push(c);
      });
      if(src.patternId) dst.patternId=src.patternId;
      dst.assignments.sort((x,y)=>x.date.localeCompare(y.date)||x.startMin-y.startMin);
      dst.generatedAt=Date.now(); dst.touched=true; dst.suggested=false;
      S.currentWeek=to; save(); closeModal(); render();
      toast("Copied to "+prettyDate(to));
    }; });
}

/* The pass a manager makes before a schedule goes up. */
function reviewCard(ws, wk, V, crit, warn, wantSlots, roster){
  const daysOut = Math.round((parseYmd(ws)-parseYmd(ymd(new Date())))/86400000);
  if(!roster.length || !wantSlots) return `<div class="banner warn"><div><b>Nothing to schedule yet.</b>
    ${!roster.length?"Add people under Team. ":""}${!wantSlots?"Then say how many of each shift you need under Coverage needs.":""}</div>
    <button class="btn sm" data-go="${!roster.length?"team":"demand"}" style="flex:none;margin-left:auto">${!roster.length?"Add people":"Set coverage"}</button></div>`;

  if(wk.published) return `<div class="banner info"><div><b>Posted.</b> This week went up ${wk.publishedAt? new Date(wk.publishedAt).toLocaleDateString():""}${daysOut>=0?", "+daysOut+" days ahead of the first shift":""}. Every shift is locked, so a stray click can't rewrite what people have planned around.</div>
    <button class="btn sm" id="wunpost" style="flex:none;margin-left:auto">Unpost to edit</button></div>`;

      ${looks.length? `<div class="stack" style="gap:7px">

          <span class="sv ${l.sev}"></span>
          <div style="flex:1"><strong>${esc(l.t)}</strong><div class="mini">${esc(l.d)}</div></div>

    </div>

/* Cover a dip by stretching a shift already on the day — the missing member of
   the fix family: keep someone later, or bring someone in earlier, with the
   overtime consequence stated up front. Only ever touches shifts on that day,
   never invents one, and never breaks the longest-shift rule. */
function stretchOptions(date, ws, g){
  const wk=S.weeks[ws]; if(!wk) return [];
  const maxLen=(S.rules.maxShiftH||12)*60, otLine=(S.org.otWeeklyH||40)*60;
  const out=[];
  wk.assignments.filter(a=>a.date===date && !a.topUp && !a.callout).forEach(a=>{
    const e=empById(a.empId); if(!e||!e.active) return;
    /* ends at or before the dip starts — keep them later, through the dip */
    if(a.endMin<=g.from && g.to-a.endMin<=300){
      const add=g.to-a.endMin;
      if((a.endMin+add)-a.startMin<=maxLen && add>0)
        out.push({aId:a.id, e, side:"end", add, newT:a.endMin+add,
          label:"Keep "+e.name+" until "+m2disp(a.endMin+add)});
    }
    /* starts at or after the dip ends — bring them in earlier */
    if(a.startMin>=g.to && a.startMin-g.from<=300){
      const add=a.startMin-g.from;
      if(a.endMin-(a.startMin-add)<=maxLen && add>0)
        out.push({aId:a.id, e, side:"start", add, newT:a.startMin-add,
          label:"Bring "+e.name+" in at "+m2disp(a.startMin-add)});
    }
  });
  out.forEach(o=>{
    const wkMin=empWeekMinutes(o.e.id, ws);
    o.ot=(wkMin+o.add)>otLine;
    o.cost=(costOn()&&o.e.rate)? (o.add/60)*o.e.rate*(o.ot?1.5:1) : null;
  });
  /* least impact first: regular time before overtime, shorter stretch before longer */
  return out.sort((x,y)=>(x.ot-y.ot)||(x.add-y.add)).slice(0,4);
}
function stretchModal(date, ws, g){
  const opts=stretchOptions(date, ws, g);
  if(!opts.length) return;
  modal("Cover "+m2disp(g.from)+" – "+m2disp(g.to), `
    <div class="stack">
      <div class="help">${esc(g.labels.join(" · "))}. These stretch a shift already on the day — nothing new is invented, and the longest-shift rule still holds.</div>
      ${opts.map((o,i)=>`<button class="btn ${i===0?"bestfix":""}" data-stretch="${i}" style="justify-content:flex-start;text-align:left">
        <span><b>${esc(o.label)}</b>${i===0?' <span class="chip acc">Recommended — least impact</span>':""}
        <span class="mini" style="display:block">+${fmtHrs(o.add)} ${o.ot? "at overtime":"at regular time"}${o.cost? " · about "+money(o.cost):""}</span></span>
      </button>`).join("")}
    </div>`,
    `<button class="btn" data-close>Leave it open</button>`,
    (r)=>{
      r.querySelectorAll("[data-stretch]").forEach(b=>b.onclick=()=>{
        const o=opts[+b.dataset.stretch];
        const wk=S.weeks[ws]; const a=wk.assignments.find(x=>x.id===o.aId);
        if(!a){ toast("That shift changed — take another look"); closeModal(true); return; }
        if(o.side==="end") a.endMin=o.newT; else a.startMin=o.newT;
        a.locked=true; a.extended=true;
        staggerDay(wk.assignments.filter(x=>x.date===date && !x.locked), wk.assignments.filter(x=>x.date===date));
        save(); closeModal(true); render();
        toast(o.label+" — breaks re-checked"+(o.ot? ", overtime noted":""));
      });
    });
}
function collapseGaps(pts){
  const out=[]; let cur=null;
  pts.forEach(p=>{
    const labels = p.detail.map(d=>(d.rule.label||roleName(d.rule.roleId))+": "+d.have+" of "+d.need);
    if(cur && p.t===cur.to){ cur.to=p.t+STEP; labels.forEach(l=>{ if(!cur.labels.includes(l)) cur.labels.push(l); }); }
    else { cur={from:p.t,to:p.t+STEP,labels}; out.push(cur); }
  });
  return out;
}

async function saveFile(filename, data){
  try{
    const blob = data instanceof Blob? data : new Blob([data],{type:"text/plain"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("Saved "+filename); return true;
  }catch(e){ toast("Your browser blocked that download."); return false; }
}
function csvRow(arr){ return arr.map(v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }).join(","); }

function jsPDFReady(){
  if(typeof window.jspdf==="undefined" || !window.jspdf.jsPDF) return false;
  const J=window.jspdf.jsPDF;
  return !!((J.API && typeof J.API.autoTable==="function") || (J.prototype && J.prototype.autoTable));
}
function pdfUnavailable(){
  toast("The PDF engine hasn't loaded — the CSV and printable HTML exports still work.");
}
function newDoc(orient){

}

function shiftPresets(open, close, always){
  const o=t2m(open); let c=t2m(close); if(c<=o) c+=1440;
  const span=c-o;
  const mk=(label,a,b,desire)=>({label,start:m2t(Math.round(a/15)*15),end:m2t(Math.round(b/15)*15),desire});
  const len=Math.min(span,8.5*60), midStart=o+(span-len)/2;
  const list=[];
  list.push({id:"one", t:"One shift covers the day", d:"Everybody works the same window.", shifts:[mk("Day",o,c,0)]});
  list.push({id:"openclose", t:"An opening and a closing shift", d:"Two overlapping shifts that between them cover the day.",
    shifts:[mk("Opening",o,o+len,2), mk("Closing",c-len,c,-2)]});
  list.push({id:"three", t:"Opening, mid, and closing", d:"Three overlapping shifts with the heaviest cover in the middle.",
    shifts:[mk("Opening",o,o+len,2), mk("Mid",midStart,midStart+len,1), mk("Closing",c-len,c,-2)]});
  list.push({id:"halves", t:"Two halves, morning and afternoon", d:"Split the day down the middle — good for shorter shifts.",
    shifts:[mk("Morning",o,o+span/2,1), mk("Afternoon",o+span/2,c,-1)]});
  if(always) list.push({id:"roundclock", t:"Three eight-hour shifts, round the clock", d:"Day, evening and night.",
    shifts:[mk("Day",7*60,15*60,2), mk("Evening",15*60,23*60,-1), mk("Night",23*60,31*60,-2)]});
  list.push({id:"none", t:"I'll set my own up later", d:"Skip this and build shifts by hand.", shifts:[]});
  return list;
}
/* Spread a day's demand across shifts and buckets up to what the team can actually cover. */
function wizDefaultDemand(nShifts, nRoles, capacity){
  const grid={}; let total=0;
  for(let i=0;i<nShifts;i++){ grid[i+":0"]=1; total++; }
  outer:
  for(let r=1;r<nRoles;r++) for(let i=0;i<nShifts;i++){
    if(total>=capacity) break outer;
    grid[i+":"+r]=1; total++;
  }
  return {grid,total};
}

      if(!people.length) return `<div class="stack"><p class="whead">Add some names first and this comes to life.</p></div>`;
      const anyOff = Object.values(W.dayOff||{}).some(a=>a&&a.length);
      return `
      <div class="stack">
        <p class="whead">Standing commitments, not one-off requests. If Kenny is at college every Wednesday and never works Saturdays, switch those two off and the scheduler will never put him there — this week or any week after.</p>

          <thead><tr><th style="width:190px">Who</th><th>Days they can work</th></tr></thead>
          <tbody>${people.map(pn=>{ const key=pn.b+":"+pn.i, off=(W.dayOff||{})[key]||[];
            return `<tr><td><strong>${esc(pn.name)}</strong><div class="mini">${esc(W.buckets[pn.b]||"")}</div></td>
              <td><div class="dayrow">${DAYS.map((d,i)=>`
                <button type="button" class="daytog ${off.includes(i)?"":"on"}" data-k="${key}" data-d="${i}"
                  title="${esc(d)}">${DSHORT[i]}</button>`).join("")}</div></td></tr>`;
          }).join("")}</tbody></table></div>
        <div class="banner info" id="wdaysum"><div>${anyOff
          ? "<b>Standing days off recorded.</b> "+esc(people.filter(pn=>((W.dayOff||{})[pn.b+":"+pn.i]||[]).length)
              .map(pn=>pn.name.split(" ")[0]+" (no "+((W.dayOff||{})[pn.b+":"+pn.i]||[]).map(i=>DSHORT[i]).join("/")+")").join(", "))
          : "<b>Everyone's free every day so far.</b> That's fine — switch off any day someone genuinely can't do, and skip the rest."}</div></div>
        <div class="help">This is for the permanent stuff. A one-week holiday or a single Tuesday off goes in as a request instead — you'll get to that in a moment, and there's a page for it afterwards.</div>
      </div>`;
    }
    if(k==="shifts"){
      const presets=shiftPresets(W.hoursPreset==="always"?"00:00":W.open, W.hoursPreset==="always"?"23:59":W.close, W.hoursPreset==="always");
      const cur=curShifts();
      return `
      <div class="stack">
        <p class="whead">Named shifts are the ones you use over and over — the times are worked out from your hours, and the names are yours to change.</p>
        <div class="wopts">${presets.map(x=>opt("shiftPreset",x.id,W.shiftPreset,x.t,x.d)).join("")}</div>
        ${cur.shifts.length? `<div class="stack" style="gap:6px">
          ${cur.shifts.map((sh,i)=>`<div class="desrow">
            <input type="text" class="wsl" data-i="${i}" value="${esc((W.shifts[i]&&W.shifts[i].label)||sh.label)}" style="width:150px">
            <input type="time" class="wss" data-i="${i}" value="${(W.shifts[i]&&W.shifts[i].start)||sh.start}" style="width:120px">
            <span class="mini">to</span>
            <input type="time" class="wse" data-i="${i}" value="${(W.shifts[i]&&W.shifts[i].end)||sh.end}" style="width:120px">
            <span class="mini" style="margin-left:auto">${esc(DESIRE_LABEL[sh.desire]||"Neutral")}</span>
          </div>`).join("")}
          <div class="help">Wanted / unwanted is a first guess from the shape — it's what decides who gets first claim later. Change it any time under Shift priority.</div>
        </div>`:""}
      </div>`;
    }
    if(k==="need"){
      const cur=curShifts();
      const buckets=W.buckets.slice(0,W.bucketCount).filter(Boolean);
      if(!cur.shifts.length) return `<div class="stack"><p class="whead">You skipped shifts, so there's nothing to size yet. Build them under Roles &amp; shifts and then set the numbers under Coverage needs.</p></div>`;
      const names2=allNames().length||W.headcount||1;
      const openDays = W.hoursPreset==="wkday"? 5 : (7 - (W.hoursPreset==="wkend"? ((W.satClosed?1:0)+(W.sunClosed?1:0)) : 0));
      const capacity = Math.max(1, Math.floor(names2*4.6/Math.max(1,openDays)));
      const def = wizDefaultDemand(cur.shifts.length, Math.max(1,buckets.length), capacity).grid;
      const perDay = cur.shifts.reduce((t,_,i)=> t + (buckets.length?buckets:["Staff"]).reduce((u,__,ri)=>
        u + (W.perShift[i+":"+ri]!=null? +W.perShift[i+":"+ri] : (def[i+":"+ri]||0)),0),0);
      const tight = perDay > capacity;
      return `
      <div class="stack">
        <p class="whead">On a normal open day, how many people from each bucket do you want on each shift? This is exactly what the scheduler will fill.</p>
        ${cur.shifts.map((sh,i)=>`<div class="stack" style="gap:6px;border:1px solid var(--line);border-radius:7px;padding:10px 12px">
          <div class="row"><strong style="font-family:Archivo,sans-serif">${esc((W.shifts[i]&&W.shifts[i].label)||sh.label)}</strong>
            <span class="mini mono">${m2disp(t2m((W.shifts[i]&&W.shifts[i].start)||sh.start))}–${m2disp(t2m((W.shifts[i]&&W.shifts[i].end)||sh.end))}</span></div>
          <div class="grid3">${(buckets.length?buckets:["Staff"]).map((r,ri)=>`
            <div class="field"><label>${esc(r)}</label>
              <input type="number" class="wneed" data-s="${i}" data-r="${ri}" min="0" max="20"
                value="${W.perShift[i+":"+ri]!=null? W.perShift[i+":"+ri] : (def[i+":"+ri]||0)}"></div>`).join("")}</div>
        </div>`).join("")}
        <div class="field"><label>Is that a target, or a floor?</label>
          <div class="wopts">${
            opt("fillMode","demand",W.fillMode,"Schedule exactly that many","Anyone not needed simply isn't scheduled that day.")+
            opt("fillMode","full",W.fillMode,"That's the minimum — also give everyone their contracted hours","For union agreements, government rotas, or anywhere full-timers must be fully scheduled. The extra hands go down as project time.")}</div></div>
        ${W.fillMode==="full"? `
        <div class="field"><label>What do you call that extra time?</label>
          <input type="text" data-w="topUpLabel" value="${esc(W.topUpLabel)}" placeholder="Project time"></div>
        <div class="field"><label>How should it land on the schedule?</label>
          <div class="wopts">${
            opt("projectShape","chunk",W.projectShape,"In blocks — half a day or a whole day","An hour here and an hour there rarely gets anything finished. This keeps it together and puts the days next to each other where it can.")+
            opt("projectShape","spread",W.projectShape,"Wherever it fits","Shorter pieces, spread across the week. Fine if the work is the kind you can pick up and put down.")}</div></div>
        <div class="field"><label>And who should get it?</label>
          <div class="wopts">${
            opt("projectShare","fair",W.projectShare,"Share it round","Everyone eligible takes a turn.")+
            opt("projectShare","best",W.projectShare,"Stack it on your best people","Fill up whoever you mark as first in line before anyone else gets any.")}</div>
          <span class="mini">You'll mark who's first in line — and who should stay on the floor — on each person's profile.</span></div>`:""}
        <div class="banner ${(tight&&W.fillMode!=="full")?"warn":"info"}"><div>${(tight&&W.fillMode!=="full")
          ? "<b>That's more than your team can cover.</b> "+perDay+" a day across "+openDays+" open days is about "+(perDay*openDays)+" shifts a week, and "+names2+" people can realistically cover around "+(capacity*openDays)+". The scheduler will leave the extras open and tell you why — but it's worth trimming now."
          : "<b>"+perDay+" shift"+(perDay===1?"":"s")+" a day, about "+(perDay*openDays)+" a week.</b> "+names2+" people can cover roughly "+(capacity*openDays)+", so that fits."}</div></div>
      </div>`;
    }
    if(k==="hols"){
      if(!W.hols){ W.hols={}; holidayCandidates().forEach(h=>{ W.hols[h.key]=wizHolDefault(h); }); }
      const C=holidayCandidates();
      const shut=C.filter(h=>W.hols[h.key]==="closed").length;
      const light=C.filter(h=>W.hols[h.key]==="reduced").length;
      const norm=C.filter(h=>W.hols[h.key]==="normal").length;
      return `
      <div class="stack">
        <p class="whead">Every business keeps its own holidays. Say what each day looks like for you —
          the ones you're closed for are never scheduled and nobody is asked to work them; the rest go into
          the holiday poll so the days people least mind working land fairly.</p>
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:2px">
          <button type="button" class="btn sm" data-hall="skip">None of these</button>
          <button type="button" class="btn sm" data-hall="normal">All normal hours</button>
          <button type="button" class="btn sm" data-hall="closed">Closed for all</button>
        </div>
        <div class="stack" style="gap:6px">${C.map(h=>`
          <div class="desrow">
            <div style="min-width:0;flex:1">
              <strong style="font-family:Archivo,sans-serif;font-size:13px">${esc(h.name)}</strong>
              <div class="mini mono">${esc(prettyDate(h.date))}</div>
            </div>
            <select data-hol="${esc(h.key)}" style="margin-left:auto;max-width:190px">
              <option value="skip" ${W.hols[h.key]==="skip"?"selected":""}>Doesn't apply</option>
              <option value="closed" ${W.hols[h.key]==="closed"?"selected":""}>Closed</option>
              <option value="reduced" ${W.hols[h.key]==="reduced"?"selected":""}>Open, fewer people</option>
              <option value="normal" ${W.hols[h.key]==="normal"?"selected":""}>Open, normal hours</option>
            </select>
          </div>`).join("")}</div>
        <div class="banner info"><div><b>${shut} closed · ${light} lighter · ${norm} normal.</b>
          ${light? "For the lighter days a reduced pattern is set up for you — about half your usual cover — and you can fine-tune it on the Holidays page. ":""}
          Anything you skip can be added later, and a holiday you observe that isn't listed can be added by hand.</div></div>
      </div>`;
    }
    if(k==="posts") return `
      <div class="stack">
        <p class="whead">Some floors run on posts — the typing window, the checking bench, the front counter —
          and people move between them during the day. This is separate from who works when:
          <b>posts never appear on the weekly schedule, only on the day sheet.</b> Skip it if your floor doesn't work that way.</p>
        <div class="field"><label>Your posts — one per line</label>
          <textarea id="wposts" rows="5" placeholder="Typist 1&#10;Typist 2&#10;Checker 1&#10;Checker 2&#10;Front counter">${esc(W.posts||"")}</textarea>
          <span class="mini">Leave it empty if you don't assign posts. Numbered posts like <b>Typist 1</b> and <b>Typist 2</b> are treated as one rotation called Typist.</span></div>
        ${(W.posts||"").trim()? `
        <div class="field"><label>How long does someone hold a post?</label>
          <select id="wpspan">
            <option value="day" ${W.postSpan==="day"?"selected":""}>All day — one post each</option>
            <option value="half" ${W.postSpan==="half"?"selected":""}>Half a day, then everyone moves</option>
            <option value="2h" ${W.postSpan==="2h"?"selected":""}>Every 2 hours</option>
            <option value="3h" ${W.postSpan==="3h"?"selected":""}>Every 3 hours</option>
            <option value="4h" ${W.postSpan==="4h"?"selected":""}>Every 4 hours</option>
          </select>
          <span class="mini">${W.postSpan==="day"
            ? "Each person keeps one post for their whole shift."
            : "The day is split into blocks and people swap posts at each change — the day sheet prints the times, so everyone can see where they are and when."}</span></div>
        <div class="field"><label>Numbered posts — one rotation or separate?</label>
          <select id="wpfam">
            <option value="1" ${W.postFam==="1"?"selected":""}>Share one rotation — a turn on Typist 1 counts as a turn on Typist</option>
            <option value="0" ${W.postFam==="0"?"selected":""}>Rotate separately — every post counted on its own</option>
          </select>
          <span class="mini">${W.postFam==="1"
            ? "Whoever typed yesterday is less likely to be typing today, on either number. This is what most floors want."
            : "Posts are drawn independently, so the same person can be on Typist 1 today and Typist 2 tomorrow."}</span></div>
        <div class="field"><label>When someone on a post goes to lunch</label>
          <select id="wprelief">
            <option value="family" ${W.postRelief==="family"?"selected":""}>Someone from the same rotation steps in</option>
            <option value="any" ${W.postRelief==="any"?"selected":""}>Whoever is free steps in</option>
            <option value="none" ${W.postRelief==="none"?"selected":""}>Nobody — the post can sit empty while they eat</option>
          </select>
          <span class="mini">${W.postRelief==="none"
            ? "Nothing is flagged at meal times — fine when a post can simply pause."
            : "The day sheet names the reliever beside every meal, and flags any meal nobody can cover."}</span></div>`:""}
      </div>`;
    if(k==="rules") return `
      <div class="stack">
        <p class="whead">Four things the scheduler will never break. Your meal and rest break law is already handled — this is the rest.</p>
        <div class="field"><label>Least time off between two shifts</label>
          <div class="wopts wcols">${[8,10,12].map(n=>opt("minRest",n,W.minRest,n+" hours","")).join("")}</div></div>
        <div class="field"><label>Most days in a row</label>
          <div class="wopts wcols">${[5,6,7].map(n=>opt("maxConsec",n,W.maxConsec,n+" days","")).join("")}</div></div>
        <div class="field"><label>Closing one night and opening the next morning</label>
          <div class="wopts wcols">${opt("noClopen",true,W.noClopen,"Never","Protects the turnaround")+opt("noClopen",false,W.noClopen,"It's fine","")}</div></div>
        <div class="field"><label>When hours can be made up either way</label>
          <div class="wopts">${
            opt("preferLong",true,W.preferLong,"Fewer, longer shifts","One 8-hour shift instead of two 4-hour ones — fewer handoffs, fewer commutes for the same pay.")+
            opt("preferLong",false,W.preferLong,"Whatever fits best","Short shifts are fine — useful when you cover rushes with overlap shifts.")}</div></div>
        <div class="field"><label>People you keep on call (per diem)</label>
          <div class="wopts">${
            opt("perDiem","ask",W.perDiem,"Ask me each time","A gap suggests them as one of the ways out — you decide instance by instance.")+
            opt("perDiem","auto",W.perDiem,"Use them automatically","When nobody regular can cover, the draft calls them in on its own and tells you who it used.")}</div></div>
        <div class="sep"></div>
        <div class="help">Meals and rest breaks are usually handled differently — plenty of places put lunches on the schedule and leave the short breaks to whoever's on the floor. So they're asked separately.</div>
        <div class="field"><label>Meal periods (the unpaid one)</label>
          <div class="wopts">${
            opt("breakMode","assigned",W.breakMode,"Put a time on the schedule","Each meal is placed inside the legal window and staggered so the floor never empties.")+
            opt("breakMode","lengths",W.breakMode,"Say how long, staff pick when","The sheet shows the length owed and the latest legal start time.")+
            opt("breakMode","self",W.breakMode,"Staff sort it out themselves","The sheet just notes what's owed.")}</div></div>
        ${W.breakMode==="assigned"? `
        <div class="field"><label>And how should those times be picked?</label>
          <div class="wopts">${
            opt("mealPlan","auto",W.mealPlan,"Work them out for me","Staggered across the shift so the floor never empties, always inside the legal window. Most places want this.")+
            opt("mealPlan","slots",W.mealPlan,"We have set lunch times","You name the times — say 11:30, 12:00 and 12:30 — and everyone goes on one of them.")+
            opt("mealPlan","closed",W.mealPlan,"We close for lunch","The doors shut for a set stretch and the whole team eats. Coverage isn't counted against you while you're closed.")}</div>
          ${W.mealPlan==="slots"? `<div class="row" style="margin-top:8px">
            <span class="mini" style="width:100%">The times you use — change or add any of them:</span>
            ${(W.mealSlots||[]).map((t,i)=>`<input type="time" value="${esc(t)}" data-wmslot="${i}" style="width:auto">`).join("")}
            <button type="button" class="btn sm" id="wmadd">Add one</button></div>`:""}
          ${W.mealPlan==="closed"? `<div class="row" style="margin-top:8px">
            <label class="mini">Closed from</label><input type="time" data-w="mealCloseFrom" value="${esc(W.mealCloseFrom)}" style="width:auto">
            <label class="mini">until</label><input type="time" data-w="mealCloseTo" value="${esc(W.mealCloseTo)}" style="width:auto"></div>`:""}
        </div>`:""}
        <div class="field"><label>Does anyone work a rotating pattern?</label>
          <div class="wopts wcols">${
            opt("cycles",false,W.cycles,"No — same every week","The usual. Skip it.")+
            opt("cycles",true,W.cycles,"Yes — some work in cycles","Seven on and seven off, alternating weeks, or hours averaged over a pay period.")}</div>
          <span class="mini">${W.cycles? "You'll set each person's pattern on their profile once you're in." : "Leave this off unless you know you need it — it stays out of the way entirely."}</span></div>
        <div class="field"><label>Who gets paid for a holiday they don't work?</label>
          <div class="wopts wcols">${
            opt("holPay","ft",W.holPay,"Full-timers only","8 hours each")+
            opt("holPay","all",W.holPay,"Everyone","8 hours each")+
            opt("holPay","none",W.holPay,"Nobody","")}</div>
          <span class="mini">Changeable per person afterwards — this just sets the starting point.</span></div>
        <div class="field"><label>Rest breaks (the short paid ones)</label>
          <div class="wopts">${
            opt("restMode","self",W.restMode,"Staff take them when they see fit","The most common setup — the sheet notes how many are owed and leaves the timing alone.")+
            opt("restMode","lengths",W.restMode,"Say how many and how long","No clock times, just what each person is owed.")+
            opt("restMode","assigned",W.restMode,"Put times on the schedule too","Each break is placed near the middle of its stretch of work.")}</div></div>
      </div>`;
    if(k==="pri") return `
      <div class="stack">
        <p class="whead">When two people both fit a shift and it's one everybody wants — or one nobody does — who decides?</p>
        <div class="wopts">${PRI_MODES.map(m=>opt("priority",m[0],W.priority,m[1],m[2])).join("")}</div>
        ${W.priority==="seniority"? `<div class="banner info"><div>Seniority reads each person's start date, which you haven't entered yet. Add them on the profiles later and the ladder sorts itself — until then it falls back to the order you listed people in.</div></div>`:""}
        ${W.priority==="custom"? `<div class="help">The order you typed the names in becomes the starting ladder. Drag it around any time under Shift priority.</div>`:""}
        ${W.priority==="lottery"? `<div class="help">Reshuffled every week from a seed you can re-roll — and the same seed always gives the same order, so it's auditable after the fact.</div>`:""}
        ${W.hoursPreset==="wkday"? "" : `<div class="desrow" style="margin-top:6px">
          <strong style="font-family:Archivo,sans-serif;font-size:13px">And weekends — wanted or not?</strong>
          <select id="wwkend" style="margin-left:auto">
            <option value="unwanted" ${W.weekendDesire==="unwanted"?"selected":""}>Most want them off</option>
            <option value="wanted" ${W.weekendDesire==="wanted"?"selected":""}>People like working them</option>
            <option value="neutral" ${W.weekendDesire==="neutral"?"selected":""}>No different</option>
          </select>
        </div>
        <div class="help">Days nobody wants get rotated the same way — pegged as undesirable, weekend shifts are spread around by the pecking order above instead of landing on the same people every week. Adjustable per day later under Shift priority.</div>`}
      </div>`;
    if(k==="cost") return `
      <div class="stack">
        <p class="whead">Plenty of managers schedule to hours and let payroll worry about the money. Others want the number in front of them.</p>
        <div class="wopts">${
          opt("trackCost",false,W.trackCost,"Just hours, no money","Nothing about cost appears anywhere. No rate field on anyone's profile.")+
          opt("trackCost",true,W.trackCost,"Show me what it costs","Adds an hourly rate to each profile and a running cost against a weekly budget.")}</div>
        ${W.trackCost? `<div class="field" style="max-width:260px"><label>Weekly labor budget (optional)</label>
          <input type="number" id="wbud" min="0" step="50" value="${W.budget||0}"></div>
          <div class="mini">Rates never appear on a printed or exported schedule.</div>`:""}
      </div>`;
    if(k==="extras"){
      const X=(id,on,title,desc)=>`<label class="switch" style="align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px">
        <input type="checkbox" data-x="${id}" ${on?"checked":""} style="margin-top:3px">
        <span style="min-width:0"><b style="font-family:Archivo,sans-serif;font-size:13.5px">${esc(title)}</b>
        <span class="mini" style="display:block">${esc(desc)}</span></span></label>`;
      return `
      <div class="stack">
        <p class="whead">Everything below is included — it's just off unless you want it. Anything switched off
          stays completely out of your way: no extra tabs, no extra questions, nothing on your screens.
          You can turn any of it on later in Settings.</p>
        ${X("xDaySheet", W.xDaySheet, "The daily station sheet",
            "An hour-by-hour sheet for each day showing who's on, their meal and rest times, and their posts — the one you print for the back room.")}
        ${X("xPto", W.xPto, "Time-off balances",
            "Track how much paid time off each person has banked, accruing as they work and counting down as they take it.")}
        ${X("xLic", W.xLic, "License and certification expiry",
            "Put an expiry date on each person's license. The drafter never schedules anyone past a lapsed one, and warns you 30 days out.")}
        ${X("xCycles", W.xCycles, "Work patterns like 7 on, 7 off",
            "For staff who don't work the same shape every week — alternating weeks, seven on and seven off, or hours averaged over a pay period.")}
        ${X("xNotice", W.xNotice, "Advance-notice warnings",
            "Some cities make short-notice scheduling a payable penalty. Get a warning if you post a week less than 14 days ahead.")}
        ${X("xWaiver", W.xWaiver, "Meal waivers where the law allows them",
            "On short shifts some states let a worker waive their meal in writing. Weeksolved marks the shift; it doesn't collect the signature.")}
        <div class="help">Not listed here but always available once you're in: staff groups with their own limits,
          week patterns for holiday weeks, shift trades, callout logging, and the ranked holiday poll.</div>
      </div>`;
    }
    if(k==="reqs"){
      const people=allNames();
      const cur=curShifts();
      return `
      <div class="stack">
        <p class="whead">Have any requests come in already? Put them in now and the first schedule is drafted around them. You can skip this — Requests is a page you'll live in from here on.</p>
        ${people.length? `<div class="reqform">
          <div class="field" style="min-width:160px"><label>Who</label><select id="wqe">${people.map((pn,i)=>`<option value="${i}">${esc(pn.name)}</option>`).join("")}</select></div>
          <div class="field" style="min-width:180px"><label>Asking for</label><select id="wqk">
            ${REQ_KINDS.filter(x=>["off","avoid","want","shift","noshift","late","early","maxh"].includes(x.k)).map(x=>`<option value="${x.k}">${esc(x.t)}</option>`).join("")}</select></div>
          <div class="field" id="wqd"><label>From</label><input type="date" id="wqf" value="${esc(S.currentWeek)}"></div>
          <div class="field" id="wqd2"><label>To</label><input type="date" id="wqt" value="${esc(S.currentWeek)}"></div>
          <div class="field" id="wqx"></div>
          <div class="field" style="min-width:140px"><label>How firm</label>
            <div class="seg" id="wqh"><button data-v="1" aria-pressed="true">Must</button><button data-v="0" aria-pressed="false">If possible</button></div></div>
          <button class="btn primary" id="wqadd" style="align-self:flex-end">Add</button>
        </div>
        ${W.reqs.length? `<div class="scroll" style="max-height:190px"><table><tbody>
          ${W.reqs.map((r,i)=>`<tr><td><strong>${esc(people[r.pi]?people[r.pi].name:"—")}</strong></td>
            <td>${esc(reqKind(r.kind).t)}</td>
            <td class="mono" style="font-size:12px">${r.kind==="maxh"?"any time":(r.from===r.to?prettyDate(r.from):prettyDate(r.from)+"–"+prettyDate(r.to))}</td>
            <td>${r.hard?'<span class="chip acc">must</span>':'<span class="chip">if possible</span>'}</td>
            <td style="text-align:right"><button class="btn sm danger" aria-label="Remove this request" data-wqdel="${i}">✕</button></td></tr>`).join("")}
        </tbody></table></div>`:`<div class="mini">Nothing added yet — that's fine.</div>`}`
        : `<div class="mini">Add some names first and this comes to life.</div>`}
      </div>`;
    }
    if(k==="handout") return `
      <div class="stack">
        <p class="whead">Once a week is ready, how does it reach the people working it?</p>
        <div class="wopts">${
          opt("sendOut",false,W.sendOut,"However I do it now","Print it, pin it up, put it in the group chat. Weeksolved exports to Excel and PDF either way, and you can turn this on later.")+
          opt("sendOut",true,W.sendOut,"Send it from here, by email or text","One button. Each person gets just their own shifts \u2014 their days, times, meal breaks and station \u2014 or everyone gets the whole week, whichever you pick at the time.")}</div>
        ${W.sendOut? `<div class="banner info"><div><b>You'll need a mobile number or an email for each person.</b>
          Add them on their profile under Team whenever you like \u2014 Weeksolved tells you who's missing one before it sends anything, and skips them rather than failing.</div></div>
          <div class="help">Nothing is sent by Weeksolved itself. It writes the message and opens your own mail or messages app with it ready, so you press send and it comes from you.</div>`

        <div class="help">You can change this any time from the Draft button — and posted weeks are never overwritten.</div>

    /* done */
    const cur=curShifts();
    const people=allNames();
    return `
      <div class="stack">
        <p class="whead">That's everything. Here's what gets built — then it drafts your first schedule straight away.</p>
        <div class="grid2">
          <div class="personcard"><h4>${esc(W.name||"Your business")}</h4>
            <div class="ln"><span>Kind of place</span><b>${esc((BIZ_TYPES.find(x=>x.id===W.biz)||{}).t||"—")}</b></div>
            <div class="ln"><span>Break rules</span><b>${esc((LAW[W.juris]||LAW.NONE).name)}</b></div>
            <div class="ln"><span>Staffing hours</span><b>${esc((HOURS_PRESETS.find(x=>x.id===W.hoursPreset)||{}).t.toLowerCase())}</b></div>
            <div class="ln"><span>Buckets</span><b>${esc(W.buckets.slice(0,W.bucketCount).filter(Boolean).join(", ")||"one")}</b></div>
            <div class="ln"><span>Shifts</span><b>${esc((cur.shifts.map((x,i)=>(W.shifts[i]&&W.shifts[i].label)||x.label).concat(
              W.hoursPreset==="wkend"&&cur.shifts.length? [
                (!W.satClosed && (W.satOpen!==W.open||W.satClose!==W.close))?"Saturday":null,
                (!W.sunClosed && (W.sunOpen!==W.open||W.sunClose!==W.close) && (W.sunOpen!==W.satOpen||W.sunClose!==W.satClose||W.satClosed))?"Sunday":null
              ].filter(Boolean):[])).join(", ")||"none yet")}</b></div>
            <div class="ln"><span>Weekend</span><b>${W.hoursPreset!=="wkend"? "same as the week"
              : (W.satClosed?"Sat closed":"Sat "+m2disp(t2m(W.satOpen))+"–"+m2disp(t2m(W.satClose)))+" · "+
                (W.sunClosed?"Sun closed":"Sun "+m2disp(t2m(W.sunOpen))+"–"+m2disp(t2m(W.sunClose)))}</b></div>
          </div>
          <div class="personcard"><h4>How it will run</h4>
            <div class="ln"><span>Team</span><b>${people.length} ${people.length===1?"person":"people"}</b></div>
            <div class="ln"><span>Standing days off</span><b>${Object.values(W.dayOff||{}).filter(a=>a&&a.length).length||"none"}</b></div>
            <div class="ln"><span>Rest between shifts</span><b>${W.minRest} hours</b></div>
            <div class="ln"><span>Days in a row</span><b>up to ${W.maxConsec}</b></div>
            <div class="ln"><span>Meals</span><b>${W.breakMode!=="assigned"? (W.breakMode==="lengths"?"length only":"staff coordinate")
              : W.mealPlan==="closed"? "closed "+m2disp(t2m(W.mealCloseFrom))+"–"+m2disp(t2m(W.mealCloseTo))
              : W.mealPlan==="slots"? "set times: "+esc((W.mealSlots||[]).map(x=>m2disp(t2m(x))).join(", "))
              : "worked out and staggered"}</b></div>
            <div class="ln"><span>Rest breaks</span><b>${W.restMode==="assigned"?"times on the schedule":W.restMode==="lengths"?"count and length":"staff take them"}</b></div>
            <div class="ln"><span>First pick</span><b>${esc((PRI_MODES.find(m=>m[0]===W.priority)||PRI_MODES[4])[1])}</b></div>
            <div class="ln"><span>Labor cost</span><b>${W.trackCost?"tracked":"off"}</b></div>
            <div class="ln"><span>Holiday pay</span><b>${W.holPay==="all"?"everyone, 8h":W.holPay==="ft"?"full-timers, 8h":"nobody"}</b></div>
            ${W.cycles? `<div class="ln"><span>Rotating patterns</span><b>on</b></div>`:""}
            <div class="ln"><span>Cover you asked for</span><b>${W.fillMode==="full"?"a floor — everyone fully scheduled":"exactly that many"}</b></div>
            <div class="ln"><span>Handing it out</span><b>${W.sendOut?"emailed or texted from here":"however you do it now"}</b></div>
            ${W.fillMode==="full"? `<div class="ln"><span>${esc(W.topUpLabel||"Project time")}</span><b>${W.projectShape==="chunk"?"in blocks":"wherever it fits"}, ${W.projectShare==="best"?"stacked on your best":"shared round"}</b></div>`:""}
            ${(()=>{const on=[W.xDaySheet&&"day sheet",W.xPto&&"PTO balances",W.xLic&&"license expiry",W.xCycles&&"work patterns",W.xNotice&&"notice warnings",W.xWaiver&&"meal waivers"].filter(Boolean);
              return on.length? `<div class="ln"><span>Also on</span><b>${esc(on.join(", "))}</b></div>`:"";})()}
            ${(W.posts||"").trim()? `<div class="ln"><span>Posts</span><b>${(W.posts||"").split(/\n/).filter(x=>x.trim()).length} on the floor${W.postSpan==="day"?", held all day":", rotating "+(W.postSpan==="half"?"at midday":"every "+W.postSpan.replace("h"," hours"))}</b></div>`:""}
            ${W.hols? `<div class="ln"><span>Holidays</span><b>${(()=>{const C=holidayCandidates();
              const c=C.filter(h=>W.hols[h.key]==="closed").length, l=C.filter(h=>W.hols[h.key]==="reduced").length, nn=C.filter(h=>W.hols[h.key]==="normal").length;
              return (c+l+nn)? [c?c+" closed":"", l?l+" lighter":"", nn?nn+" normal":""].filter(Boolean).join(", ") : "none tracked";})()}</b></div>`:""}
            <div class="ln"><span>Busy days</span><b>${esc(DAYS.filter((d,i)=>(W.dayLoad[i]||0)>0).map((d,i)=>d).join(", ")||"none marked")}</b></div>
            <div class="ln"><span>Requests on file</span><b>${W.reqs.length}</b></div>
            <div class="ln"><span>Drafting</span><b>${W.weeks} week${W.weeks===1?"":"s"}</b></div>
          </div>
        </div>
        <div class="help">From here on, maintenance is the easy part: punch in what people ask for, press Draft, look it over, post it. Every answer above has a page where you can change it, and you can run these questions again any time.</div>
      </div>`;
  }

  function teamSummary(){
    const r=$("#modalroot"), box=r.querySelector("#wteamsum");
    if(!box) return;
    /* never yank a select the manager is using */
    if(box.contains(document.activeElement)) return;
    const listed=allNames().length;
    box.innerHTML = `
      <div class="banner ${listed? (W.headcount && listed<W.headcount ? "warn":"info") : "warn"}"><div>
        ${listed? `<b>${listed} listed.</b>${W.headcount? (listed<W.headcount? " You said about "+W.headcount+" — "+(W.headcount-listed)+" to go." : listed>W.headcount? " That's more than the "+W.headcount+" you said, which is fine." : " That matches what you said.") : ""}`
                : "<b>Nothing listed yet.</b> Add at least one name to carry on."}</div></div>
      ${listed? `<div class="scroll" style="max-height:210px;margin-top:12px"><table>
        <thead><tr><th>Name</th><th style="width:130px">Bucket</th><th style="width:130px">Type</th><th style="width:92px">Min hrs</th><th style="width:92px">Max hrs</th></tr></thead>
        <tbody>${allNames().map(pn=>{ const key=pn.b+":"+pn.i, pp=W.people[key]||{};
          return `<tr><td><strong>${esc(pn.name)}</strong></td><td class="mini">${esc(W.buckets[pn.b]||"")}</td>
            <td><select class="wpt" data-k="${key}">${Object.keys(TYPES).map(t=>`<option value="${t}" ${(pp.type||"FT")===t?"selected":""}>${TYPES[t]}</option>`).join("")}</select></td>
            <td><input type="number" class="wmn" data-k="${key}" min="0" max="80" value="${pp.minH!=null? pp.minH : (pp.type==="PT"?16:pp.type==="PRN"?0:pp.type==="TEMP"?24:32)}"></td>
            <td><input type="number" class="wph" data-k="${key}" min="0" max="80" value="${pp.maxH|| (pp.type==="PT"?28:pp.type==="PRN"?20:40)}"></td></tr>`;
        }).join("")}</tbody></table></div>
        <div class="mini" style="margin-top:8px">Min hrs are guaranteed hours — the drafter fills everyone to their minimum on its own and flags anyone it couldn't. Everyone starts available all week; narrow anyone's hours on their profile once you're in.</div>`:""}`;
    box.querySelectorAll(".wpt").forEach(i=>i.onchange=()=>{ const k=i.dataset.k;
      W.people[k]=W.people[k]||{}; W.people[k].type=i.value;
      const h=box.querySelector('.wph[data-k="'+k+'"]');
      if(h) h.value = i.value==="PT"?28 : i.value==="PRN"?20 : i.value==="TEMP"?32 : 40;
      W.people[k].maxH=+((h||{}).value)||40;
      const mn=box.querySelector('.wmn[data-k="'+k+'"]');
      if(mn){ mn.value = i.value==="PT"?16 : i.value==="PRN"?0 : i.value==="TEMP"?24 : 32; W.people[k].minH=+mn.value||0; } });
    box.querySelectorAll(".wph").forEach(i=>i.oninput=()=>{ const k=i.dataset.k;
      W.people[k]=W.people[k]||{}; W.people[k].maxH=+i.value||40; });
    box.querySelectorAll(".wmn").forEach(i=>i.oninput=()=>{ const k=i.dataset.k;
      W.people[k]=W.people[k]||{}; W.people[k].minH=Math.max(0,+i.value||0); });
  }

  let PAINT_STEP=-1;
  function paint(){
    const r=$("#modalroot");
    const prevBody=r.querySelector(".modal .body");
    const keep = (PAINT_STEP===W.step && prevBody)? prevBody.scrollTop : 0;
    const sameStep = PAINT_STEP===W.step;
    PAINT_STEP=W.step;
    const last = W.step===STEPS.length-1;
    r.innerHTML=`<div class="scrim"><div class="modal" style="max-width:760px">
      <header><h3>${esc(STEPS[W.step].t)}</h3>
        <span class="mini">${W.step+1} of ${STEPS.length}</span>
        <button class="btn ghost sm" data-close>Close</button></header>
      <div class="wbar">${STEPS.map((x,i)=>`<i class="${i<W.step?"done":i===W.step?"now":""}"></i>`).join("")}</div>
      <div class="body">${body()}</div>
      <footer>
        ${W.step>0? `<button class="btn" id="wback">Back</button>`
          : firstRun? `<button class="btn ghost" id="wexplore">Explore the sample first</button>`
          : `<span style="flex:1"></span>`}
        <button class="btn ghost" id="wskip">${last?"":"Skip to the end"}</button>
        <button class="btn primary" id="wnext">${last?"Build it":"Next"}</button>
      </footer></div></div>`;
    { const nb=r.querySelector(".modal .body"); if(nb && sameStep && keep) nb.scrollTop=keep; }
    r.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal());
    const wex=r.querySelector("#wexplore");
    if(wex) wex.onclick=()=>{ closeModal(true); toast("Look around — Set up my business on the Home screen restarts the questions any time"); };
    /* don't let a stray Escape or scrim click eat sixteen steps of answers */
    MODAL_GUARD = W.step>0 ? ()=>{
      const foot=$("#modalroot").querySelector(".modal footer");
      if(foot && !foot.querySelector("#wleave")){
        const b=document.createElement("div");
        b.id="wleave"; b.style.cssText="flex:1;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)";
        b.innerHTML='Leave setup? Your answers so far won\'t be kept. <button class="btn sm danger" id="wleaveyes">Leave</button><button class="btn sm" id="wleaveno">Stay</button>';
        foot.prepend(b);
        b.querySelector("#wleaveyes").onclick=()=>closeModal(true);
        b.querySelector("#wleaveno").onclick=()=>b.remove();
      }
    } : null;
    wireDialog(r);
    r.querySelectorAll(".wopt").forEach(b=>b.onclick=()=>{
      const g=b.dataset.g; let v=b.dataset.v;
      if(v==="true") v=true; else if(v==="false") v=false; else if(/^-?\d+$/.test(v)) v=+v;
      collect(); W[g]=v;
      if(g==="biz"){ const bt=BIZ_TYPES.find(x=>x.id===v);
        if(bt){ W.open=bt.open; W.close=bt.close; W.hoursPreset=bt.hours; W.shiftPreset=bt.shifts;
                W.bucketCount=bt.roles.length; W.buckets=bt.roles.concat(["","","",""]).slice(0,4); W.shifts=[]; W.perShift={};
                if(bt.rules) Object.assign(W, bt.rules); } }
      if(g==="shiftPreset"){ W.shifts=[]; W.perShift={}; }
      if(g==="hoursPreset"){ W.shifts=[]; W.perShift={}; }
      paint();
    });
    const wma=r.querySelector("#wmadd");
    if(wma) wma.onclick=()=>{ collect();
      const last=(W.mealSlots||[]).map(t2m).sort((a,b)=>a-b).slice(-1)[0];
      W.mealSlots.push(m2t(((last==null?690:last)+30)%1440));
      W.mealSlots=[...new Set(W.mealSlots)].sort(); paint(); };
    const back=r.querySelector("#wback"); if(back) back.onclick=()=>{ collect(); W.step--; paint(); };
    r.querySelector("#wskip").onclick=()=>{ collect(); if(W.step===STEPS.length-1) apply(); else { W.step=STEPS.length-1; paint(); } };
    r.querySelector("#wnext").onclick=()=>{
      collect();
      if(STEPS[W.step].k==="team" && !allNames().length){ toast("Add at least one name"); return; }
      if(W.step===STEPS.length-1) apply(); else { W.step++; paint(); }
    };
    let deb=null;
    r.querySelectorAll(".wbn").forEach(t=>{
      t.addEventListener("input",()=>{
        W.bucketNames[+t.dataset.b]=t.value;
        const c=r.querySelector('.wcnt[data-b="'+t.dataset.b+'"]');
        if(c) c.textContent = namesIn(+t.dataset.b).length;
        clearTimeout(deb); deb=setTimeout(teamSummary, 500);   /* only the panel below redraws */
      });
      t.addEventListener("blur",()=>{ W.bucketNames[+t.dataset.b]=t.value; teamSummary(); });
    });
    if(STEPS[W.step].k==="team") teamSummary();
    r.querySelectorAll("[data-busy]").forEach(g=>{
      const i=+g.dataset.busy;
      g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ W.dayLoad[i]=+b.dataset.v; collect(); paint(); });
    });
    const whr=r.querySelector("#whrush"); if(whr) whr.onchange=()=>{ W.holidayRush=whr.value; };
    const wwk=r.querySelector("#wwkend"); if(wwk) wwk.onchange=()=>{ W.weekendDesire=wwk.value; };
    const wvc=r.querySelector("#wvac"); if(wvc) wvc.onchange=()=>{ W.vacations=wvc.value==="1"; };
    r.querySelectorAll("[data-hol]").forEach(sel=>sel.onchange=()=>{ W.hols=W.hols||{}; W.hols[sel.dataset.hol]=sel.value; paint(); });
    const wp=r.querySelector("#wposts");
    if(wp){ wp.addEventListener("blur",()=>{ const v=wp.value;
      if(v===W.posts) return; W.posts=v; setTimeout(paint,0); }); }   /* never redraw mid-blur */
    ["wpspan","wpfam","wprelief"].forEach(id=>{ const el=r.querySelector("#"+id);
      if(el) el.onchange=()=>{ if(id==="wpspan") W.postSpan=el.value; if(id==="wpfam") W.postFam=el.value; if(id==="wprelief") W.postRelief=el.value; paint(); }; });
    r.querySelectorAll("[data-x]").forEach(cb=>cb.onchange=()=>{ W[cb.dataset.x]=cb.checked; });
    r.querySelectorAll("[data-hall]").forEach(b2=>b2.onclick=()=>{ W.hols=W.hols||{};
      holidayCandidates().forEach(h=>{ W.hols[h.key]=b2.dataset.hall; }); paint(); });
    r.querySelectorAll(".daytog").forEach(btn=>btn.onclick=()=>{
      const k=btn.dataset.k, d=+btn.dataset.d;
      W.dayOff=W.dayOff||{}; const cur=W.dayOff[k]||[];
      W.dayOff[k] = cur.includes(d)? cur.filter(x=>x!==d) : cur.concat([d]);
      btn.classList.toggle("on", !W.dayOff[k].includes(d));
      const box=r.querySelector("#wdaysum");
      if(box){
        const named=allNames().filter(pn=>((W.dayOff||{})[pn.b+":"+pn.i]||[]).length);
        box.innerHTML = named.length
          ? `<div><b>Standing days off recorded.</b> ${esc(named.map(pn=>pn.name.split(" ")[0]+" (no "+
              ((W.dayOff||{})[pn.b+":"+pn.i]||[]).sort().map(i=>DSHORT[i]).join("/")+")").join(", "))}</div>`
          : `<div><b>Everyone's free every day so far.</b> That's fine — switch off any day someone genuinely can't do, and skip the rest.</div>`;
      }
    });
    const j=r.querySelector("#wj"); if(j) j.onchange=()=>{ collect(); paint(); };
    ["#wsatx","#wsunx"].forEach(id=>{ const el=r.querySelector(id); if(el) el.onchange=()=>{ collect(); paint(); }; });
    const cp=r.querySelector("#wsatcopy");
    if(cp) cp.onclick=()=>{ collect(); W.sunOpen=W.satOpen; W.sunClose=W.satClose; W.sunClosed=W.satClosed; paint(); };
    wireReqStep(r);
  }

  function wireReqStep(r){
    const kSel=r.querySelector("#wqk"); if(!kSel) return;
    let hard=1;
    const paintKind=()=>{
      const k=reqKind(kSel.value); hard=k.hard?1:0;
      r.querySelectorAll("#wqh button").forEach(b=>b.setAttribute("aria-pressed",(+b.dataset.v)===hard));
      r.querySelector("#wqd").style.display = k.dates? "":"none";
      r.querySelector("#wqd2").style.display = k.dates? "":"none";
      const x=r.querySelector("#wqx");
      const cur=curShifts();
      x.innerHTML = k.shift? `<label>Which shift</label><select id="wqs">${cur.shifts.map((sh,i)=>`<option value="${i}">${esc((W.shifts[i]&&W.shifts[i].label)||sh.label)}</option>`).join("")}</select>`
        : k.time? `<label>Time</label><input type="time" id="wqtime" value="09:00">`
        : k.num? `<label>Hours</label><input type="number" id="wqnum" min="0" max="80" value="20">`
        : "";
      x.style.display=(k.shift||k.time||k.num)?"":"none";
    };
    kSel.onchange=paintKind; paintKind();
    r.querySelectorAll("#wqh button").forEach(b=>b.onclick=()=>{ hard=+b.dataset.v;
      r.querySelectorAll("#wqh button").forEach(z=>z.setAttribute("aria-pressed", z===b)); });
    r.querySelector("#wqadd").onclick=()=>{
      const k=reqKind(kSel.value);
      const f=r.querySelector("#wqf"), t=r.querySelector("#wqt");
      W.reqs.push({pi:+r.querySelector("#wqe").value, kind:k.k, hard:!!hard,
        from: k.dates? f.value : S.currentWeek, to: k.dates? (t.value||f.value) : "2099-01-01",
        shiftIdx: +((r.querySelector("#wqs")||{}).value)||0,
        time: (r.querySelector("#wqtime")||{}).value||null,
        num: +((r.querySelector("#wqnum")||{}).value)||0});
      collect(); paint();
    };
    r.querySelectorAll("[data-wqdel]").forEach(b=>b.onclick=()=>{ W.reqs.splice(+b.dataset.wqdel,1); collect(); paint(); });
  }

  function collect(){
    const r=$("#modalroot"); const g=sel=>r.querySelector(sel);
    if(g("#wn")) W.name=g("#wn").value.trim();
    if(g("#ws")) W.site=g("#ws").value.trim();
    if(g("#wj")) W.juris=g("#wj").value;
    if(g("#wo")) W.open=g("#wo").value;
    if(g("#wc")) W.close=g("#wc").value;
    if(g("#wsato")) W.satOpen=g("#wsato").value;
    if(g("#wsatc")) W.satClose=g("#wsatc").value;
    if(g("#wsuno")) W.sunOpen=g("#wsuno").value;
    if(g("#wsunc")) W.sunClose=g("#wsunc").value;
    if(g("#wsatx")) W.satClosed=g("#wsatx").checked;
    if(g("#wsunx")) W.sunClosed=g("#wsunx").checked;
    if(g("#whc")) W.headcount=+g("#whc").value||0;
    r.querySelectorAll("[data-wmslot]").forEach(i=>{ W.mealSlots[+i.dataset.wmslot]=i.value; });
    r.querySelectorAll("[data-w]").forEach(i=>{ W[i.dataset.w]=i.value; });
    r.querySelectorAll(".wrole").forEach(i=>{ W.buckets[+i.dataset.i]=i.value.trim(); });
    r.querySelectorAll(".wlic").forEach(i=>{ W.bucketLic[+i.dataset.i]=i.checked; });
    r.querySelectorAll(".wbn").forEach(t=>{ W.bucketNames[+t.dataset.b]=t.value; });
    r.querySelectorAll(".wsl").forEach(i=>{ W.shifts[+i.dataset.i]=W.shifts[+i.dataset.i]||{}; W.shifts[+i.dataset.i].label=i.value.trim(); });
    r.querySelectorAll(".wss").forEach(i=>{ W.shifts[+i.dataset.i]=W.shifts[+i.dataset.i]||{}; W.shifts[+i.dataset.i].start=i.value; });
    r.querySelectorAll(".wse").forEach(i=>{ W.shifts[+i.dataset.i]=W.shifts[+i.dataset.i]||{}; W.shifts[+i.dataset.i].end=i.value; });
    r.querySelectorAll(".wpt").forEach(i=>{ const k=i.dataset.k; W.people[k]=W.people[k]||{}; W.people[k].type=i.value; });
    r.querySelectorAll(".wph").forEach(i=>{ const k=i.dataset.k; W.people[k]=W.people[k]||{}; W.people[k].maxH=+i.value||40; });
    r.querySelectorAll(".wmn").forEach(i=>{ const k=i.dataset.k; W.people[k]=W.people[k]||{}; W.people[k].minH=Math.max(0,+i.value||0); });
    const wpx=r.querySelector("#wposts"); if(wpx) W.posts=wpx.value;
    r.querySelectorAll("[data-x]").forEach(cb=>{ W[cb.dataset.x]=cb.checked; });
    r.querySelectorAll(".wneed").forEach(i=>{ W.perShift[i.dataset.s+":"+i.dataset.r]=+i.value||0; });
    if(g("#wbud")) W.budget=+g("#wbud").value||0;
  }

  function apply(){
    const N=blankState();
    N.org.name=W.name; N.org.site=W.site; N.org.jurisdiction=W.juris; N.org.weekStart=1;
    N.org.trackCost=!!W.trackCost; N.org.budget=W.trackCost?(W.budget||0):0;
    N.org.bizType=W.biz;
    for(let d=0;d<7;d++){
      const wknd=(d===0||d===6);
      if(W.hoursPreset==="always") N.hours[d]={closed:false,open:"00:00",close:"23:59"};
      else if(W.hoursPreset==="wkday") N.hours[d]= wknd? {closed:true,open:W.open,close:W.close} : {closed:false,open:W.open,close:W.close};
      else if(W.hoursPreset==="wkend") N.hours[d]= d===6? {closed:!!W.satClosed,open:W.satOpen,close:W.satClose}
                                                : d===0? {closed:!!W.sunClosed,open:W.sunOpen,close:W.sunClose}
                                                : {closed:false,open:W.open,close:W.close};
      else N.hours[d]={closed:false,open:W.open,close:W.close};
    }
    const bucketNames=W.buckets.slice(0,W.bucketCount).map((x,i)=>x||("Bucket "+(i+1)));
    N.roles=bucketNames.map((n,i)=>({id:uid("r"),name:n,abbr:n.slice(0,5),color:PALETTE[i%PALETTE.length],note:"",licensed:!!(W.bucketLic&&W.bucketLic[i])}));
    const cur=curShifts();
    N.shifts=cur.shifts.map((sh,i)=>({id:uid("s"),
      label:(W.shifts[i]&&W.shifts[i].label)||sh.label,
      start:(W.shifts[i]&&W.shifts[i].start)||sh.start,
      end:(W.shifts[i]&&W.shifts[i].end)||sh.end,
      roleId:null,color:PALETTE[i%PALETTE.length],note:"",unpaidBreakMin:30,desire:sh.desire||0}));
    /* people, kept in bucket order so the ladder starts sensibly */
    const people=allNames();
    N.employees=people.map(pn=>{
      const pp=W.people[pn.b+":"+pn.i]||{};
      const type=pp.type||"FT";
      const maxH=pp.maxH || (type==="FT"?40: type==="PT"?28: type==="PRN"?20:32);
      const roleId=N.roles[pn.b]? N.roles[pn.b].id : (N.roles[0]&&N.roles[0].id);
      const off=(W.dayOff||{})[pn.b+":"+pn.i]||[];
      return {id:uid("e"),name:pn.name,email:"",phone:"",roleIds:roleId?[roleId]:[],type,
        minH: Math.min(maxH, pp.minH!=null? pp.minH : (type==="PRN"?0:Math.max(0,Math.round(maxH*0.8)))), maxH, maxD: type==="FT"?5:4,
        avail:[0,1,2,3,4,5,6].map(d=>({ok:!off.includes(d),from:"00:00",to:"23:59"})),
        prefShiftIds:[],avoidShiftIds:[],prefDaysOff:[],canOpen:true,canClose:true,
        hoursMode:"range",
        holidayPay: W.holPay==="all" || (W.holPay==="ft" && type==="FT"),
        holidayPayH: 8,
        notes:"",seniority:"",active:true,rate:0};
    });
    /* Saturday and Sunday get their own shift whenever their hours differ from the week */
    const weekendShift={};        /* dow -> shift */
    if(W.hoursPreset==="wkend" && N.shifts.length){
      const made={};
      [[6,"Saturday",W.satClosed,W.satOpen,W.satClose],[0,"Sunday",W.sunClosed,W.sunOpen,W.sunClose]]
        .forEach(([dow,label,closed,o,c])=>{
          if(closed) return;
          if(o===W.open && c===W.close) return;      /* same as the week — reuse the normal shifts */
          const key=o+"|"+c;
          if(made[key]){ weekendShift[dow]=made[key]; return; }
          const sh={id:uid("s"),label,start:o,end:c,roleId:null,
            color:PALETTE[N.shifts.length%PALETTE.length],note:"",unpaidBreakMin:30,desire:-1};
          N.shifts.push(sh); made[key]=sh; weekendShift[dow]=sh;
        });
    }
    const openDays = [0,1,2,3,4,5,6].filter(d=>!N.hours[d].closed).length || 7;
    const cap = Math.max(1, Math.floor((people.length||1)*4.6/openDays));
    const def = wizDefaultDemand(cur.shifts.length, Math.max(1,N.roles.length), cap).grid;
    N.demand={};
    for(let d=0;d<7;d++){
      if(N.hours[d].closed){ N.demand[d]=[]; continue; }
      const rows=[];
      if(weekendShift[d]){
        const per=Math.max(1,Math.min(N.roles.length,Math.ceil(cap/2)));
        N.roles.slice(0,per).forEach(r=>rows.push({shiftId:weekendShift[d].id, roleId:r.id, count:1}));
      } else {
        cur.shifts.forEach((sh,si)=>{
          N.roles.forEach((r,ri)=>{
            const c=W.perShift[si+":"+ri];
            const n=(c!=null)? c : (def[si+":"+ri]||0);
            if(n>0 && N.shifts[si]) rows.push({shiftId:N.shifts[si].id, roleId:r.id, count:n});
          });
        });
      }
      N.demand[d]=rows;
    }
    if(N.employees.length && N.shifts.length){
      const openD=[0,1,2,3,4,5,6].filter(d=>!N.hours[d].closed);
      const groups={}; openD.forEach(d=>{ const k=N.hours[d].open+"|"+N.hours[d].close; (groups[k]=groups[k]||[]).push(d); });
      N.coverage=Object.keys(groups).map(k=>{ const [o,c]=k.split("|");
        return {id:uid("c"),kind:"min",label:"Somebody on duty whenever we're open",roleId:null,min:1,start:o,end:c,days:groups[k],mealsCount:true}; });
    }
    N.rules.minRestH=W.minRest; N.rules.maxConsecDays=W.maxConsec; N.rules.noClopen=!!W.noClopen; N.rules.preferLong=!!W.preferLong; N.rules.perDiem=W.perDiem==="auto"?"auto":"ask";
    N.rules.breakMode=W.breakMode; N.rules.restMode=W.restMode; N.rules.useCycles=!!W.cycles;
    N.rules.mealPlan=W.mealPlan||"auto";
    N.rules.mealSlots=(W.mealSlots||[]).filter(Boolean).sort();
    if(!N.rules.mealSlots.length) N.rules.mealSlots=["11:30","12:00","12:30"];
    N.rules.mealClose={from:W.mealCloseFrom||"13:00", to:W.mealCloseTo||"14:00"};
    N.rules.fillMode=W.fillMode||"demand";
    N.rules.topUpLabel=(W.topUpLabel||"").trim()||"Project time";
    N.rules.projectShape=W.projectShape||"chunk";
    N.rules.projectShare=W.projectShare||"fair";
    N.rules.sendOut=!!W.sendOut;
    N.dayLoad=(W.dayLoad||[0,1,0,-1,0,1,0]).slice();
    N.rules.holidayRush=W.holidayRush||"none";
    N.holidays.mode="same";
    N.vacations.on=!!W.vacations;
    N.rules.useDaySheet = W.xDaySheet!==false;
    N.org.trackPto = !!W.xPto;
    N.rules.useCycles = !!W.xCycles;
    N.rules.advanceNoticeDays = W.xNotice? 14 : 0;
    N.rules.allowMealWaiver = !!W.xWaiver;
    N.rules.trackLic = !!W.xLic;
    /* posts on the floor — numbered names group themselves into one rotation */
    const postLines=(W.posts||"").split(/\n/).map(x=>x.trim()).filter(Boolean);
    if(postLines.length){
      N.rules.stationSpan=W.postSpan||"day";
      N.rules.stationFamilies=W.postFam!=="0";
      N.stations=postLines.map(nm=>({id:uid("st"), kind:"station", name:nm, note:"", desire:0,
        roleId:null, linkedTo:null, assignTo:"any", days:[], off:false, double:false,
        critical:W.postRelief!=="none", reliefFrom:W.postRelief==="family"?"family":"",
        family:"", from:"", to:"", slots:[], holdAllDay:false}));
    }
    /* the holidays they actually keep, each with how they run it */
    if(W.hols){
      const roleIds=N.roles.map(r=>r.id);
      const open=t2m(W.open||"09:00"), close=t2m(W.close||"17:00");
      const lightFrom=Math.max(open, 600), lightTo=Math.min(close, 960);
      const lightHours=(lightTo>lightFrom)? m2t(lightFrom)+"-"+m2t(lightTo) : m2t(open)+"-"+m2t(close);
      N.holidays.list = holidayCandidates()
        .filter(h=>W.hols[h.key] && W.hols[h.key]!=="skip")
        .map(h=>{
          const mode=W.hols[h.key];
          const need={};
          if(mode!=="closed") roleIds.slice(0,2).forEach(rid=>{ need[rid]=1; });
          return {id:uid("h"), name:h.name, date:h.date, hmode:mode,
                  hours: mode==="closed"? "" : mode==="reduced"? lightHours : (m2t(open)+"-"+m2t(close)),
                  need};
        });
      /* a lighter pattern for the "fewer people" days: about half a normal day, from real shifts */
      if(N.holidays.list.some(h=>h.hmode==="reduced")){
        const busiest=[0,1,2,3,4,5,6].filter(d=>!N.hours[d].closed)
          .sort((a,b)=>(N.demand[b]||[]).reduce((t,r)=>t+(r.count||1),0)-(N.demand[a]||[]).reduce((t,r)=>t+(r.count||1),0))[0];
        N.holidays.demand=((N.demand[busiest]||[]).map(r=>({shiftId:r.shiftId, roleId:r.roleId,
          count:Math.max(1, Math.floor((r.count||1)/2))})));
      }
    }
    N.priority.mode=W.priority; N.priority.order=N.employees.map(e=>e.id); N.priority.strength=2;
    N.dayDesire = W.hoursPreset==="wkday"? [0,1,1,1,1,0,0] : [-1,1,1,1,1,0,-1];
    if(W.hoursPreset!=="wkday"){ const wv=W.weekendDesire==="wanted"?1:W.weekendDesire==="neutral"?0:-1; N.dayDesire[0]=wv; N.dayDesire[6]=wv; }
    /* requests entered during setup */
    N.requests = W.reqs.map(r=>({id:uid("q"), empId:(N.employees[r.pi]||{}).id, kind:r.kind, hard:!!r.hard,
      from:r.from, to:r.to, shiftId:(N.shifts[r.shiftIdx]||{}).id||null, time:r.time, num:r.num,
      note:"", status:"open", at:Date.now()})).filter(r=>r.empId);
    N.setupDone=true; N.sample=false; N.templates=[]; N.horizon=W.weeks||1; N.ui={advanced:false, updSeen:UPDREV};
    N.currentWeek = addDays(weekStartOf(ymd(new Date()), N.org.weekStart), 7);
    S=N; priorityRefresh(); save(); closeModal(true);
    if(S.shifts.length && S.employees.length){
      const res=generateRange(S.currentWeek, W.weeks||1); save(); go("home");
      toast("Drafted "+res.filled+" shifts across "+res.built.length+" week"+(res.built.length===1?"":"s")+(res.unfilled? " · "+res.unfilled+" left open":""));
    } else { go("shifts"); toast("Set up. Add your shifts next."); }
  }

  paint();
}
