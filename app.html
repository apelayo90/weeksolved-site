function vRequests(){
  const ws=S.currentWeek, weeks=S.horizon||1, period=reqPeriod(ws,weeks);
  const all=(S.requests||[]).slice().sort((a,b)=> (a.status==="declined")-(b.status==="declined") || a.from.localeCompare(b.from));
  const inPeriod=all.filter(r=>{
    if(r.kind==="maxh") return true;
    if(r.every && r.every.length) return r.from<=period.to && (!r.to || r.to==="2099-01-01" || r.to>=period.from);
    return !(r.to<period.from || r.from>period.to);
  });
  const later=all.filter(r=> r.kind!=="maxh" && !(r.every&&r.every.length) && r.from>period.to);
  const past=all.filter(r=> r.kind!=="maxh" && !(r.every&&r.every.length) && r.to<period.from);
  const built=getWeek(ws).assignments.length>0;

  const row=(r,showOutcome)=>{
    const e=empById(r.empId)||{name:"—"}, k=reqKind(r.kind);
    const o = showOutcome&&built&&r.status!=="declined"? reqOutcome(r,ws,weeks) : null;
    return `<tr${r.status==="declined"?' style="opacity:.5"':""}>
      <td><strong>${esc(e.name)}</strong></td>
      <td><span class="chip ${r.hard?"acc":""}">${esc(k.t)}</span>${r.hard?'<div class="mini">must</div>':'<div class="mini">if possible</div>'}</td>
      <td class="mono" style="font-size:12px">${r.kind==="maxh"? "any time"
        : reqRepeatText(r)? `<span class="chip acc">${esc(reqRepeatText(r))}</span>`
        : (r.from===r.to? prettyDate(r.from) : prettyDate(r.from)+" – "+prettyDate(r.to))}</td>
      <td class="mini">${esc(reqDetail(r))}${r.note?`<div class="mini" style="opacity:.8">“${esc(r.note)}”</div>`:""}</td>
      ${showOutcome? `<td>${o? `<span class="chip ${o.ok?"ok":o.ok===false?"warn":""}">${esc(o.say)}</span>` : `<span class="mini">draft the week to see</span>`}</td>`:""}
      <td style="text-align:right;white-space:nowrap">
        <button class="btn sm" data-reqedit="${r.id}">Edit</button>
        ${r.status==="declined"? `<button class="btn sm" data-reqok="${r.id}">Reinstate</button>`
          : `<button class="btn sm" data-reqno="${r.id}">Decline</button>`}
        <button class="btn sm danger" data-reqdel="${r.id}" title="Delete">✕</button></td></tr>`;
  };

  return `
  <div class="stack">
    <div class="banner info"><div><b>The inbox, turned into rules.</b> Work down your emails and messages, punch each one in here, then draft. Anything marked <b>must</b> the scheduler will not break; anything marked <b>if possible</b> it leans towards and tells you afterwards whether it managed. Your standing rules — hours, roles, coverage, breaks, priority — stay set, so this is the only thing that changes week to week.</div></div>

    ${!S.employees.some(e=>e.active)? `<div class="card"><header><h3>Add a request</h3></header>
      <div class="body"><div class="empty"><strong>No one on the roster</strong>Requests belong to people — add your team first, then punch requests in here.
        <div style="margin-top:10px"><button class="btn sm primary" data-go="team">Go to Team</button></div></div></div></div>` : `<div class="card">
      <header><h3>Add a request</h3><span class="hint">Enter, and the form is ready for the next one</span></header>
      <div class="body">
        <div class="reqform">
          <div class="field" style="min-width:170px"><label>Who</label>
            <select id="qe">${S.employees.filter(e=>e.active).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")||'<option value="">No one on the roster</option>'}</select></div>
          <div class="field" style="min-width:190px"><label>What they're asking</label>
            <select id="qk">${REQ_KINDS.map(k=>`<option value="${k.k}">${esc(k.t)} — ${esc(k.hint)}</option>`).join("")}</select></div>
          <div class="field" id="qdates" style="min-width:200px"><label>When</label>
            <select id="qwhen">
              ${(()=>{const o=[]; for(let i=0;i<21;i++){ const d=addDays(ws,i);
                o.push(`<option value="${d}">${DAYS[parseYmd(d).getDay()]}, ${prettyDate(d)}</option>`); } return o.join("");})()}
              <option value="__week">The whole week of ${esc(prettyDate(ws))}</option>
              ${weeks>1? `<option value="__period">The whole ${weeks}-week stretch</option>`:""}
              <option value="__range">A date range…</option>
              <optgroup label="Every week, ongoing">
                ${DAYS.map((d,i)=>`<option value="__rep${i}">Every ${d}</option>`).join("")}
                <option value="__repwd">Every weekday</option>
                <option value="__repwe">Every weekend</option>
              </optgroup>
            </select>
            <div id="qrange" style="display:none;margin-top:6px" class="row">
              <input type="date" id="qf" value="${esc(ws)}" style="width:auto;flex:1">
              <span class="mini">to</span>
              <input type="date" id="qt" value="${esc(ws)}" style="width:auto;flex:1"></div>
          </div>
          <div class="field" id="qdates2" style="display:none"></div>
          <div class="field" id="qextra"></div>
          <div class="field" style="flex:1;min-width:180px"><label>Note (optional)</label><input type="text" id="qn" placeholder="Straight from the email"></div>

        </div>
        <div class="mini" style="margin-top:8px">Tip: <kbd>Enter</kbd> in any field adds it and leaves you ready for the next.</div>

    <div class="card">

    ${later.length? `<div class="card ${folded("reqlater")?"folded":""}">${foldHead("reqlater","Further out",`<span class="hint">${later.length} waiting for the week they fall in</span>`)}
      <div class="scroll"><table><thead><tr><th style="width:150px">Who</th><th style="width:140px">Asking</th><th style="width:150px">When</th><th>Detail</th><th style="width:120px"></th></tr></thead>

        if(r0.status==="declined" && !r0.deniedAt) r0.deniedAt=Date.now();

      };

function reqDetail(r){

  from.onchange=()=>{ if(to.value<from.value) to.value=from.value; };
  const pickedDates=()=>{
    const ws=S.currentWeek, weeks=S.horizon||1, v=when.value;
    if(v==="__week")   return {from:ws, to:addDays(ws,6), every:null};
    if(v==="__period") return {from:ws, to:addDays(ws, weeks*7-1), every:null};
    if(v==="__range")  return {from:from.value, to:to.value||from.value, every:null};
    if(v==="__repwd")  return {from:ws, to:"2099-01-01", every:[1,2,3,4,5]};
    if(v==="__repwe")  return {from:ws, to:"2099-01-01", every:[0,6]};
    if(v.indexOf("__rep")===0) return {from:ws, to:"2099-01-01", every:[+v.slice(5)]};
    return {from:v, to:v, every:null};
  };

    if(!empId){ toast("Add someone to the team first"); return; }
    const k=reqKind(kSel.value);

    const rec={id:uid("q"), empId, kind:k.k, hard:!!hard, every: k.dates? pd.every : null,

      shiftId: (root.querySelector("#qs")||{}).value||null,
      time: (root.querySelector("#qtime")||{}).value||null,
      num: +((root.querySelector("#qnum")||{}).value)||0,
      note: root.querySelector("#qn").value.trim(), status:"open", at:Date.now()};
    if(k.dates && (!rec.from||!rec.to||rec.to<rec.from)){ toast("Check those dates"); return; }
    S.requests=S.requests||[]; S.requests.push(rec);
    save(); render();
    setTimeout(()=>{ const q=$("#qn"); if(q){ q.value=""; } const e2=$("#qe"); if(e2) e2.focus(); },40);
    toast("Added — next one");
  };
  function ws0(){ return S.currentWeek; }
  root.querySelector("#qadd").onclick=add;
  root.querySelectorAll(".reqform input,.reqform select").forEach(el=>{
    el.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); add(); } });

function wireReqTables(root){

  });
  root.querySelectorAll("[data-reqedit]").forEach(b=>b.onclick=()=>editRequestModal(b.dataset.reqedit));
  const co=root.querySelector("#qclearold");

  const qd=root.querySelector("#qdraft");
  if(qd) qd.onclick=()=>{

/* ============================================================

const PRI_MODES = [
  ["seniority","Seniority","Longest with the company gets first claim on the good shifts and first refusal on the bad ones. The order is computed from each person's start date, so it updates itself as people come and go."],
  ["custom","My own order","You set the pecking order by hand — drag people up and down. Use this when the real rule isn't tenure: a lead who has to open, a trainee who shouldn't close alone."],
  ["rotate","Take turns","Whoever has received the fewest good shifts so far moves to the front. Over a few months everyone lands in roughly the same place, and nobody has to police it."],
  ["lottery","Lottery","A draw, reshuffled each week from a seed you can re-roll. Nobody can argue with a coin toss, and the same seed always produces the same order, so it is auditable after the fact."],
  ["off","Don't use it","Ignore standing entirely. Shifts go to whoever fits best on hours, preferences and coverage."]
];
const PRI_STRENGTH = [
  [0,"Off","Standing is ignored."],

WIRE.priority = root=>{
  const seg=(sel,fn)=>{ const el=root.querySelector(sel); if(el) el.querySelectorAll("button").forEach(b=>b.onclick=()=>fn(b.dataset.v)); };
  seg("#pmode",v=>{ S.priority.mode=v; if(v==="custom" && !(S.priority.order||[]).length) S.priority.order=priorityOrder(); priorityRefresh(); save(); render(); });
  seg("#pstr",v=>{ S.priority.strength=+v; save(); render(); });
  seg("#papp",v=>{ S.priority.applyTo=v; save(); render(); });
  const rr=root.querySelector("#preroll");
  if(rr) rr.onclick=()=>{ S.priority.seed=Math.floor(Math.random()*99999)+1; priorityRefresh(); save(); render(); toast("Re-rolled"); };
  const fz=root.querySelector("#pfreeze");
  if(fz) fz.onclick=()=>{ S.priority.order=priorityOrder(); S.priority.mode="custom"; priorityRefresh(); save(); render(); toast("Order frozen — drag to adjust"); };
  const fs=root.querySelector("#pfromsen");
  if(fs) fs.onclick=()=>{ S.priority.order=S.employees.filter(e=>e.active).sort((a,b)=>tenure(b)-tenure(a)).map(e=>e.id); priorityRefresh(); save(); render(); };
  const sa=root.querySelector("#psaveadj");
  if(sa) sa.onclick=()=>{ S.priority.adjust=S.priority.adjust||{};
    root.querySelectorAll(".padj").forEach(i=>{ S.priority.adjust[i.dataset.e]=+i.value||0; });
    priorityRefresh(); save(); render(); toast("Balances saved"); };
  const rb=root.querySelector("#prebuild");
  if(rb) rb.onclick=()=>{ const r=generateSchedule(); save(); render(); toast(r.filled+" shifts placed with the new priority"); };

  root.querySelectorAll("[data-desshift]").forEach(g=>{
    const id=g.dataset.desshift;
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const sh=shiftById(id); if(sh){ sh.desire=+b.dataset.v; priorityRefresh(); save(); render(); } });
  });
  root.querySelectorAll("[data-desday]").forEach(g=>{
    const i=+g.dataset.desday;
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.dayDesire[i]=+b.dataset.v; priorityRefresh(); save(); render(); });
  });

  /* --- ladder reordering --- */
  const move=(id,delta)=>{
    const o=priorityOrder().slice();
    const i=o.indexOf(id), j=i+delta;
    if(i<0||j<0||j>=o.length) return;
    o.splice(j,0,o.splice(i,1)[0]);
    S.priority.order=o; S.priority.mode="custom"; priorityRefresh(); save(); render();
  };
  root.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>move(b.dataset.up,-1));
  root.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>move(b.dataset.dn,1));

  const box=root.querySelector("#ladder");
  if(box && S.priority.mode==="custom"){
    let src=null;
    box.querySelectorAll(".rung").forEach(r=>{
      r.addEventListener("dragstart",ev=>{ src=r; r.classList.add("dragging");
        try{ ev.dataTransfer.setData("text/plain",r.dataset.id); ev.dataTransfer.effectAllowed="move"; }catch(e){} });
      r.addEventListener("dragend",()=>{ r.classList.remove("dragging");
        box.querySelectorAll(".rung").forEach(x=>x.classList.remove("over"));
        S.priority.order=[...box.querySelectorAll(".rung")].map(x=>x.dataset.id);
        priorityRefresh(); save(); render(); });
      r.addEventListener("dragover",ev=>{
        if(!src||src===r) return; ev.preventDefault();
        r.classList.add("over");
        const rect=r.getBoundingClientRect();
        const after = (ev.clientY-rect.top)/rect.height > 0.5;
        box.insertBefore(src, after? r.nextSibling : r);
      });
      r.addEventListener("dragleave",()=>r.classList.remove("over"));
      r.addEventListener("drop",ev=>ev.preventDefault());
    });
  }
};

          critical: isAdmin? false : !!(r.querySelector("#stcrit")||{}).checked,

          assignTo: isAdmin? r.querySelector("#stass").value : "any",
          family: st.family||"",

          to:   isAdmin? "" : ((r.querySelector("#stto")||{}).value||""),

          off: r.querySelector("#stoff").checked };

        const i=S.stations.findIndex(x=>x.id===st.id);
        if(i>=0) S.stations[i]=rec; else S.stations.push(rec);
        /* keep a link mutual so a pair really is a pair */
        if(rec.linkedTo){
          const o=stationById(rec.linkedTo);
          if(o){ o.linkedTo=rec.id; }
          S.stations.forEach(x=>{ if(x.id!==rec.id && x.id!==rec.linkedTo && x.linkedTo===rec.id) x.linkedTo=null; });
        } else {
          S.stations.forEach(x=>{ if(x.linkedTo===rec.id) x.linkedTo=null; });

      };

      if(d) d.onclick=()=>{
        S.stations=(S.stations||[]).filter(x=>x.id!==st.id);
        S.stations.forEach(x=>{ if(x.linkedTo===st.id) x.linkedTo=null; });
        Object.values(S.weeks).forEach(w=>w.assignments.forEach(a=>{

          if(a.station2===st.id) delete a.station2;
          if(a.admin) a.admin=a.admin.filter(y=>y!==st.id);
        }));
        save(); closeModal(); render();
      };
    });
}

/* ============================================================
   View: Holiday poll
   ============================================================ */
function holStaffed(){ return (S.holidays.list||[]).filter(h=>holMode(h)!=="closed"); }
function holidaySlots(){
  const slots=[];
  holStaffed().forEach(h=>{
    Object.keys(h.need||{}).forEach(rid=>{
      for(let i=0;i<(h.need[rid]||0);i++) slots.push({holidayId:h.id, roleId:rid});
    });
  });
  return slots;
}
function respFor(empId){ return S.holidays.responses.find(r=>r.empId===empId); }

function allocateHolidays(){
  const H=S.holidays.list, R=S.holidays.responses;
  const slots=holidaySlots();
  if(!slots.length) return null;
  const n=H.length;
  const cost=(empId,hid)=>{
    const r=respFor(empId);
    if(!r) return n*0.75;                       // no answer: treat as neutral-ish
    if((r.cant||[]).includes(hid)) return Infinity;
    const i=(r.rank||[]).indexOf(hid);
    return i<0? n*0.75 : i;
  };
  const eligible=(empId,roleId)=>{
    const e=empById(empId); if(!e||!e.active) return false;
    if(roleId && !e.roleIds.includes(roleId)) return false;
    return true;
  };
  const pool=S.employees.filter(e=>e.active);
  const cap = Math.max(1, Math.ceil(slots.length/Math.max(1,pool.length)));
  const load={}; pool.forEach(e=>load[e.id]=0);
  const assignedByHoliday={}; H.forEach(h=>assignedByHoliday[h.id]=[]);

  /* scarcest slots first */
  slots.forEach(s=>{ s._pool = pool.filter(e=>eligible(e.id,s.roleId) && cost(e.id,s.holidayId)!==Infinity).length; });
  slots.sort((a,b)=>a._pool-b._pool);

  const result=[], unfilled=[];
  slots.forEach(s=>{
    const cands = pool.filter(e=>eligible(e.id,s.roleId)
      && cost(e.id,s.holidayId)!==Infinity
      && !assignedByHoliday[s.holidayId].includes(e.id));
    if(!cands.length){ unfilled.push(s); return; }
    let best=null,bestC=Infinity;
    cands.forEach(e=>{
      const over = load[e.id] >= cap ? 6 : 0;
      const c = cost(e.id,s.holidayId) + load[e.id]*2.2 + over;
      if(c<bestC){ bestC=c; best=e; }
    });
    load[best.id]++; assignedByHoliday[s.holidayId].push(best.id);
    result.push({holidayId:s.holidayId, roleId:s.roleId, empId:best.id, rank:cost(best.id,s.holidayId)});
  });

  /* improvement: swap pairs when it lowers total unhappiness without breaking eligibility */
  for(let pass=0;pass<4;pass++){
    let improved=false;
    for(let i=0;i<result.length;i++) for(let j=i+1;j<result.length;j++){
      const A=result[i], B=result[j];
      if(A.holidayId===B.holidayId) continue;
      if(A.roleId!==B.roleId) continue;
      if(assignedByHoliday[A.holidayId].includes(B.empId)) continue;
      if(assignedByHoliday[B.holidayId].includes(A.empId)) continue;
      const now = cost(A.empId,A.holidayId)+cost(B.empId,B.holidayId);
      const alt = cost(B.empId,A.holidayId)+cost(A.empId,B.holidayId);
      if(alt < now - 0.001 && alt!==Infinity){
        assignedByHoliday[A.holidayId]=assignedByHoliday[A.holidayId].filter(x=>x!==A.empId).concat([B.empId]);
        assignedByHoliday[B.holidayId]=assignedByHoliday[B.holidayId].filter(x=>x!==B.empId).concat([A.empId]);
        const t=A.empId; A.empId=B.empId; B.empId=t;
        A.rank=cost(A.empId,A.holidayId); B.rank=cost(B.empId,B.holidayId);
        improved=true;
      }
    }
    if(!improved) break;
  }
  const totals={}; result.forEach(r=>totals[r.empId]=(totals[r.empId]||0)+1);
  return {result, unfilled, totals, cap, responded:R.length, pool:pool.length};
}

function vacMonthsHtml(extra){
  const V=S.vacations, heat=vacHeat(extra);
  const holSet=new Set((S.holidays.list||[]).map(h=>h.date));
  const start=V.windowFrom||ymd(new Date());
  const end=V.windowTo||addDays(start,180);
  const months=[];
  let d=parseYmd(start); d.setDate(1);
  const stop=parseYmd(end);
  let guard=0;
  while(d<=stop && guard++<14){
    const y=d.getFullYear(), m=d.getMonth();
    const label=d.toLocaleDateString(undefined,{month:"long",year:"numeric"});
    const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
    let cells=DSHORT.map(x=>`<span>${x[0]}</span>`).join("");
    for(let i=0;i<first.getDay();i++) cells+="<i style='visibility:hidden'></i>";
    for(let dd=1;dd<=days;dd++){
      const ds=ymd(new Date(y,m,dd));
      const h=heat[ds]||{ask:0,ok:0};
      const lvl=h.ask>=4?"h3":h.ask>=2?"h2":h.ask>=1?"h1":"";
      const cls=(h.ok?"ok ":"")+lvl+(holSet.has(ds)?" hol":"");
      const tip=(h.ok? h.ok+" approved away. ":"")+(h.ask? h.ask+" request"+(h.ask===1?"":"s")+" touch this day.":"")+(holSet.has(ds)?" Assigned holiday.":"");
      cells+=`<i class="${cls.trim()}" title="${esc(tip.trim()||prettyDate(ds))}">${h.ok||""}</i>`;
    }
    months.push(`<div class="vmon"><div class="t">${esc(label)}</div><div class="vgrid">${cells}</div></div>`);
    d=new Date(y,m+1,1);
  }
  return `<div class="vmonths">${months.join("")}</div>
    <div class="vleg"><span><i style="background:#e7d9ae"></i>requested</span><span><i style="background:#d99a8f"></i>heavily requested</span><span><i style="background:var(--accent)"></i>approved away (count)</span><span><i style="outline:2px solid var(--warn);outline-offset:-2px;background:var(--sunken)"></i>assigned holiday</span></div>`;
}

WIRE.vacation = root=>{
  root.querySelectorAll("[data-vset]").forEach(el=>el.onchange=()=>{
    let v=el.value; if(/^-?\d+$/.test(v)) v=+v;
    if(el.dataset.vset==="vacations.opCheck") v=!!+el.value;
    setPath(S, el.dataset.vset, v); save(); render();
  });
  root.querySelector("#vacdl").onclick=()=>saveFile("vacation-survey.html", vacPollFile());
  root.querySelector("#vacmail").onclick=()=>copyText(vacEmailText(),"Email text copied");
  root.querySelector("#vaccodes").onclick=()=>vacPasteModal();
  root.querySelector("#vachand").onclick=()=>vacManualModal();
  const se=root.querySelector("#vacseed"); if(se) se.onclick=()=>{ S.vacations.seed=1000+Math.floor(Math.random()*9000); save(); render(); };
  const em=root.querySelector("#vacemail2"); if(em) em.onclick=()=>copyText(vacApprovedEmailText(),"Announcement copied — paste into any email");
  root.querySelectorAll("[data-vacdel]").forEach(b=>b.onclick=()=>{ S.vacations.responses=S.vacations.responses.filter(r=>r.empId!==b.dataset.vacdel); save(); render(); });
  root.querySelectorAll("[data-vacoff]").forEach(b=>b.onclick=()=>{ S.timeoff=S.timeoff.filter(t=>String(t.id)!==b.dataset.vacoff); save(); render(); toast("Undone — those days are open again"); });
  const run=root.querySelector("#vacrun");
  if(run) run.onclick=()=>{
    const R=vacAllocate();
    const out=root.querySelector("#vacout");
    if(!R.grants.length && !R.skipped.length){ out.innerHTML=`<div class="banner warn"><div>No requests to draw from yet.</div></div>`; return; }
    out.innerHTML=`
      <div class="banner ${R.grants.length?"info":"warn"}"><div><b>${R.grants.length} of ${R.asked} get a vacation</b>${R.grants.filter(g=>g.pick===1).length? " — "+R.grants.filter(g=>g.pick===1).length+" got their first choice":""}. Nothing is saved until you press Grant.</div></div>
      ${R.grants.map(g=>{ const e=empById(g.empId)||{name:"?"};
        return `<div class="desrow"><strong style="font-size:13px">${esc(e.name)}</strong>
          <span class="mini">${esc(prettyDate(g.from))} – ${esc(prettyDate(g.to))}</span>
          <span class="chip ${g.pick===1?"ok":""}" style="margin-left:auto">choice #${g.pick}</span></div>`; }).join("")}
      ${R.skipped.length? `<div class="lab" style="margin:10px 0 6px">Couldn't be granted</div>`+
        R.skipped.map(x=>{ const e=empById(x.empId)||{name:"?"};
          return `<div class="mini" style="margin-bottom:4px"><b>${esc(e.name)}</b> — choice #${x.pick} (${esc(prettyDate(x.from))} – ${esc(prettyDate(x.to))}): ${esc(x.why)}</div>`; }).join(""):""}
      ${R.unserved.length? `<div class="help" style="margin-top:8px">Left without a vacation this round: ${esc(R.unserved.map(id=>(empById(id)||{name:"?"}).name).join(", "))} — their requests stay in the list; hand-place them with "Take someone off the schedule" on the Team page, or re-run after loosening the cap.</div>`:""}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="vacapply">Grant these ${R.grants.length}</button></div>`;
    out.querySelector("#vacapply").onclick=()=>{
      R.grants.forEach(g=>{
        S.timeoff.push({id:uid("v"), empId:g.empId, type:"Vacation", start:g.from, end:g.to,
          status:"approved", vac:true, vacPick:g.pick});
        S.vacations.responses=S.vacations.responses.filter(r=>r.empId!==g.empId);
      });
      save(); render();
      toast(R.grants.length+" vacation"+(R.grants.length===1?"":"s")+" granted — the drafter now works around them");
    };
  };
};
function vacPasteModal(){
  modal("Paste vacation reply codes", `
    <div class="stack">
      <div class="help">One code per line. ${S.vacations.deadline? "Requests were due "+esc(prettyDate(S.vacations.deadline))+" — codes still read in after that, but call it what it is.":""}</div>
      <textarea id="vcin" style="min-height:150px;font-family:'IBM Plex Mono',monospace;font-size:11.5px"></textarea>
      <div id="vcres"></div>
    </div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="dovac">Read them in</button>`,
    r=>{ r.querySelector("#dovac").onclick=()=>{
      const lines=r.querySelector("#vcin").value.split(/[\n\r]+/).map(x=>x.trim()).filter(Boolean);
      let ok=0,bad=0,unknown=[];
      lines.forEach(l=>{ try{
        const pr=vacParseCode(l);
        if(!pr.empId){ unknown.push(pr.name); bad++; return; }
        if(!pr.picks.length){ bad++; return; }
        S.vacations.responses=S.vacations.responses.filter(x=>x.empId!==pr.empId);
        S.vacations.responses.push({empId:pr.empId, picks:pr.picks.slice(0,S.vacations.maxPicks||3), at:Date.now()});
        ok++;
      }catch(e){ bad++; } });
      save();
      if(ok){ closeModal(); render(); toast(ok+" response"+(ok===1?"":"s")+" read in"+(bad?" · "+bad+" couldn't be matched":"")); }
      else r.querySelector("#vcres").innerHTML=`<div class="banner crit"><div>None of those matched. ${unknown.length? "Not on the roster: "+esc(unknown.join(", "))+".":"Check the whole code was copied."}</div></div>`;
    }; });
}
function vacManualModal(){
  const V=S.vacations;
  modal("Enter a vacation request by hand", `
    <div class="stack">
      <div class="field"><label>Who</label><select id="vme">${S.employees.filter(e=>e.active).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select></div>
      ${Array.from({length:V.maxPicks||3},(_,i)=>`
        <div class="field"><label>Choice ${i+1}${i?" (optional)":""}</label>
          <div class="row" style="gap:6px"><input type="date" class="vmf" data-i="${i}" style="min-width:130px"><input type="date" class="vmt" data-i="${i}" style="min-width:130px"></div></div>`).join("")}
    </div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="vmsave">Save</button>`,
    r=>{ r.querySelector("#vmsave").onclick=()=>{
      const empId=r.querySelector("#vme").value;
      const picks=[];
      r.querySelectorAll(".vmf").forEach(f=>{
        const i=f.dataset.i, t=r.querySelector('.vmt[data-i="'+i+'"]');
        if(f.value && t.value && t.value>=f.value) picks.push({from:f.value,to:t.value});
      });
      if(!picks.length){ toast("Enter at least one choice with both dates"); return; }
      S.vacations.responses=S.vacations.responses.filter(x=>x.empId!==empId);
      S.vacations.responses.push({empId,picks,at:Date.now()});
      save(); closeModal(); render();
    }; });
}

/* ---------- poll codes ---------- */
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/=+$/,""); }
function b64d(s){ return decodeURIComponent(escape(atob(s.replace(/\s+/g,"")))); }
function parseCode(code){
  const raw=b64d(String(code).trim());
  const p=raw.split("|");
  if(p[0]!=="CD1") throw new Error("bad");
  const H=S.holidays.list;
  const key=p[1];
  const rank=(p[2]||"").split(".").filter(x=>x!=="").map(i=>H[+i]&&H[+i].id).filter(Boolean);
  const cant=(p[3]||"").split(".").filter(x=>x!=="").map(i=>H[+i]&&H[+i].id).filter(Boolean);
  let emp = S.employees.find(e=>e.id===key);
  if(!emp) emp = S.employees.find(e=>e.name.toLowerCase()===key.toLowerCase());
  return {empId:emp?emp.id:null, name:emp?emp.name:key, rank, cant};
}

/* ============================================================
   Vacation calendar — everyone asks at once, ranked; the app
   grants the largest fair set that keeps the floor covered.
   Opt-in: invisible unless S.vacations.on.
   ============================================================ */
function vacDays(from,to){ const out=[]; let d=from,g=0; while(d<=to&&g++<400){ out.push(d); d=addDays(d,1);} return out; }
function vacOverlapsHoliday(from,to){
  return (S.holidays.list||[]).find(h=>h.date>=from&&h.date<=to)||null;
}
function vacApprovedList(){
  return S.timeoff.filter(t=>t.vac&&t.status!=="denied");
}
function vacCountOn(date, extra){
  let c=vacApprovedList().filter(t=>date>=t.start&&date<=t.end).length;
  (extra||[]).forEach(g=>{ if(date>=g.from&&date<=g.to) c++; });
  return c;
}
function vacOpsOk(date, extra){
  /* enough hands left that day to run the base pattern */
  const dow=parseYmd(date).getDay();
  if(S.hours[dow].closed) return true;
  const need=(S.demand[dow]||[]).reduce((t,r)=>t+(r.count||1),0);
  const heads=S.employees.filter(e=>e.active && e.avail[dow]&&e.avail[dow].ok && !onTimeOff(e.id,date)).length;
  return heads - vacCountOn(date, extra) >= need;
}
function vacFairScore(empId, grants){
  /* days of vacation already granted (past 18 months) + this round — fewer = first in line */
  const cut=addDays(ymd(new Date()),-550);
  let d=0;
  vacApprovedList().forEach(t=>{ if(t.empId===empId && t.end>=cut) d+=vacDays(t.start,t.end).length; });
  (grants||[]).forEach(g=>{ if(g.empId===empId) d+=vacDays(g.from,g.to).length; });
  return d;
}
function vacOrder(empIds, grants){
  const V=S.vacations;
  const ladder=S.priority.order||[];
  const lad=id=>{ const i=ladder.indexOf(id); return i<0? 999:i; };
  if(V.rule==="seniority"){
    return empIds.slice().sort((a,b)=>{
      const ea=empById(a)||{}, eb=empById(b)||{};
      const sa=ea.seniority||"9999-12-31", sb=eb.seniority||"9999-12-31";
      return sa.localeCompare(sb) || lad(a)-lad(b);
    });
  }
  if(V.rule==="lottery"){
    let x=V.seed||1234;
    const rnd=()=>{ x=(x*1103515245+12345)%2147483648; return x/2147483648; };
    const arr=empIds.slice(); 
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=arr[i];arr[i]=arr[j];arr[j]=t; }
    return arr;
  }
  /* fairness: least vacation already had goes first */
  return empIds.slice().sort((a,b)=> vacFairScore(a,grants)-vacFairScore(b,grants) || lad(a)-lad(b));
}
function vacAllocate(){
  const V=S.vacations;
  const grants=[], skipped=[];
  const served={};
  const resp=V.responses.filter(r=>empById(r.empId) && (empById(r.empId)||{}).active);
  for(let round=0; round<(V.maxPicks||3); round++){
    const inRound=resp.filter(r=>!served[r.empId] && r.picks[round]);
    const order=vacOrder(inRound.map(r=>r.empId), grants);
    order.forEach(empId=>{
      const r=resp.find(x=>x.empId===empId);
      const p=r.picks[round]; if(!p) return;
      const e=empById(empId);
      const hol=vacOverlapsHoliday(p.from,p.to);
      if(hol){ skipped.push({empId,pick:round+1,from:p.from,to:p.to,why:"overlaps "+hol.name+" — holidays are staffed separately"}); return; }
      if(vacDays(p.from,p.to).length<(V.minDays||1)){ skipped.push({empId,pick:round+1,from:p.from,to:p.to,why:"shorter than the "+V.minDays+"-day minimum — use a normal request instead"}); return; }
      const days=vacDays(p.from,p.to);
      let bad=null;
      const withMe=grants.concat([{empId,from:p.from,to:p.to}]);
      for(const d of days){
        if(V.opCheck){ if(!vacOpsOk(d,withMe)){ bad="on "+prettyDate(d)+" the floor couldn't be covered"; break; } }
        else if(vacCountOn(d,grants)>=(V.maxOff||1)){ bad=prettyDate(d)+" already has "+(V.maxOff||1)+" away, your limit"; break; }
      }
      if(bad){ skipped.push({empId,pick:round+1,from:p.from,to:p.to,why:bad}); return; }
      grants.push({empId,from:p.from,to:p.to,pick:round+1});
      served[empId]=true;
    });
  }
  const unserved=resp.filter(r=>!served[r.empId]).map(r=>r.empId);
  return {grants, skipped, unserved, asked:resp.length};
}
function vacHeat(extra){
  /* anonymous per-date pressure: requested + approved counts, no names */
  const heat={};
  S.vacations.responses.forEach(r=>r.picks.forEach(p=>{ if(p) vacDays(p.from,p.to).forEach(d=>{ heat[d]=heat[d]||{ask:0,ok:0}; heat[d].ask++; }); }));
  vacApprovedList().forEach(t=>vacDays(t.start,t.end).forEach(d=>{ heat[d]=heat[d]||{ask:0,ok:0}; heat[d].ok++; }));
  (extra||[]).forEach(g=>vacDays(g.from,g.to).forEach(d=>{ heat[d]=heat[d]||{ask:0,ok:0}; heat[d].ok++; }));
  return heat;
}
function vacParseCode(line){
  const raw=b64d(line);
  const parts=raw.split("|");
  if(parts[0]!=="VC1") throw new Error("not a vacation code");
  const key=parts[1];
  const e=S.employees.find(x=>x.id===key) ||
          S.employees.find(x=>x.name.trim().toLowerCase()===String(key).trim().toLowerCase());
  const picks=(parts[2]||"").split(".").filter(Boolean).map(seg=>{
    const [f,t]=seg.split("~"); return {from:f,to:t};
  }).filter(p=>/^\d{4}-\d{2}-\d{2}$/.test(p.from)&&/^\d{4}-\d{2}-\d{2}$/.test(p.to)&&p.to>=p.from);
  return {empId:e? e.id:null, name:e? e.name:key, picks};
}

/* ============================================================
   View: Analytics — the record, kept out of the way
   ============================================================ */
function weekKeys(){ return Object.keys(S.weeks).filter(k=>S.weeks[k].assignments.length).sort(); }
function analyticsRange(){
  const keys=weekKeys();
  const n=Math.min(keys.length, S.ui&&S.ui.anWeeks? S.ui.anWeeks : 8);
  return keys.slice(-n);
}
function reqHistory(){
  const rows=[];
  (S.requests||[]).forEach(r=>{
    const e=empById(r.empId); if(!e) return;
    let landed=null, ws=null;
    weekKeys().forEach(k=>{
      const p=reqPeriod(k,1);
      const inWeek = (r.every&&r.every.length)
        ? (r.from<=p.to && (!r.to||r.to==="2099-01-01"||r.to>=p.from))
        : !(r.to<p.from || r.from>p.to);
      if(inWeek && !ws){ ws=k; landed=reqOutcome(r,k,1); }
    });
    rows.push({r, e, ws, landed,
      state: r.status==="declined"? "declined" : !landed? "pending" : landed.ok===true? "granted" : landed.ok===false? "missed" : "noted"});
  });
  return rows;
}
function vAnalytics(){
  const keys=analyticsRange();
  const roster=S.employees.filter(e=>e.active);
  const hist=reqHistory();
  const counts={granted:0,missed:0,declined:0,pending:0,noted:0};
  hist.forEach(x=>counts[x.state]++);
  const totalDecided=counts.granted+counts.missed+counts.declined;

  /* per-week totals */
  const series=keys.map(k=>{
    const wk=S.weeks[k];
    const mins=wk.assignments.reduce((t,a)=>t+paidMinutes(a),0);
    const open=(function(){ const save0=S.currentWeek; S.currentWeek=k; const n=openSlots(k).length; S.currentWeek=save0; return n; })();
    return {ws:k, shifts:wk.assignments.length, hours:mins/60, open, posted:!!wk.published,
      cost: costOn()? weekCost(k) : 0};
  });
  const maxH=Math.max(1,...series.map(x=>x.hours));

  /* per-person */
  const per=roster.map(e=>{
    let mins=0, shifts=0, good=0, bad=0, hol=0;
    keys.forEach(k=>{
      S.weeks[k].assignments.filter(a=>a.empId===e.id).forEach(a=>{
        mins+=paidMinutes(a); shifts++;
        const d=desireOf(a.shiftId,a.dow);
        if(d>0) good++; else if(d<0) bad++;
      });
      hol += holidaysIn(k).filter(h=>S.weeks[k].assignments.some(a=>a.empId===e.id && a.date===h.date)).length;
    });
    const mine=hist.filter(x=>x.e.id===e.id);
    return {e, mins, shifts, good, bad, hol,
      granted:mine.filter(x=>x.state==="granted").length,
      denied:mine.filter(x=>x.state==="declined"||x.state==="missed").length};
  }).sort((a,b)=>b.mins-a.mins);

  const bar=(v,mx,cls)=>`<div class="abar"><i class="${cls||""}" style="width:${Math.round(v/Math.max(1,mx)*100)}%"></i></div>`;

  return `
  <div class="stack">
    <div class="banner info"><div><b>The record.</b> What you scheduled, what people asked for, and what you had to turn down — across ${keys.length} week${keys.length===1?"":"s"}. None of this is on the home screen on purpose; it's here when you want to look, and quiet when you don't.</div>
      <select data-set="ui.anWeeks" style="flex:none;margin-left:auto;max-width:150px">
        ${[4,8,12,26,52].map(n=>`<option value="${n}" ${(S.ui.anWeeks||8)===n?"selected":""}>Last ${n} weeks</option>`).join("")}
      </select></div>

    ${!keys.length? `<div class="empty card" style="padding:40px"><strong>Nothing to look at yet</strong>Draft a week or two and the picture builds itself.</div>` : `

    <div class="hgrid">
      <div class="tile" style="cursor:default"><span class="tn">${series.reduce((t,x)=>t+x.shifts,0)}</span>
        <span class="tlab">shifts scheduled</span><span class="td">across ${keys.length} week${keys.length===1?"":"s"}</span></div>
      <div class="tile" style="cursor:default"><span class="tn">${Math.round(series.reduce((t,x)=>t+x.hours,0))}</span>
        <span class="tlab">paid hours</span><span class="td">${Math.round(series.reduce((t,x)=>t+x.hours,0)/Math.max(1,keys.length))} a week on average</span></div>
      <div class="tile ${counts.missed+counts.declined? "bad":"good"}" style="cursor:default"><span class="tn">${counts.declined+counts.missed}</span>
        <span class="tlab">requests turned down</span><span class="td">${totalDecided? Math.round(counts.granted/totalDecided*100):100}% of asks were met</span></div>
      <div class="tile ${series.reduce((t,x)=>t+x.open,0)? "bad":"good"}" style="cursor:default"><span class="tn">${series.reduce((t,x)=>t+x.open,0)}</span>

WIRE.analytics = root=>{
  const e1=root.querySelector("#anexp");
  if(e1) e1.onclick=()=>{
    const keys=analyticsRange();
    const rows=[["Week","Shifts","Paid hours","Left open","Posted"].concat(costOn()?["Cost"]:[])];
    keys.forEach(k=>{ const wk=S.weeks[k];
      const mins=wk.assignments.reduce((t,a)=>t+paidMinutes(a),0);
      const cur=S.currentWeek; S.currentWeek=k; const open=openSlots(k).length; S.currentWeek=cur;
      rows.push([k, wk.assignments.length, (mins/60).toFixed(2), open, wk.published?"yes":"no"].concat(costOn()?[Math.round(weekCost(k))]:[]));
    });
    rows.push([]);
    rows.push(["Person","Paid hours","Shifts","Wanted shifts","Unwanted shifts","Holidays worked","Requests met","Requests not met"]);
    const hist=reqHistory();
    S.employees.filter(e=>e.active).forEach(e=>{
      let mins=0,shifts=0,good=0,bad=0,hol=0;
      keys.forEach(k=>{ S.weeks[k].assignments.filter(a=>a.empId===e.id).forEach(a=>{
        mins+=paidMinutes(a); shifts++; const d=desireOf(a.shiftId,a.dow); if(d>0)good++; else if(d<0)bad++; });
        hol += holidaysIn(k).filter(h=>S.weeks[k].assignments.some(a=>a.empId===e.id&&a.date===h.date)).length; });
      const mine=hist.filter(x=>x.e.id===e.id);
      rows.push([e.name,(mins/60).toFixed(2),shifts,good,bad,hol,
        mine.filter(x=>x.state==="granted").length, mine.filter(x=>x.state==="declined"||x.state==="missed").length]);
    });
    saveFile("schedule-record.csv", rows.map(csvRow).join("\n"));
  };
  const e2=root.querySelector("#anreq");
  if(e2) e2.onclick=()=>{
    const rows=[["Who","Asked for","From","To","Repeats","Firmness","Outcome","What happened","Their note"]];
    reqHistory().forEach(x=>rows.push([x.e.name, reqKind(x.r.kind).t, x.r.from, x.r.to,
      reqRepeatText(x.r)||"", x.r.hard?"must":"if possible", x.state, x.landed? x.landed.say:"", x.r.note||""]));
    saveFile("requests-record.csv", rows.map(csvRow).join("\n"));
  };
};

let HCHAT=[];
function kbAsk(q){
  const words=(q||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2);
  if(!words.length) return {best:null, more:[]};
  const GENERIC={work:1,works:1,working:1,week:1,shift:1,shifts:1,schedule:1,schedules:1,people:1,person:1,staff:1,how:1,whole:1,see:1,the:1,does:1,doesnt:1,make:1,need:1};
  const scored=KB.map(e=>{
    let sc=0;
    const kt=e.k+" "+e.t.toLowerCase();
    const body=e.a.toLowerCase();
    words.forEach(w=>{
      const wt=GENERIC[w]? 0.5 : 3;
      if(kt.includes(w)) sc+=wt;
      else if(body.includes(w)) sc+=(GENERIC[w]?0.2:1);
    });
    return {e, sc};
  }).sort((a,b)=>b.sc-a.sc);
  const best=scored[0].sc>=3? scored[0].e : null;
  const more=scored.slice(best?1:0, best?3:4).filter(x=>x.sc>=2).map(x=>x.e);
  return {best, more};
}

/* Calendar files — floating local times so a 9:00 shift is 9:00 wherever the phone is */
function icsStamp(){ const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+"Z"; }
function icsDT(date, min){ const d=min>=1440? addDays(date,1):date; const m=((min%1440)+1440)%1440;
  const p=n=>String(n).padStart(2,"0");
  return d.replace(/-/g,"")+"T"+p(Math.floor(m/60))+p(m%60)+"00"; }
function icsEsc(x){ return String(x||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function icsText(empId, ws){
  const wk=getWeek(ws);
  const list=wk.assignments.filter(a=>!empId || a.empId===empId)
    .slice().sort((a,b)=>a.date.localeCompare(b.date)||a.startMin-b.startMin);
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Weeksolved//Schedule//EN","CALSCALE:GREGORIAN",
    "X-WR-CALNAME:"+icsEsc((S.org.name||"Work")+" schedule")];
  const stamp=icsStamp();
  list.forEach(a=>{
    const e=empById(a.empId)||{name:"Staff"};
    const sh=aShift(a);
    const st=a.station? stationById(a.station):null;
    const b=a.breaks||{meals:[]};
    const meals=(b.meals||[]).filter(m=>!m.waived).map(m=>"Meal "+m2disp(m.start)+"\u2013"+m2disp(m.end)).join(", ");
    const desc=[roleName(a.roleId), st? "Station: "+st.name:"", meals, a.topUp? (S.rules.topUpLabel||"Project time"):""].filter(Boolean).join("\n");
    L.push("BEGIN:VEVENT",
      "UID:"+a.id+"@weeksolved.com",
      "DTSTAMP:"+stamp,
      "DTSTART:"+icsDT(a.date,a.startMin),
      "DTEND:"+icsDT(a.date,a.endMin),
      "SUMMARY:"+icsEsc(empId? sh.label+" \u2014 "+(S.org.name||"Work") : e.name+" \u2014 "+sh.label),
      "LOCATION:"+icsEsc([S.org.name,S.org.site].filter(Boolean).join(", ")),
      desc? "DESCRIPTION:"+icsEsc(desc):"",
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.filter(Boolean).join("\r\n")+"\r\n";
}

/* ============================================================
   Shift desirability + the priority ladder
   ============================================================ */
const DESIRE_LABEL = {"-2":"Nobody wants it","-1":"Less wanted","0":"Neutral","1":"Wanted","2":"Everyone wants it"};
const DESIRE_SHORT = {"-2":"−−","-1":"−","0":"·","1":"+","2":"++"};

function desireOf(shiftId, dow){
  const sh = shiftById(shiftId);
  const sd = sh && typeof sh.desire==="number" ? sh.desire : 0;
  const dd = (S.dayDesire && typeof S.dayDesire[dow]==="number") ? S.dayDesire[dow] : 0;
  return clamp(sd + dd, -3, 3);
}
function desireBand(v){ return v>0?"good": v<0?"bad":"flat"; }

/* Years with the company, as a number. */
function tenure(e){
  if(!e.seniority) return 0;
  return Math.max(0,(Date.now()-parseYmd(e.seniority).getTime())/(1000*3600*24*365.25));
}
function tenureLabel(e){
  const y=tenure(e);
  if(!e.seniority) return "no start date";
  if(y<1) return Math.round(y*12)+" mo";
  return (Math.round(y*10)/10)+" yr"+(y>=2?"s":"");
}

/* Deterministic shuffle so a lottery is reproducible and auditable. */
function seededShuffle(arr, seed){
  const a=arr.slice(); let x = (seed*9301+49297)%233280;
  for(let i=a.length-1;i>0;i--){
    x = (x*9301+49297)%233280;
    const j = Math.floor(x/233280*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* How many desirable / undesirable shifts each person has already received. */
function ledgerCounts(){
  const L={};
  S.employees.forEach(e=>{ L[e.id]={good:0,bad:0,total:0}; });
  const from = S.priority.ledgerFrom||"posted";
  Object.keys(S.weeks).forEach(ws=>{
    const wk=S.weeks[ws];
    if(from==="posted" && !wk.published) return;
    if(from==="current" && ws!==S.currentWeek) return;
    wk.assignments.forEach(a=>{
      const rec=L[a.empId]; if(!rec) return;
      const d=desireOf(a.shiftId,a.dow);
      rec.total++; if(d>0) rec.good++; else if(d<0) rec.bad++;
    });
  });
  const adj=S.priority.adjust||{};
  S.employees.forEach(e=>{ L[e.id].good += (adj[e.id]||0); L[e.id].net = L[e.id].good - L[e.id].bad; });
  return L;
}

/* The ordered roster the current mode produces. Index 0 = first pick. */
function priorityOrder(){
  const pool = S.employees.filter(e=>e.active);
  const mode = S.priority.mode;
  if(mode==="off") return pool.map(e=>e.id);
  if(mode==="seniority")
    return pool.slice().sort((a,b)=> tenure(b)-tenure(a) || a.name.localeCompare(b.name)).map(e=>e.id);
  if(mode==="custom"){
    const saved=(S.priority.order||[]).filter(id=>pool.some(e=>e.id===id));
    pool.forEach(e=>{ if(!saved.includes(e.id)) saved.push(e.id); });
    return saved;
  }
  if(mode==="rotate"){
    const L=ledgerCounts();
    return pool.slice().sort((a,b)=> (L[a.id].net - L[b.id].net) || (tenure(b)-tenure(a)) || a.name.localeCompare(b.name)).map(e=>e.id);
  }
  if(mode==="lottery"){
    const wkSeed = S.currentWeek? parseInt(S.currentWeek.replace(/-/g,""),10)%99991 : 1;
    return seededShuffle(pool.map(e=>e.id), (S.priority.seed||1)*7919 + wkSeed);
  }
  return pool.map(e=>e.id);
}
let _priCache=null;
function priorityIndex(empId){
  if(!_priCache) _priCache = priorityOrder();
  const i=_priCache.indexOf(empId);
  return i<0? _priCache.length : i;
}
function priorityRefresh(){ _priCache=null; }

/* The nudge the ladder gives one candidate for one shift. */
function priorityBonus(empId, shiftId, dow){
  const P=S.priority;
  if(!P || P.mode==="off" || !P.strength) return 0;
  const d = desireOf(shiftId,dow);
  if(P.applyTo==="desirable" && d===0) return 0;
  const n = Math.max(2, (_priCache||priorityOrder()).length);
  const idx = priorityIndex(empId);
  const standing = 1 - idx/(n-1);            /* 1 at the top, 0 at the bottom */
  const weight = [0,18,45,110][clamp(P.strength,0,3)];
  const sign = d>0? 1 : d<0? -1 : 0.45;      /* first pick on good days, first refusal on bad ones */
  const depth = d===0? 1 : Math.min(1, Math.abs(d)/2);
  return sign * depth * weight * (standing - 0.5) * 2;
}

let undoStack=[], lastJSON=null, undoing=false;
function trackForUndo(){
  if(undoing) return;
  if(lastJSON){ undoStack.push(lastJSON); if(undoStack.length>40) undoStack.shift(); }
  lastJSON = JSON.stringify(S);
}
function undo(){
  if(!undoStack.length){ toast("Nothing to undo"); return; }
  undoing=true;
  S = migrate(JSON.parse(undoStack.pop()));
  lastJSON = JSON.stringify(S);
  lsSave();
  if(DB) DB.doc("app/state").set({json:lastJSON, at:Date.now()}).catch(()=>{});
  undoing=false;
  render(); toast("Undone");
}

/* ============================================================
   Who else could work this
   ============================================================ */
function candidatesFor(shiftId, date, dow, roleId, excludeEmpId){
  const sh = shiftById(shiftId); if(!sh) return [];
  const [aMin,bMin] = shiftMinutes(sh);
  const ws = weekStartOf(date, S.org.weekStart);
  const wk = getWeek(ws);
  const out=[];
  S.employees.forEach(e=>{
    if(e.id===excludeEmpId) return;
    const blocks=[];
    if(!e.active) blocks.push("not on the roster");
    if(roleId && !e.roleIds.includes(roleId)) blocks.push("not qualified as "+roleName(roleId));
    if(!availOk(e,dow,aMin,bMin)){
      const av=e.avail[dow];
      blocks.push(av&&av.ok? "only free "+m2disp(t2m(av.from))+"–"+m2disp(t2m(av.to))+" that day" : "not available "+DSHORT[dow]);
    }
    if(onTimeOff(e.id,date)) blocks.push("on "+((timeOffFor(e.id,date)||{}).type||"time off"));
    const sameDay = wk.assignments.filter(a=>a.empId===e.id && a.date===date);
    if(sameDay.length) blocks.push("already on "+(shiftById(sameDay[0].shiftId)||{label:"a shift"}).label);
    const mins = empWeekMinutes(e.id,ws), add = paidEstimate(aMin,bMin);
    if(e.maxH && mins+add > e.maxH*60+1) blocks.push("would hit "+fmtHrs(mins+add)+" against a "+e.maxH+"h cap");
    const days = empDays(e.id,ws);
    if(e.maxD && days>=e.maxD && !sameDay.length) blocks.push(days+" days already, cap is "+e.maxD);
    const prev = wk.assignments.filter(a=>a.empId===e.id && a.date===addDays(date,-1));
    if(prev.length){
      const gap = (aMin+1440) - Math.max.apply(null,prev.map(x=>x.endMin));
      if(gap < (S.rules.minRestH||0)*60) blocks.push("only "+fmtHrs(gap)+" off after the night before");
    }
    const likes=[];
    if(e.prefShiftIds.includes(shiftId)) likes.push("asked for this shift");
    if(e.avoidShiftIds.includes(shiftId)) likes.push("would rather avoid it");
    if((e.prefDaysOff||[]).includes(dow)) likes.push("prefers "+DSHORT[dow]+" off");
    if(e.minH && mins < e.minH*60) likes.push(fmtHrs(e.minH*60-mins)+" short of guaranteed hours");
    out.push({emp:e, blocks, likes, mins, add,
      rank: blocks.length*1000 - (e.prefShiftIds.includes(shiftId)?30:0)
            + (e.avoidShiftIds.includes(shiftId)?25:0)
            + ((e.prefDaysOff||[]).includes(dow)?20:0)
            + (e.minH&&mins<e.minH*60? -20:0) + mins/60 });
  });
  return out.sort((a,b)=>a.rank-b.rank);
}

   Labor cost
   ============================================================ */
/* Holidays this week, and who gets paid for them whether they work or not. */
function holidaysIn(ws){
  const dates=weekDates(ws).map(d=>d.date);
  return (S.holidays.list||[]).filter(h=>dates.includes(h.date));
}
function holidayPayFor(e, ws){
  if(!e.holidayPay) return {hours:0, days:0};
  const n=holidaysIn(ws).length;
  return {hours: n*(e.holidayPayH||8), days:n};
}
function holidayPayCost(ws){
  if(!costOn()) return 0;
  return S.employees.filter(x=>x.active).reduce((t,e)=>{
    const hp=holidayPayFor(e,ws);
    return t + hp.hours*(e.rate||0);
  },0);
}
function costOf(a){ const e=empById(a.empId); if(!e||!e.rate) return 0;
  const paid=paidMinutes(a)/60;
  const ot=Math.max(0,paid-(S.org.otDailyH||8)), reg=paid-ot;
  return reg*e.rate + ot*e.rate*1.5;
}
function weekCost(ws){ return peekWeek(ws).assignments.reduce((t,a)=>t+costOf(a),0) + holidayPayCost(ws); }
function money(n){ return "$"+Math.round(n).toLocaleString(); }
function haveRates(){ return !!S.org.trackCost && S.employees.some(e=>e.rate>0); }
function costOn(){ return !!S.org.trackCost; }

function saveTemplate(){
  const wk=getWeek();
  if(!wk.assignments.length){ toast("Nothing to save — build the week first"); return; }
  modal("Save this week as a template",
    `<div class="field"><label>Name it</label><input type="text" id="tn" placeholder="Standard week" value="Standard week"></div>
     <div class="help" style="margin-top:10px">A template stores who works which shift on which weekday. Apply it to any future week and the dates shift along with it.</div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="tsave">Save template</button>`,
    r=>{ r.querySelector("#tsave").onclick=()=>{
      S.templates = S.templates||[];
      S.templates.push({id:uid("tpl"), name:r.querySelector("#tn").value.trim()||"Template",
        rows: wk.assignments.map(a=>({empId:a.empId,dow:a.dow,shiftId:a.shiftId,roleId:a.roleId})), at:Date.now()});
      save(); closeModal(); render(); toast("Template saved");
    }; });
}
function applyTemplate(id){
  const t=(S.templates||[]).find(x=>x.id===id); if(!t) return;
  const wk=getWeek(); const dates=weekDates();
  wk.assignments = wk.assignments.filter(a=>a.locked);
  t.rows.forEach(r=>{
    const d = dates.find(x=>x.dow===r.dow); if(!d) return;
    const sh = shiftById(r.shiftId); if(!sh) return;
    if(!empById(r.empId)) return;
    if(wk.assignments.some(a=>a.empId===r.empId && a.date===d.date)) return;
    const [aM,bM]=shiftMinutes(sh);
    const rec={id:uid("a"),empId:r.empId,date:d.date,dow:r.dow,shiftId:r.shiftId,startMin:aM,endMin:bM,roleId:r.roleId,locked:false};
    applyBreaks(rec); wk.assignments.push(rec);
  });
  dates.forEach(({date})=>staggerDay(wk.assignments.filter(a=>a.date===date && !a.locked), wk.assignments.filter(a=>a.date===date)));
  wk.assignments.sort((x,y)=>x.date.localeCompare(y.date)||x.startMin-y.startMin);
  wk.generatedAt=Date.now(); save(); render(); toast("Template applied");
}

    <div class="palfoot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>esc</kbd> close</span></div>
  </div></div>`;

  const q=root.querySelector("#palq"), res=root.querySelector("#palr");
  let sel=0, shown=items;
  const draw=()=>{
    const v=q.value.toLowerCase().trim();
    shown = v? items.filter(i=>i.t.toLowerCase().includes(v)) : items;
    sel=clamp(sel,0,Math.max(0,shown.length-1));
    res.innerHTML = shown.length? shown.slice(0,12).map((i,n)=>
      `<button data-n="${n}" data-sel="${n===sel?1:0}">${esc(i.t)}<span class="kind">${i.kind}</span></button>`).join("")

  };
  const close=()=>{ root.remove(); document.removeEventListener("keydown",key,true); };
  const key=ev=>{
    if(ev.key==="Escape"){ ev.stopPropagation(); close(); }
    else if(ev.key==="ArrowDown"){ ev.preventDefault(); sel=Math.min(sel+1,Math.min(11,shown.length-1)); draw(); }

    else if(ev.key==="Enter"){ ev.preventDefault(); if(shown[sel]){ const r=shown[sel].run; close(); r(); } }
  };
  document.addEventListener("keydown",key,true);
  root.querySelector(".pal").addEventListener("mousedown",e=>{ if(e.target.classList.contains("pal")) close(); });
  q.oninput=()=>{ sel=0; draw(); }; draw(); q.focus();
}
document.addEventListener("keydown",e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""));
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); palette(); return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z" && !typing){ e.preventDefault(); undo(); return; }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if($("#modalroot").innerHTML || $("#palroot")) return;
  if(e.key==="/"){ e.preventDefault(); palette(); }
  else if(e.key==="w"){ go("week"); } else if(e.key==="d"){ go("day"); }
  else if(e.key==="t"){ go("team"); } else if(e.key==="o"){ go("home"); }
  else if(e.key==="h"){ go("holidays"); } else if(e.key==="e"){ go("export"); }
  else if(e.key==="r"){ go("requests"); } else if(e.key===","){ go("settings"); }
  else if(e.key==="ArrowLeft" && (VIEW==="week"||VIEW==="overview")){ S.currentWeek=addDays(S.currentWeek,-7); save(); render(); }
  else if(e.key==="ArrowRight" && (VIEW==="week"||VIEW==="overview")){ S.currentWeek=addDays(S.currentWeek,7); save(); render(); }
});

function swapModal(ws){
  ws=ws||S.currentWeek;
  const wk=getWeek(ws);
  if(wk.assignments.length<2){ toast("Two shifts on the board are needed for a trade"); return; }
  const opt=a=>{ const e=empById(a.empId)||{name:"—"}, sh=aShift(a);
    return `<option value="${a.id}">${DSHORT[a.dow]} · ${m2disp(a.startMin)}–${m2disp(a.endMin)} ${esc(sh.label)} · ${esc(e.name)}</option>`; };
  const sorted=wk.assignments.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.startMin-b.startMin);
  modal("Check a trade", `
    <div class="stack">
      <div class="help">Two people want to swap. Pick both shifts and the trade is checked against every rule — hours, turnaround, availability, coverage, licenses — before anything moves. Nothing changes until you say so.</div>
      <div class="field"><label>First shift</label><select id="sw1">${sorted.map(opt).join("")}</select></div>
      <div class="field"><label>Trades with</label><select id="sw2">${sorted.map(opt).join("")}</select></div>
      <div id="swout" class="stack"></div>
    </div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn" id="swchk">Check it</button><button class="btn primary" id="swgo" disabled>Make the trade</button>`,
    r=>{
      let checked=null;
      const box=r.querySelector("#swout"), go=r.querySelector("#swgo");
      const reset=()=>{ checked=null; go.disabled=true; box.innerHTML=""; };
      r.querySelector("#sw1").onchange=reset; r.querySelector("#sw2").onchange=reset;
      const doSwap=(x,y)=>{ const t=x.empId; x.empId=y.empId; y.empId=t;
        const ex=empById(x.empId), ey=empById(y.empId);
        if(x.roleId && ex && !ex.roleIds.includes(x.roleId)) x.roleId=ex.roleIds[0]||null;
        if(y.roleId && ey && !ey.roleIds.includes(y.roleId)) y.roleId=ey.roleIds[0]||null;
        applyBreaks(x); applyBreaks(y); };
      r.querySelector("#swchk").onclick=()=>{
        const a1=wk.assignments.find(a=>a.id===r.querySelector("#sw1").value);
        const a2=wk.assignments.find(a=>a.id===r.querySelector("#sw2").value);
        if(!a1||!a2||a1===a2){ box.innerHTML='<div class="banner warn"><div>Pick two different shifts.</div></div>'; return; }
        if(a1.empId===a2.empId){ box.innerHTML='<div class="banner warn"><div>Those are both '+esc((empById(a1.empId)||{name:"the same person"}).name)+"'s shifts — nothing to trade.</div></div>"; return; }
        const e1=empById(a1.empId), e2=empById(a2.empId);
        if(a1.roleId && e2 && !e2.roleIds.includes(a1.roleId)){
          box.innerHTML='<div class="banner warn"><div><b>'+esc(e2.name)+"</b> isn't a "+esc(roleName(a1.roleId).toLowerCase())+", which that shift requires. The trade can't work as-is.</div></div>"; return; }
        if(a2.roleId && e1 && !e1.roleIds.includes(a2.roleId)){
          box.innerHTML='<div class="banner warn"><div><b>'+esc(e1.name)+"</b> isn't a "+esc(roleName(a2.roleId).toLowerCase())+", which that shift requires. The trade can't work as-is.</div></div>"; return; }
        const before=new Set(validate(ws).map(vKey));
        const keep1={empId:a1.empId,roleId:a1.roleId}, keep2={empId:a2.empId,roleId:a2.roleId};
        doSwap(a1,a2);
        const fresh=validate(ws).filter(v=>!before.has(vKey(v)));
        /* put it back exactly */
        a1.empId=keep1.empId; a1.roleId=keep1.roleId; a2.empId=keep2.empId; a2.roleId=keep2.roleId;
        applyBreaks(a1); applyBreaks(a2);
        if(!fresh.length){
          box.innerHTML='<div class="banner info"><div><b>Clean trade.</b> Every rule still holds with '+esc(e1.name.split(" ")[0])+" and "+esc(e2.name.split(" ")[0])+" swapped.</div></div>";
          checked={a1,a2}; go.disabled=false;
        } else {
          box.innerHTML='<div class="banner warn"><div><b>This trade breaks '+fresh.length+' thing'+(fresh.length===1?"":"s")+':</b><br>'+
            fresh.slice(0,4).map(v=>esc(v.title)+" — "+esc(v.detail)).join("<br>")+
            (fresh.length>4? "<br>…and "+(fresh.length-4)+" more":"")+
            "</div></div>"+'<div class="mini">You can still make it if the trade matters more — it stays flagged in the conflicts list.</div>';
          checked={a1,a2}; go.disabled=false;
        }
      };
      go.onclick=()=>{
        if(!checked) return;
        doSwap(checked.a1, checked.a2);
        checked.a1.locked=true; checked.a2.locked=true;
        save(); closeModal(); render(); toast("Traded and locked");
      };
    });
}

    <div class="stack">
      <div class="mini">${DAYS[dow]} ${prettyFull(date)} · ${m2disp(aMin)}–${m2disp(bMin)} · ${esc(roleName(roleId))}</div>
      ${free.length? `<div><div class="lab" style="margin-bottom:6px">Clear to take it</div>${candidateHTML(free,"data-pick")}</div>`
        : `<div class="banner warn"><div><b>Nobody clears every limit.</b> The list below shows exactly what is in the way for each person — sometimes the answer is to move a different shift first, or to accept one overtime hour.</div></div>`}
      ${blocked.length? `<div><div class="lab" style="margin:12px 0 6px">Blocked, and by what</div>${candidateHTML(blocked,"data-pick")}</div>`:""}
    </div>`, `<button class="btn" data-close>Close</button>`,
    r=>{
      r.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
        const empId=b.dataset.pick, e=empById(empId);
        const rec={id:uid("a"),empId,date,dow,shiftId,startMin:aMin,endMin:bMin,
          roleId:roleId||e.roleIds[0]||null,locked:true};
        applyBreaks(rec);
        const wk=getWeek(weekStartOf(date,S.org.weekStart));
        wk.assignments.push(rec);
        wk.assignments.sort((x,y)=>x.date.localeCompare(y.date)||x.startMin-y.startMin);
        staggerDay(wk.assignments.filter(a=>a.date===date && !a.locked), wk.assignments.filter(a=>a.date===date));
        save(); closeModal(); render(); toast(e.name+" added and locked");
      });
    });
}

let DRAG=null;
function wireDragDrop(root){
  root.querySelectorAll(".shiftblk[data-edita]").forEach(el=>{
    el.setAttribute("draggable","true");
    el.addEventListener("dragstart",ev=>{
      DRAG=el.dataset.edita; el.classList.add("dragging");
      try{ ev.dataTransfer.setData("text/plain",DRAG); ev.dataTransfer.effectAllowed="move"; }catch(e){}
    });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); DRAG=null;
      root.querySelectorAll(".ecell").forEach(c=>c.classList.remove("drop","nodrop")); });
  });
  root.querySelectorAll(".ecell").forEach((cell,i)=>{
    cell.addEventListener("dragover",ev=>{
      if(!DRAG) return; ev.preventDefault();
      const t=cellTarget(cell); if(!t) return;
      const a=getWeek().assignments.find(x=>x.id===DRAG); if(!a) return;
      const e=empById(t.empId);
      const sh=shiftById(a.shiftId);
      const [aM,bM]=shiftMinutes(sh);
      const clean = e && availOk(e,t.dow,aM,bM) && !onTimeOff(e.id,t.date)
        && !getWeek().assignments.some(x=>x.id!==a.id && x.empId===t.empId && x.date===t.date);
      cell.classList.toggle("drop",clean); cell.classList.toggle("nodrop",!clean);
    });
    cell.addEventListener("dragleave",()=>cell.classList.remove("drop","nodrop"));
    cell.addEventListener("drop",ev=>{
      ev.preventDefault(); cell.classList.remove("drop","nodrop");
      if(!DRAG) return;
      const t=cellTarget(cell); if(!t) return;
      const wk=getWeek(); const a=wk.assignments.find(x=>x.id===DRAG); if(!a) return;
      if(wk.assignments.some(x=>x.id!==a.id && x.empId===t.empId && x.date===t.date)){
        toast((empById(t.empId)||{name:"They"}).name+" is already on that day"); return;
      }
      a.empId=t.empId; a.date=t.date; a.dow=t.dow;
      const e=empById(t.empId);
      if(e && !e.roleIds.includes(a.roleId)) a.roleId = e.roleIds[0]||null;
      applyBreaks(a); a.locked=true;
      wk.assignments.sort((x,y)=>x.date.localeCompare(y.date)||x.startMin-y.startMin);
      save(); render();
      const V=validate().filter(v=>v.sev==="crit" && v.empId===t.empId && v.date===t.date);
      toast(V.length? "Moved — "+V[0].title.split(" — ")[0].toLowerCase() : "Moved and locked");
    });
  });
}
function cellTarget(cell){
  const row=cell.parentElement;
  const cells=[...row.children];
  const idx=cells.indexOf(cell)-1;
  const dates=weekDates();
  if(idx<0||idx>6) return null;
  const rows=[...row.parentElement.querySelectorAll(".erow")];
  const rowIdx=rows.indexOf(row);
  const roster=S.employees.filter(e=>e.active);
  const emp=roster[rowIdx];
  if(!emp) return null;
  return {empId:emp.id, date:dates[idx].date, dow:dates[idx].dow};
}

boot();
